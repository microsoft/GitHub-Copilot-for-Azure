# 5aaa005e426258cbd1924f36dddc29815abac632, evals/azure-skills/azure-diagnostics/eval.yaml.
name: azure-diagnostics-harbor-smoke
description: Container App restart skill-routing smoke test.
defaults:
  runs: 1
  timeout: "10m"
  exporter:
    - name: harbor
      args:
        baseImage: ubuntu:24.04
agent_environment:
  skills:
    - ../tasks/container-app-restart-troubleshooting/environment/skills/azure-diagnostics
scoring:
  threshold: 0.8
stimuli:
  - name: "Container App restart troubleshooting"
    prompt: "My Azure Container App keeps restarting, how do I troubleshoot it?"
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: routing
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-diagnostics
      - type: output-not-matches
        config:
          pattern: "(?im)^(?:fatal error|unhandled exception)(?:\\s|:)"
