# Exports GH_TOKEN_<Owner> for each owner, or GH_TOKEN when one owner is requested.

parameters:
  - name: TokenOwners
    type: object
    default:
      - Azure
  - name: VariableNamePrefix
    type: string
    default: GH_TOKEN
  - name: AlwaysUseOwnerSuffix
    type: boolean
    default: false
  - name: ExportAsOutputVariable
    type: boolean
    default: false
  - name: ScriptDirectory
    type: string
    default: eng/common/scripts

steps:
  - task: AzureCLI@2
    displayName: Login to GitHub
    inputs:
      azureSubscription: AzureSDKEngKeyVault Secrets
      scriptType: pscore
      scriptLocation: scriptPath
      scriptPath: ${{ parameters.ScriptDirectory }}/login-to-github.ps1
      arguments: >
        -InstallationTokenOwners '${{ join(''',''', parameters.TokenOwners) }}'
        -VariableNamePrefix '${{ parameters.VariableNamePrefix }}'
        -AlwaysUseOwnerSuffix:$${{ parameters.AlwaysUseOwnerSuffix }}
        -ExportAsOutputVariable:$${{ parameters.ExportAsOutputVariable }}
