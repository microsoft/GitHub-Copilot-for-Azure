parameters:
  - name: OSName
    type: string
  - name: Matrix
    type: string
  - name: MaxParallel
    type: number
  - name: HostArchitecture
    type: string
    default: ''

jobs:
  - job: Build_${{ parameters.OSName }}_${{ coalesce(parameters.HostArchitecture, 'x64') }}
    displayName: Native AOT ${{ parameters.OSName }} ${{ coalesce(parameters.HostArchitecture, 'x64') }}
    timeoutInMinutes: 90
    condition: and(succeeded(), ne(${{ parameters.Matrix }}, '{}'))
    strategy:
      maxParallel: ${{ parameters.MaxParallel }}
      matrix: $[ ${{ parameters.Matrix }} ]
    variables:
      MuslBuildImage: ''
    pool:
      name: $(Pool)
      ${{ if eq(parameters.OSName, 'macOS') }}:
        vmImage: $(OSVmImage)
      ${{ else }}:
        image: $(OSVmImage)
      os: ${{ parameters.OSName }}
      ${{ if ne(parameters.HostArchitecture, '') }}:
        hostArchitecture: ${{ parameters.HostArchitecture }}

    steps:
      - checkout: self
        fetchDepth: 0

      - task: NuGetAuthenticate@1
        displayName: Authenticate Azure SDK NuGet feed

      - task: PowerShell@2
        displayName: Resolve .NET SDK version
        inputs:
          pwsh: true
          targetType: inline
          script: |
            $globalJsonPath = Join-Path '$(Build.SourcesDirectory)' 'telemetry-reporter/global.json'
            $sdkVersion = (Get-Content -LiteralPath $globalJsonPath -Raw -ErrorAction Stop | ConvertFrom-Json).sdk.version
            if ([string]::IsNullOrWhiteSpace($sdkVersion)) {
              Write-Error "Unable to read sdk.version from '$globalJsonPath'."
              exit 1
            }
            Write-Host "##vso[task.setvariable variable=DotNetSdkVersion]$sdkVersion"

      - task: UseDotNet@2
        displayName: Install .NET SDK $(DotNetSdkVersion)
        retryCountOnTaskFailure: 3
        inputs:
          packageType: sdk
          version: $(DotNetSdkVersion)
          performMultiLevelLookup: true

      - ${{ if eq(parameters.OSName, 'linux') }}:
          - task: PowerShell@2
            displayName: Install Native AOT prerequisites
            condition: and(succeeded(), not(startsWith(variables['BuildRuntimeIdentifier'], 'linux-musl-')))
            inputs:
              pwsh: true
              targetType: inline
              script: |
                if (Get-Command apt-get -ErrorAction SilentlyContinue) {
                  sudo apt-get update
                  if ($LASTEXITCODE -ne 0) {
                    Write-Error "apt-get update failed with exit code $LASTEXITCODE."
                    exit 1
                  }
                  sudo apt-get install --yes clang binutils zlib1g-dev
                  if ($LASTEXITCODE -ne 0) {
                    Write-Error "apt-get install failed with exit code $LASTEXITCODE."
                    exit 1
                  }
                }
                elseif (Get-Command tdnf -ErrorAction SilentlyContinue) {
                  sudo tdnf install --assumeyes clang binutils gcc glibc-devel zlib-devel
                  if ($LASTEXITCODE -ne 0) {
                    Write-Error "tdnf install failed with exit code $LASTEXITCODE."
                    exit 1
                  }
                }
                else {
                  Write-Error 'No supported package manager was found for Native AOT prerequisites.'
                  exit 1
                }

          - task: 1ES.BuildContainerImage@1
            displayName: Build Alpine Native AOT toolchain
            condition: and(succeeded(), startsWith(variables['BuildRuntimeIdentifier'], 'linux-musl-'))
            inputs:
              path: $(Build.SourcesDirectory)/telemetry-reporter/eng/native-musl
              image: ghcfa-telem-musl-build:$(Build.BuildId)-$(BuildRuntimeIdentifier)
              buildArguments: --build-arg DOTNET_SDK_VERSION=$(DotNetSdkVersion)
              enableNetwork: true
              useBuildKit: true

          - task: PowerShell@2
            displayName: Select Alpine Native AOT toolchain
            condition: and(succeeded(), startsWith(variables['BuildRuntimeIdentifier'], 'linux-musl-'))
            inputs:
              pwsh: true
              targetType: inline
              script: |
                Write-Host '##vso[task.setvariable variable=MuslBuildImage]ghcfa-telem-musl-build:$(Build.BuildId)-$(BuildRuntimeIdentifier)'

      - task: PowerShell@2
        displayName: Build and smoke-test $(BuildRuntimeIdentifier)
        inputs:
          pwsh: true
          filePath: $(Build.SourcesDirectory)/telemetry-reporter/eng/scripts/Build-Native.ps1
          arguments: >
            -Configuration Release
            -RuntimeIdentifier '$(BuildRuntimeIdentifier)'
            -OutputRoot '$(Build.ArtifactStagingDirectory)/native'
            -RestoreConfigFile '$(Build.SourcesDirectory)/telemetry-reporter/nuget.config'
            -MuslBuildImage '$(MuslBuildImage)'
            -DeferPackaging
        env:
          # Build-Native smoke-tests host-compatible binaries; CI executions must not emit product telemetry.
          AZURE_MCP_COLLECT_TELEMETRY: "false"

      - ${{ if eq(parameters.OSName, 'windows') }}:
          - template: pipelines/steps/binary-signing.yml@azure-sdk-build-tools
            parameters:
              SigningKeyCode: CP-230012
              BinaryPath: $(Build.ArtifactStagingDirectory)/native/publish/$(BuildRuntimeIdentifier)
              BinaryPattern: '**/ghcfa-telem.exe'

          - task: PowerShell@2
            displayName: Verify Windows executable signature
            inputs:
              pwsh: true
              targetType: inline
              script: |
                $binaryPath = Join-Path '$(Build.ArtifactStagingDirectory)' 'native/publish/$(BuildRuntimeIdentifier)/ghcfa-telem.exe'
                $signature = Get-AuthenticodeSignature -FilePath $binaryPath -ErrorAction Stop
                if ($signature.Status -ne 'Valid') {
                  throw "Authenticode signature for '$binaryPath' is '$($signature.Status)'."
                }

      - ${{ if eq(parameters.OSName, 'macOS') }}:
          - task: PowerShell@2
            displayName: Prepare macOS executable for signing
            inputs:
              pwsh: true
              targetType: inline
              script: |
                $publishDirectory = Join-Path '$(Build.ArtifactStagingDirectory)' 'native/publish/$(BuildRuntimeIdentifier)'
                $binaryPath = Join-Path $publishDirectory 'ghcfa-telem'
                $signingDirectory = Join-Path '$(Build.ArtifactStagingDirectory)' 'mac-signing'
                New-Item -ItemType Directory -Path $signingDirectory -Force -ErrorAction Stop | Out-Null
                & codesign --force --sign - --options runtime $binaryPath
                if ($LASTEXITCODE -ne 0) {
                  throw "Ad-hoc codesign failed with exit code $LASTEXITCODE."
                }
                $archivePath = Join-Path $signingDirectory 'ghcfa-telem-$(BuildRuntimeIdentifier).zip'
                Compress-Archive -LiteralPath $binaryPath -DestinationPath $archivePath -CompressionLevel Optimal -ErrorAction Stop

          - template: pipelines/steps/azd-cli-mac-signing.yml@azure-sdk-build-tools
            parameters:
              MacPath: $(Build.ArtifactStagingDirectory)/mac-signing
              MacPattern: ghcfa-telem-$(BuildRuntimeIdentifier).zip
              BundleId: com.microsoft.ghcfa-telem
              Notarize: true

          - task: PowerShell@2
            displayName: Verify macOS executable signature
            inputs:
              pwsh: true
              targetType: inline
              script: |
                $publishDirectory = Join-Path '$(Build.ArtifactStagingDirectory)' 'native/publish/$(BuildRuntimeIdentifier)'
                $binaryPath = Join-Path $publishDirectory 'ghcfa-telem'
                $archivePath = Join-Path '$(Build.ArtifactStagingDirectory)' 'mac-signing/ghcfa-telem-$(BuildRuntimeIdentifier).zip'
                $extractDirectory = Join-Path '$(Build.ArtifactStagingDirectory)' 'mac-signing/extracted'
                if (-not (Test-Path -LiteralPath $archivePath -PathType Leaf)) {
                  throw "The signed macOS archive '$archivePath' is missing."
                }
                Expand-Archive -LiteralPath $archivePath -DestinationPath $extractDirectory -Force -ErrorAction Stop
                $signedBinaryPath = Join-Path $extractDirectory 'ghcfa-telem'
                if (-not (Test-Path -LiteralPath $signedBinaryPath -PathType Leaf)) {
                  throw "The signed macOS executable '$signedBinaryPath' is missing."
                }
                Copy-Item -LiteralPath $signedBinaryPath -Destination $binaryPath -Force -ErrorAction Stop
                & chmod +x $binaryPath
                if ($LASTEXITCODE -ne 0) {
                  throw "Restoring executable permissions failed with exit code $LASTEXITCODE."
                }
                & codesign --verify --deep --strict --verbose=2 $binaryPath
                if ($LASTEXITCODE -ne 0) {
                  throw "codesign verification failed with exit code $LASTEXITCODE."
                }
                Remove-Item -LiteralPath (Join-Path '$(Build.ArtifactStagingDirectory)' 'mac-signing') -Recurse -Force -ErrorAction Stop

      - task: PowerShell@2
        displayName: Package signed $(BuildRuntimeIdentifier) executable
        inputs:
          pwsh: true
          targetType: inline
          script: |
            $outputRoot = Join-Path '$(Build.ArtifactStagingDirectory)' 'native'
            $versionPath = Join-Path $outputRoot 'package-version.txt'
            $version = (Get-Content -LiteralPath $versionPath -Raw -ErrorAction Stop).Trim()
            & '$(Build.SourcesDirectory)/telemetry-reporter/eng/scripts/Package-Native.ps1' `
              -RuntimeIdentifier '$(BuildRuntimeIdentifier)' `
              -OutputRoot $outputRoot `
              -Version $version

      - task: PowerShell@2
        displayName: Verify package output
        inputs:
          pwsh: true
          targetType: inline
          script: |
            $packageDirectory = Join-Path '$(Build.ArtifactStagingDirectory)' 'native/packages'
            $runtimeIdentifier = '$(BuildRuntimeIdentifier)'
            $runtimeArchives = @(
              Get-ChildItem -LiteralPath $packageDirectory -File -Filter "ghcfa-telem-*-$runtimeIdentifier.zip"
            )
            $symbolArchives = @(
              Get-ChildItem -LiteralPath $packageDirectory -File -Filter "ghcfa-telem-*-$runtimeIdentifier-symbols.zip"
            )
            if ($runtimeArchives.Count -ne 1 -or $symbolArchives.Count -ne 1) {
              Write-Error "Expected one runtime and one symbols archive for '$runtimeIdentifier'."
              exit 1
            }

            foreach ($archive in @($runtimeArchives[0], $symbolArchives[0])) {
              if (-not (Test-Path -LiteralPath "$($archive.FullName).sha256")) {
                Write-Error "Checksum for '$($archive.Name)' is missing."
                exit 1
              }
            }

      - task: 1ES.PublishPipelineArtifact@1
        displayName: Publish $(BuildRuntimeIdentifier) packages
        inputs:
          artifactName: telemetry-reporter_$(BuildRuntimeIdentifier)
          targetPath: $(Build.ArtifactStagingDirectory)/native/packages
