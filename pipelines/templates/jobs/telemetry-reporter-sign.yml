jobs:
  - job: SignAndPack
    displayName: Sign and package Native AOT executables
    timeoutInMinutes: 120
    pool:
      name: $(MACPOOL)
      vmImage: $(MACVMIMAGE)
      os: macOS

    steps:
      - checkout: self
        fetchDepth: 1

      - download: current
        displayName: Download unsigned build artifacts

      - task: PowerShell@2
        displayName: Stage executables for signing
        inputs:
          pwsh: true
          filePath: $(Build.SourcesDirectory)/telemetry-reporter/eng/scripts/Stage-NightlyBuildArtifactsForSigning.ps1
          arguments: >
            -PipelineWorkspace '$(Pipeline.Workspace)'
            -OutputPath '$(Build.ArtifactStagingDirectory)/signing'
            -EntitlementsPath '$(Build.SourcesDirectory)/telemetry-reporter/eng/dotnet-executable-entitlements.plist'

      - template: pipelines/steps/binary-signing.yml@azure-sdk-build-tools
        parameters:
          SigningKeyCode: 'CP-230012'
          BinaryPath: $(Build.ArtifactStagingDirectory)/signing
          BinaryPattern: '**/win-*/ghcfa-telem.exe'

      - template: pipelines/steps/azd-cli-mac-signing.yml@azure-sdk-build-tools
        parameters:
          MacPath: $(Build.ArtifactStagingDirectory)/signing
          MacPattern: '**/osx-*/ghcfa-telem.zip'

      - task: PowerShell@2
        displayName: Create final signed packages
        inputs:
          pwsh: true
          filePath: $(Build.SourcesDirectory)/telemetry-reporter/eng/scripts/Complete-NightlyBuildArtifactSigning.ps1
          arguments: >
            -SigningPath '$(Build.ArtifactStagingDirectory)/signing'
            -OutputPath '$(Build.ArtifactStagingDirectory)/final'

      - ${{ each runtimeIdentifier in split('win-x64|win-arm64|osx-x64|osx-arm64|linux-x64|linux-arm64', '|') }}:
          - task: 1ES.PublishPipelineArtifact@1
            displayName: Publish ${{ runtimeIdentifier }} packages
            inputs:
              artifactName: telemetry-reporter_${{ runtimeIdentifier }}
              targetPath: $(Build.ArtifactStagingDirectory)/final/${{ runtimeIdentifier }}
