# Temporary access-only pipeline for skaluvak/bami-test. Do not merge into main.
trigger: none

pr: none

variables:
- template: /pipelines/templates/variables/image.yml

pool:
  name: $(LINUXPOOL)
  image: $(LINUXVMIMAGE)
  os: linux

steps:
- task: AzureCLI@2
  displayName: 'Check BAMI principal repository access'
  inputs:
    connectedServiceNameARM: 'azure_msbench_eval_bami'
    scriptType: 'pscore'
    scriptLocation: 'scriptPath'
    scriptPath: $(Build.SourcesDirectory)/pipelines/scripts/Test-BenchmarkRepositoryAccess.ps1
    scriptArguments: >
      -ConnectionName "azure_msbench_eval_bami"
      -ExpectedTenantId "8bc0d684-4df2-4244-8286-188358e31c5c"
