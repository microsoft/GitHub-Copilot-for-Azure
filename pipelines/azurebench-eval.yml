# Manually run a published MSBench Registry benchmark with the GitHub Copilot CLI agent.
# How to set up and run: pipelines/azurebench-eval/README.md
trigger: none
pr: none

parameters:
  - name: benchmark
    displayName: Published benchmark release (<name>@<version>, optionally .<instance_id>)
    type: string
    default: azurebench@1.0.0
  - name: agentDir
    displayName: Agent scripts folder (path in this repo)
    type: string
    default: pipelines/azurebench-eval/agent
  - name: model
    displayName: MSBench model profile (endpoint and auth)
    type: string
    default: claude-opus-4.5-autodev-test
  - name: copilotModel
    displayName: Copilot CLI model the agent uses (COPILOT_AGENT_MODEL)
    type: string
    default: sweagent-capi:claude-opus-4.5
  - name: backend
    displayName: MSBench backend
    type: string
    default: ces-dev1
  - name: useRunIdentity
    displayName: Give the run an Azure identity (BYOI)
    type: boolean
    default: true
  - name: serviceConnection
    displayName: Azure service connection that submits the run
    type: string
    default: azure_msbench_eval
  - name: submit
    displayName: Submit the run and wait for results (unchecked = only build the agent package)
    type: boolean
    default: false

variables:
  - template: /pipelines/templates/variables/image.yml
  - name: packageDir
    value: $(Agent.TempDirectory)/agent-package
  - name: resultsDir
    value: $(Agent.TempDirectory)/results

jobs:
  - job: AzureBenchEval
    displayName: Run ${{ parameters.benchmark }}
    timeoutInMinutes: 360
    pool:
      name: $(LINUXPOOL)
      image: $(LINUXVMIMAGE)
      os: linux
    steps:
      - checkout: self

      - task: UsePythonVersion@0
        inputs:
          versionSpec: '3.12'

      - task: PipAuthenticate@1
        displayName: Authenticate pip with MicrosoftSweBench feed
        inputs:
          artifactFeeds: internal/MicrosoftSweBench

      - script: python -m pip install --no-input msbench-cli==0.3.70 msbench-agent-github-copilot-cli==0.0.28
        displayName: Install MSBench CLI and Copilot CLI agent generator

      - script: |
          set -euo pipefail
          prep="$(Agent.TempDirectory)/prepare"
          rm -rf "$prep" "$(packageDir)"
          mkdir -p "$prep/work" "$prep/out" "$(packageDir)"

          # Official Copilot CLI agent files: package downloader, entry.sh, setup.sh, agent_profile.yml.
          msbench-agent-github-copilot-cli prepare --work_dir "$prep/work" --output_dir "$prep/out" --backend "${{ parameters.backend }}"
          cp "$prep/work/agent/agent-downloader.sh" "$prep/work/agent/entry.sh" "$prep/work/agent/agent_profile.yml" "$(packageDir)/"
          cp "$prep/work/agent/setup.sh" "$(packageDir)/setup-base.sh"

          # Our scripts (setup.sh, runner.sh, ...) wrap the official ones.
          cp "${{ parameters.agentDir }}"/*.sh "$(packageDir)/"
          echo "export COPILOT_AGENT_MODEL='${{ parameters.copilotModel }}'" > "$(packageDir)/model.env"
          ls -l "$(packageDir)"
        displayName: Build agent package

      - publish: $(packageDir)
        artifact: agent-package
        displayName: Publish agent package

      - ${{ if eq(parameters.submit, true) }}:
          - task: AzureCLI@2
            displayName: Run benchmark and check results
            inputs:
              azureSubscription: ${{ parameters.serviceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                export CES_PROXY_BYPASS=true
                byoi=()
                if [ "${{ parameters.useRunIdentity }}" = "True" ]; then
                  # Set these pipeline variables in Azure DevOps (kept out of this public repo).
                  : "${RUN_IDENTITY_CLIENT_ID:?Set pipeline variable RUN_IDENTITY_CLIENT_ID}"
                  : "${RUN_IDENTITY_TENANT_ID:?Set pipeline variable RUN_IDENTITY_TENANT_ID}"
                  : "${RUN_IDENTITY_SUBSCRIPTION_ID:?Set pipeline variable RUN_IDENTITY_SUBSCRIPTION_ID}"
                  byoi=(
                    --run_identity_client_id "$RUN_IDENTITY_CLIENT_ID"
                    --run_identity_tenant_id "$RUN_IDENTITY_TENANT_ID"
                    --run_identity_subscription_id "$RUN_IDENTITY_SUBSCRIPTION_ID"
                    --tag harbor.keepIdentityForRun=true
                  )
                fi
                mkdir -p "$(resultsDir)"
                # Waits for the run to finish; the run ID is in events.jsonl.
                status=0
                msbench-cli run \
                  --agent "$(packageDir)" \
                  --runner "$(packageDir)/runner.sh" \
                  --runner_type harbor \
                  --benchmark "${{ parameters.benchmark }}" \
                  --model "${{ parameters.model }}" \
                  --backend "${{ parameters.backend }}" \
                  --workers 1 \
                  "${byoi[@]}" \
                  --tag purpose=azurebench-eval \
                  --no-kusto \
                  --events "$(resultsDir)/events.jsonl" \
                  --output "$(resultsDir)/report.json" \
                  -y || status=$?

                # A submitted or finished run is not a pass: every requested task must be resolved.
                python3 - "$(resultsDir)" "$status" <<'EOF'
                import json, os, sys
                folder, status = sys.argv[1], int(sys.argv[2])
                events = os.path.join(folder, "events.jsonl")
                run_ids = [e["data"].get("run_id") for e in map(json.loads, open(events))
                           if e.get("event") == "run_started"] if os.path.exists(events) else []
                print("Run ID:", run_ids[-1] if run_ids else "not started")
                report = os.path.join(folder, "report.json")
                if not os.path.exists(report):
                    sys.exit(f"No results (msbench-cli exit code {status}).")
                data = json.load(open(report))
                totals = [b["totals"] for b in data["summary"]["benchmarks_overview"].values()]
                passed = sum(t["num_passed_cases"] for t in totals)
                requested = data["requested_instance_count"]
                print(f"Resolved {passed}/{requested}")
                sys.exit(0 if status == 0 and requested > 0 and passed == requested else 1)
                EOF

          - publish: $(resultsDir)
            artifact: results
            displayName: Publish results
            condition: succeededOrFailed()