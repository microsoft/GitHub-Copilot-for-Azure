name: connect-observability-eval
description: "Validates that connect-observability is invoked for a representative request."

tags:
  type: integration
  skill: connect-observability

defaults:
  runs: 1
  timeout: "10m"
  executor: copilot-sdk-agent-runner

scoring:
  threshold: 1

stimuli:
  - name: "Invoke connect-observability"
    turns:
      - "Invoke connect-observability skill and describe what it can do"
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: routing
      requiredSkills:
        - connect-observability
    graders:
      - type: skill-invocation
        config:
          required:
            - connect-observability
