name: azure-advisor-cost-optimization-eval
description: "Validates scope resolution, idle-resource analysis, full retail USD reports, lifecycle safety and selected remediation handoffs."

tags:
  type: integration
  skill: azure-advisor-cost-optimization
  mcpMode: all

defaults:
  runs: 1
  timeout: "10m"
  executor: copilot-sdk-agent-runner
  model: claude-sonnet-5
  judge_model: claude-sonnet-5

scoring:
  threshold: 0.8

stimuli:
  - name: "Ask the three supported scope choices"
    prompt: "Find my unused Azure resources."
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: scope-clarification
      requiredSkills:
        - azure-advisor-cost-optimization
    constraints:
      max_turns: 40
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-advisor-cost-optimization
      - type: output-matches
        config:
          pattern: "(?i)all.*subscriptions"
      - type: output-matches
        config:
          pattern: "(?i)one subscription"
      - type: output-matches
        config:
          pattern: "(?i)specific service group"
      - type: tool-calls
        config:
          disallowed:
            - name: "(?i)advisor_recommendation_(summary|list)"

  - name: "Reuse an explicit subscription"
    constraints:
      max_turns: 40
    prompt: "Find unused Azure resources in subscription 00000000-0000-0000-0000-000000000000."
    tags:
      type: integration
      tier: full
      cost: llm
      area: subscription-scope
      requiredSkills:
        - azure-advisor-cost-optimization
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-advisor-cost-optimization
      - type: tool-calls
        config:
          required:
            - name: "(?i)advisor_recommendation_summary"

  - name: "Enumerate all accessible subscriptions"
    constraints:
      max_turns: 40
    prompt: "Check all my accessible subscriptions for idle Azure resources and savings."
    tags:
      type: integration
      tier: full
      cost: llm
      area: all-subscriptions
      requiredSkills:
        - azure-advisor-cost-optimization
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-advisor-cost-optimization
      - type: tool-calls
        config:
          required:
            - name: "(?i)subscription.*list"
      - type: output-not-matches
        config:
          pattern: "(?i)assuming.*default subscription|default subscription only"

  - name: "Use a supplied single SG without discovery"
    constraints:
      max_turns: 40
    prompt: "Show idle-resource Advisor savings in Service Group finance-prod. finance-prod is the identifier in its ARM ID."
    tags:
      type: integration
      tier: full
      cost: llm
      area: service-group
      requiredSkills:
        - azure-advisor-cost-optimization
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-advisor-cost-optimization
      - type: tool-calls
        config:
          required:
            - name: "(?i)advisor_recommendation_summary"
          disallowed:
            - name: "(?i)advisor_recommendation_service_?group_scope"
            - name: "(?i)subscription.*list"

  - name: "Choose one Service Group instead of discovering every SG"
    prompt: "Find idle-resource savings across all my accessible Service Groups."
    tags:
      type: integration
      tier: full
      cost: llm
      area: unsupported-sg-discovery
      requiredSkills:
        - azure-advisor-cost-optimization
    constraints:
      max_turns: 40
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-advisor-cost-optimization
      - type: output-matches
        config:
          pattern: "(?i)(one|single|specific).*service group|service group.*(identifier|ID)"
      - type: tool-calls
        config:
          disallowed:
            - name: "(?i)advisor_recommendation_(service_?group_scope|summary|list)"

  - name: "Reject mixed scope families before querying"
    prompt: "Find idle-resource Advisor recommendations in subscription 00000000-0000-0000-0000-000000000000 and Service Group finance-prod."
    tags:
      type: integration
      tier: full
      cost: llm
      area: scope-validation
      requiredSkills:
        - azure-advisor-cost-optimization
    constraints:
      max_turns: 40
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-advisor-cost-optimization
      - type: output-matches
        config:
          pattern: "(?i)choose|either|mutually exclusive"
      - type: tool-calls
        config:
          disallowed:
            - name: "(?i)advisor_recommendation_(summary|list)"

  - name: "Keep tenant scope and coverage separate"
    constraints:
      max_turns: 40
    prompt: "For unused-resource savings, I selected subscriptions in two different tenants. Explain how you will query them without mixing tenant scope or treating partial coverage as complete."
    tags:
      type: integration
      tier: full
      cost: llm
      area: tenant-coverage
      requiredSkills:
        - azure-advisor-cost-optimization
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-advisor-cost-optimization
      - type: output-matches
        config:
          pattern: "(?i)per.tenant|by tenant|separate.*tenant|tenant.*separate"
      - type: output-not-matches
        config:
          pattern: "(?i)single.*cross.tenant.*query|omit.*scope.*default"

  - name: "Pass a Service Group display name directly to Advisor"
    constraints:
      max_turns: 40
    prompt: "For Service Group Trey Research Shared Services, what Azure resources am I paying for that are no longer being used?"
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: service-group-name
      requiredSkills:
        - azure-advisor-cost-optimization
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-advisor-cost-optimization
      - type: tool-calls
        config:
          required:
            - name: "(?i)advisor_recommendation_summary"
              args:
                service-group: "^Trey Research Shared Services$"
                category: "^Cost$"
                sub-category: "^IdleResources$"
              pattern: '"prioritized":true'
          disallowed:
            - name: "(?i)subscription.*list|resource.?graph|(^|_)arm($|_)|advisor_recommendation_(service_?group_scope|list)"
      - type: shell-command-invoked
        config:
          disallowed:
            - command: "(?i)az\\s+graph\\s+query|az\\s+rest"

  - name: "Preserve tenant with a supplied Service Group name"
    constraints:
      max_turns: 40
    prompt: "Show idle-resource savings for Service Group Finance in tenant 11111111-1111-1111-1111-111111111111."
    tags:
      type: integration
      tier: full
      cost: llm
      area: service-group-tenant
      requiredSkills:
        - azure-advisor-cost-optimization
    graders:
      - type: tool-calls
        config:
          required:
            - name: "(?i)advisor_recommendation_summary"
              args:
                service-group: "^Finance$"
                tenant: "^11111111-1111-1111-1111-111111111111$"
          disallowed:
            - name: "(?i)subscription.*list|resource.?graph|(^|_)arm($|_)"

  - name: "Pass a full Service Group ARM ID without lookup"
    constraints:
      max_turns: 40
    prompt: "Show unused-resource savings for /providers/Microsoft.Management/serviceGroups/finance-prod."
    tags:
      type: integration
      tier: full
      cost: llm
      area: service-group-arm-id
      requiredSkills:
        - azure-advisor-cost-optimization
    graders:
      - type: tool-calls
        config:
          required:
            - name: "(?i)advisor_recommendation_summary"
              args:
                service-group: "^/providers/Microsoft.Management/serviceGroups/finance-prod$"
          disallowed:
            - name: "(?i)subscription.*list|resource.?graph|(^|_)arm($|_)"

  - name: "Clarify a tool-reported ambiguous Service Group"
    prompt: "The Advisor tool reported that Service Group Finance is ambiguous, matching /providers/Microsoft.Management/serviceGroups/finance-a and /providers/Microsoft.Management/serviceGroups/finance-b. Continue my idle-resource review without choosing a group for me."
    tags:
      type: integration
      tier: full
      cost: llm
      area: service-group-ambiguity
      requiredSkills:
        - azure-advisor-cost-optimization
    constraints:
      max_turns: 40
    graders:
      - type: output-matches
        config:
          pattern: "(?i)finance-a"
      - type: output-matches
        config:
          pattern: "(?i)finance-b"
      - type: tool-calls
        config:
          disallowed:
            - name: "(?i)advisor_recommendation_(summary|list|update)|subscription.*list|resource.?graph|(^|_)arm($|_)"

  - name: "Use summary before opening expansion"
    prompt: "Find unused Azure resources and potential savings in subscription 00000000-0000-0000-0000-000000000000."
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: discovery
      requiredSkills:
        - azure-advisor-cost-optimization
    constraints:
      max_turns: 40
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-advisor-cost-optimization
      - type: tool-calls
        config:
          required:
            - name: "(?i)advisor_recommendation_summary"
              args:
                category: "^Cost$"
                sub-category: "^IdleResources$"
              pattern: '"prioritized":true'
          disallowed:
            - name: "(?i)advisor_recommendation_list"
            - name: "(?i)advisor_recommendation_prevalidate"

  - name: "Preserve normal summary for record frequency"
    prompt: "Which active Cost IdleResources recommendation types occur most often in subscription 00000000-0000-0000-0000-000000000000? Count recommendation records, not distinct resources or savings rank."
    rubric:
      - The agent calls the existing summary with group-by recommendation-type and without prioritized=true.
      - The agent preserves normal recommendation-record counts and frequency ordering; it does not use prioritized distinct-resource counts or reorder by Cost totals.
      - No recommendation list is queried or counted to answer this aggregate question.
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: normal-frequency-preservation
      requiredSkills:
        - azure-advisor-cost-optimization
    constraints:
      max_turns: 40
    graders:
      - type: tool-calls
        config:
          required:
            - name: "(?i)advisor_recommendation_summary"
              args:
                category: "^Cost$"
                sub-category: "^IdleResources$"
                group-by: "^recommendation-type$"
          disallowed:
            - name: "(?i)advisor_recommendation_list"
      - type: prompt
        config:
          scoring: scale_1_5
          threshold: 0.8

  - name: "Keep current summaries New-only"
    constraints:
      max_turns: 40
    prompt: "Summarize active idle-resource Advisor recommendations by recommendation type in subscription 00000000-0000-0000-0000-000000000000."
    tags:
      type: integration
      tier: full
      cost: llm
      area: current-status
      requiredSkills:
        - azure-advisor-cost-optimization
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-advisor-cost-optimization
      - type: tool-calls
        config:
          required:
            - name: "(?i)advisor_recommendation_summary"
              args:
                category: "^Cost$"
                sub-category: "^IdleResources$"
                group-by: "^recommendation-type$"
          disallowed:
            - name: "(?i)advisor_recommendation_summary"
              args:
                status: "(?i)^(?!New$).+$"
      - type: output-not-matches
        config:
          pattern: "(?i)completed.*current opportunities|dismissed.*current opportunities"

  - name: "Use status grouping for lifecycle breakdowns"
    constraints:
      max_turns: 40
    prompt: "Group Advisor idle-resource findings by status, including Completed and Dismissed, in subscription 00000000-0000-0000-0000-000000000000."
    tags:
      type: integration
      tier: full
      cost: llm
      area: status-grouping
      requiredSkills:
        - azure-advisor-cost-optimization
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-advisor-cost-optimization
      - type: tool-calls
        config:
          required:
            - name: "(?i)advisor_recommendation_summary"
              args:
                category: "^Cost$"
                sub-category: "^IdleResources$"
                group-by: "^status$"
          disallowed:
            - name: "(?i)advisor_recommendation_summary"
              pattern: '"status":|"prioritized":true'

  - name: "Combine product family and priority filters"
    prompt: "Show highest-priority idle-resource Advisor recommendations for the Compute product family in subscription 00000000-0000-0000-0000-000000000000."
    tags:
      type: integration
      tier: full
      cost: llm
      area: filter-compatibility
      requiredSkills:
        - azure-advisor-cost-optimization
    constraints:
      max_turns: 40
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-advisor-cost-optimization
      - type: output-not-matches
        config:
          pattern: "(?i)cannot.*combin|not.*combin|incompatib"
      - type: tool-calls
        config:
          required:
            - name: "(?i)advisor_recommendation_summary"
              args:
                category: "^Cost$"
                sub-category: "^IdleResources$"
                product-family: "^Compute$"
              pattern: '"prioritized":true'
          disallowed:
            - name: "(?i)advisor_recommendation_list"

  - name: "List explicitly requested records directly"
    constraints:
      max_turns: 40
    prompt: "List all active Advisor idle-resource records in subscription 00000000-0000-0000-0000-000000000000."
    tags:
      type: integration
      tier: full
      cost: llm
      area: direct-list
      requiredSkills:
        - azure-advisor-cost-optimization
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-advisor-cost-optimization
      - type: tool-calls
        config:
          required:
            - name: "(?i)advisor_recommendation_list"
          disallowed:
            - name: "(?i)advisor_recommendation_summary"
      - type: output-not-matches
        config:
          pattern: "(?i)cost-findings|cost-list"

  - name: "Offer All Completed before historical periods"
    prompt: "Today is 2026-10-27 UTC. We selected recommendation type 11111111-1111-1111-1111-111111111111 in Service Group Demo Group. How much have we saved after completed cleanup?"
    rubric:
      - The agent asks exactly one report-selection question with All Completed first and recommended, then Last 30 days, Last quarter, and A specific period.
      - It explains that All Completed retains the current scope/type and uses current realized savings, not all lifecycle states.
      - It shows concrete UTC bounds of September 27 through October 26 for Last 30 days and July 1 through September 30 for Last quarter before asking.
      - It does not query recommendations or silently choose a period before the answer.
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: completed-period-selection
      parity: response-shape
      questionOnly: "true"
      earlyTerminate: '[{"type":"tool-call-match","toolPattern":"(?i)(^|[._])ask_user$","argsPattern":".*"}]'
      requiredSkills:
        - azure-advisor-cost-optimization
    constraints:
      max_turns: 40
    graders:
      - type: tool-calls
        config:
          # Stop with the question pending; assert invocation, not a fabricated answer.
          sequence:
            - name: "(?i)(^|[._])ask_user$"
          disallowed:
            - name: "(?i)advisor_recommendation_(summary|list|update)"
      - type: prompt
        config:
          scoring: scale_1_5
          threshold: 0.8

  - name: "Show current Completed savings and resources after All selection"
    prompt: "We selected recommendation type 11111111-1111-1111-1111-111111111111 in Service Group Demo Group. For completed-cleanup savings, I chose All Completed. Show the totals and resources."
    rubric:
      - The agent uses current Completed summary totals and then lists Completed resources for the same selected type and scope.
      - It reuses the All Completed selection without another question and does not invent from/to bounds or a prior-day as-of.
      - It preserves unavailable pricing and undated Completed resources rather than interpreting their absence from a deletion-date window as no Completed findings.
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: current-completed-report
      requiredSkills:
        - azure-advisor-cost-optimization
    constraints:
      max_turns: 40
    graders:
      - type: tool-calls
        config:
          required:
            - name: "(?i)advisor_recommendation_summary"
              args:
                status: "^Completed$"
                service-group: "^Demo Group$"
                recommendation-type-id: "^11111111-1111-1111-1111-111111111111$"
            - name: "(?i)advisor_recommendation_list"
              args:
                status: "^Completed$"
                service-group: "^Demo Group$"
                recommendation-type-id: "^11111111-1111-1111-1111-111111111111$"
          disallowed:
            - name: "(?i)advisor_recommendation_update|(^|[._])ask_user$"
      - type: prompt
        config:
          scoring: scale_1_5
          threshold: 0.8

  - name: "Keep unpriced Completed resources visible with portal lifecycle labels"
    prompt: |
      Show these already-returned current Completed details for recommendation type
      Unattached disks in subscription Demo, with no reporting window and no truncation.
      Summary: 4 Completed records, realized savings 108.90 USD, Cost 1026.39 USD,
      pricing basis Retail; 3 records have pricing and 1 is unavailable.
      Each resource is in rg-demo, has completionType=SystemVerified, and has
      platformStateUpdatedAt=2026-10-24T12:26:00Z.
      disk-deleted-a has realizedSavings=91.42, cost=91.42, and resourceDeletedOn=2026-10-24T00:00:00Z.
      disk-deleted-b has realizedSavings=8.74, cost=486.42, and resourceDeletedOn=2026-10-24T00:00:00Z.
      disk-deleted-c has realizedSavings=8.74, cost=448.55, and resourceDeletedOn=2026-10-24T00:00:00Z.
      disk-verified has no savings or deletion date. Its platformStateUpdatedAt is
      2026-10-14T03:00:00Z. Do not query Azure or ask a follow-up question.
    rubric:
      - All four exact resource names appear in resource rows, including disk-verified with Unavailable money and deletion date, not zero.
      - The response shows 108.90 USD realized savings and 1026.39 USD Cost separately, with Retail basis and pricing coverage of three out of four.
      - Completed tables use Realized savings, Cost, Completed on, Completion details and Deletion date; no annual potential savings is presented as realized savings.
      - The three deleted rows say Resource deleted; disk-verified says Verified completed, with its platform update timestamp rather than a fabricated deletion timestamp.
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: completed-unavailable-pricing
      parity: response-shape
      requiredSkills:
        - azure-advisor-cost-optimization
    constraints:
      max_turns: 40
    graders:
      - type: output-matches
        config:
          pattern: "(?is)\\|disk-verified\\|[^\\r\\n]*Unavailable"
      - type: output-matches
        config:
          pattern: "(?im)^## Completed cleanup\\s*$"
      - type: output-matches
        config:
          pattern: "(?i)\\|Resource\\|Resource<br>group\\|Realized<br>savings\\|Cost\\|Completed<br>on\\|Completion<br>details\\|Deletion<br>date\\|"
      - type: output-matches
        config:
          pattern: "(?i)\\|disk-deleted-b\\|rg-demo\\|\\$8\\.74\\|\\$486\\.42\\|"
      - type: output-matches
        config:
          pattern: "(?i)Verified completed"
      - type: output-matches
        config:
          pattern: "(?i)Resource deleted"
      - type: tool-calls
        config:
          disallowed:
            - name: "(?i)advisor_recommendation_(summary|list|update)|(^|[._])ask_user$"
      - type: prompt
        config:
          scoring: scale_1_5
          threshold: 0.8

  - name: "Use full summary totals for historical savings"
    constraints:
      max_turns: 40
    prompt: "Report total realized savings for Advisor idle-resource cleanups from 2026-07-01T00:00:00Z through 2026-09-30T23:59:59Z in subscription 00000000-0000-0000-0000-000000000000. Use Advisor estimates, not billing."
    tags:
      type: integration
      tier: full
      cost: llm
      area: historical-totals
      requiredSkills:
        - azure-advisor-cost-optimization
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-advisor-cost-optimization
      - type: tool-calls
        config:
          required:
            - name: "(?i)advisor_recommendation_summary"
              args:
                status: "^Completed$"
                from: "^2026-07-01"
                to: "^2026-09-30"
          disallowed:
            - name: "(?i)advisor_recommendation_list"

  - name: "Preserve explicit New state with a historical timestamp"
    constraints:
      max_turns: 40
    prompt: "Summarize active New Cost IdleResources Advisor recommendations as of 2026-09-30T00:00:00Z in subscription 00000000-0000-0000-0000-000000000000. Keep the explicit New filter rather than switching to Completed."
    tags:
      type: integration
      tier: full
      cost: llm
      area: historical-explicit-state
      requiredSkills:
        - azure-advisor-cost-optimization
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-advisor-cost-optimization
      - type: tool-calls
        config:
          required:
            - name: "(?i)advisor_recommendation_summary"
              args:
                category: "^Cost$"
                sub-category: "^IdleResources$"
                status: "^New$"
                as-of: "^2026-09-30"

  - name: "List lifecycle detail without replacing full totals"
    constraints:
      max_turns: 40
    prompt: "Show the individual postponed Advisor idle-resource findings in subscription 00000000-0000-0000-0000-000000000000 with their postponement dates."
    tags:
      type: integration
      tier: full
      cost: llm
      area: lifecycle-detail
      requiredSkills:
        - azure-advisor-cost-optimization
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-advisor-cost-optimization
      - type: tool-calls
        config:
          required:
            - name: "(?i)advisor_recommendation_list"
          disallowed:
            - name: "(?i)advisor_recommendation_update"

  - name: "Preserve Completed state during selected-type expansion"
    constraints:
      max_turns: 40
    prompt: "Expand the completed idle-resource recommendation type 11111111-1111-1111-1111-111111111111 in Service Group finance-prod. Keep the same Completed state and show its individual resources; do not update anything."
    tags:
      type: integration
      tier: full
      cost: llm
      area: expansion-state
      requiredSkills:
        - azure-advisor-cost-optimization
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-advisor-cost-optimization
      - type: tool-calls
        config:
          required:
            - name: "(?i)advisor_recommendation_list"
              args:
                category: "^Cost$"
                sub-category: "^IdleResources$"
                service-group: "^finance-prod$"
                recommendation-type-id: "^11111111-1111-1111-1111-111111111111$"
                status: "^Completed$"
          disallowed:
            - name: "(?i)advisor_recommendation_(summary|update)"

  - name: "Select Dismissed source records before reactivation"
    constraints:
      max_turns: 40
    prompt: "Reactivate dismissed idle-resource Advisor findings for type 11111111-1111-1111-1111-111111111111 in subscription 00000000-0000-0000-0000-000000000000. First show the dismissed candidates for selection and confirmation; do not change anything yet."
    tags:
      type: integration
      tier: full
      cost: llm
      area: reactivation-source-state
      requiredSkills:
        - azure-advisor-cost-optimization
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-advisor-cost-optimization
      - type: tool-calls
        config:
          required:
            - name: "(?i)advisor_recommendation_list"
              args:
                category: "^Cost$"
                sub-category: "^IdleResources$"
                recommendation-type-id: "^11111111-1111-1111-1111-111111111111$"
                status: "^Dismissed$"
          disallowed:
            - name: "(?i)advisor_recommendation_update"

  - name: "Choose one recommendation type before prevalidation"
    constraints:
      max_turns: 40
    prompt: "I want read-only deletion-safety checks for idle disks and unused App Service plans in subscription 00000000-0000-0000-0000-000000000000. Ask me which one recommendation type to validate first; do not make Azure calls yet."
    tags:
      type: integration
      tier: full
      cost: llm
      area: safety-limit
      requiredSkills:
        - azure-advisor-cost-optimization
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-advisor-cost-optimization
      - type: output-matches
        config:
          pattern: "(?i)(choose|which|select).*(type|disk|plan)|(disk|plan).*(choose|which|select)"
      - type: tool-calls
        config:
          disallowed:
            - name: "(?i)advisor_recommendation_(list|summary|prevalidate|update)"

  - name: "Prevalidate an exact selection without rediscovery"
    prompt: >-
      Run read-only prevalidation for Advisor Cost IdleResources recommendation type
      48eda464-1485-4dcf-a674-d0905df5054a in subscription
      00000000-0000-0000-0000-000000000001, for only the selected resource
