                sub-category: "^IdleResources$"
                status: "^Completed$"
                recommendation-type-id: "^11111111-1111-1111-1111-111111111111$"
          disallowed:
            - name: "(?i)advisor_recommendation_(summary|update)"

  - name: "40315613 Confirm a selected dismissal batch once"
    prompt: &selected-dismissal-proposal |
      From the Advisor list already shown, I selected disk-a, disk-b, and disk-c in
      subscription 00000000-0000-0000-0000-000000000000, all in recommendation type
      11111111-1111-1111-1111-111111111111. Their stable record names are
      aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa,
      bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb,
      cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc.
      Their resource IDs are /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-demo/providers/Microsoft.Compute/disks/disk-a,
      /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-demo/providers/Microsoft.Compute/disks/disk-b,
      /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-demo/providers/Microsoft.Compute/disks/disk-c.
      Dismiss those three because the risk is acceptable. Prepare the confirmation,
      but do not perform updates yet or query Azure again.
    rubric:
      - A visible proposal identifies all three selected resources, the subscription scope, total count 3, Dismissed action, and the supplied shared reason.
      - Exactly one confirmation request covers the entire selected batch, with confirm and cancel choices; there is no separate confirmation per recommendation.
      - The agent reuses the supplied type, resource selection, and dismissal reason rather than asking the user to select or explain them again.
      - No update is performed before the shared batch confirmation.
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: batch-confirmation-regression
      questionOnly: "true"
      earlyTerminate: '[{"type":"tool-call-match","toolPattern":"(?i)(^|[._])ask_user$","argsPattern":".*"}]'
      requiredSkills:
        - azure-advisor-cost-optimization
    constraints:
      max_turns: 40
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-advisor-cost-optimization
      - type: output-matches
        config:
          pattern: "(?is)disk-a.*disk-b.*disk-c"
      - type: prompt
        config:
          scoring: scale_1_5
          threshold: 0.8
      - type: tool-calls
        config:
          sequence:
            - name: "(?i)(^|[._])ask_user$"
              pattern: '(?s)Confirm these changes.*Cancel'
          disallowed:
            - name: "(?i)advisor_recommendation_(summary|list|update)"

  - name: "Cancel the selected dismissal batch without updates"
    turns:
      - *selected-dismissal-proposal
      - "Cancel. Do not make any changes or query Azure."
    rubric:
      - A visible proposal identifies the entire selected batch before one confirmation question.
      - The Cancel follow-up is honored without any recommendation update, retry or further confirmation.
      - The final response clearly states that no changes were made.
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: batch-confirmation-regression
      requiredSkills:
        - azure-advisor-cost-optimization
    constraints:
      max_turns: 40
    graders:
      - type: completed
      - type: skill-invocation
        config:
          required:
            - azure-advisor-cost-optimization
      - type: tool-calls
        config:
          disallowed:
            - name: "(?i)advisor_recommendation_(summary|list|update)"
      - type: prompt
        config:
          scoring: scale_1_5
          threshold: 0.8

