          pattern: "(?i)pricing basis[^\\r\\n]*Contractual"
      - type: output-not-matches
        config:
          pattern: "(?i)pricing basis[^\\r\\n]*Retail|Contractual pricing: Unavailable"
      - type: tool-calls
        config:
          disallowed:
            - name: "(?i)advisor_recommendation_(summary|list|update)"

  - name: "Carry the historical default into list expansion"
    constraints:
      max_turns: 40
    prompt: |
      My previous Cost/IdleResources summary for Service Group finance-prod used
      as-of=2026-09-30T00:00:00Z and omitted status, so the updated tool selected Completed.
      Expand its selected recommendation type 11111111-1111-1111-1111-111111111111.
