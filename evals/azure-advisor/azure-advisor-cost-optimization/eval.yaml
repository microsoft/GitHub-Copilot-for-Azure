            - name: "(?i)advisor_recommendation_(summary|list|update)|(^|[._])ask_user$"

  - name: "Preserve a future returned Contractual calculation basis"
    constraints:
      max_turns: 40
    prompt: |
      A future supported Advisor summary returned summary.cost.pricingBasis=Contractual
      and currencyTotals with potentialSavings=1200 and accumulatedWaste=75 USD,
      calculated from properties.savings.contractual. Present only these returned
      measures and their basis, without querying Azure or recalculating anything.
    tags:
