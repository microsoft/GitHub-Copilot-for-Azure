name: cost-analysis-integration-eval
description: Routing checks for Azure cost details, investigations, AKS, and AI cost analysis.

tags:
  type: integration
  skill: cost-analysis

defaults:
  runs: 3
  timeout: "10m"
  executor: copilot-sdk-agent-runner
  model: claude-sonnet-5

scoring:
  threshold: 0.8

stimuli:
  - name: "Rank service costs"
    prompt: "Which Azure services did I spend the most on in my current subscription last month? Show the full service name breakdown ranked by cost."
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: routing
      earlyTerminate: '[{"type":"skill-call","skill":"cost-analysis"},{"type":"tool-call-count","count":3}]'
    graders:
      - type: skill-invocation
        config:
          required:
            - cost-analysis
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  - name: "Investigate date-specific spike"
    prompt: "There was a cost spike on a specific day last month in my current subscription. Explain what caused it and which resource was responsible."
    tags:
      type: integration
      tier: full
      cost: llm
      area: routing
      earlyTerminate: '[{"type":"skill-call","skill":"cost-analysis"},{"type":"tool-call-count","count":3}]'
    graders:
      - type: skill-invocation
        config:
          required:
            - cost-analysis

  - name: "Attribute one resource's full cost"
    prompt: "What was the total cost of one of my Function Apps last month? Include all attributable costs, not just the Functions line item."
    tags:
      type: integration
      tier: full
      cost: llm
      area: routing
      earlyTerminate: '[{"type":"skill-call","skill":"cost-analysis"},{"type":"tool-call-count","count":3}]'
    graders:
      - type: skill-invocation
        config:
          required:
            - cost-analysis

  - name: "Break down Cosmos DB meters"
    prompt: "For one of my Cosmos DB accounts, break down last month's charges by meter name so I can compare provisioned throughput, storage, and other components."
    tags:
      type: integration
      tier: full
      cost: llm
      area: routing
      earlyTerminate: '[{"type":"skill-call","skill":"cost-analysis"},{"type":"tool-call-count","count":3}]'
    graders:
      - type: skill-invocation
        config:
          required:
            - cost-analysis

  - name: "Calculate total AKS cluster cost"
    prompt: "Show the total cost of one of my AKS clusters last month, including node VMs, disks, load balancers, networking, and control plane costs."
    tags:
      type: integration
      tier: full
      cost: llm
      area: routing
      earlyTerminate: '[{"type":"skill-call","skill":"cost-analysis"},{"type":"tool-call-count","count":3}]'
    graders:
      - type: skill-invocation
        config:
          required:
            - cost-analysis

  - name: "Rank AKS namespaces and idle cost"
    prompt: "Rank namespaces by cost and show total idle capacity across one of my AKS clusters for last month."
    tags:
      type: integration
      tier: full
      cost: llm
      area: routing
      earlyTerminate: '[{"type":"skill-call","skill":"cost-analysis"},{"type":"tool-call-count","count":3}]'
    graders:
      - type: skill-invocation
        config:
          required:
            - cost-analysis

  - name: "Analyze Foundry model charges"
    prompt: "Break down last month's Azure OpenAI and Foundry Models billing costs in my current subscription by service, resource, and meter. State clearly whether the available Cost Management data supports input/output token attribution by deployment."
    tags:
      type: integration
      tier: full
      cost: llm
      area: behavior
      regression: evidence-contract
    graders:
      - type: skill-invocation
        config:
          required:
            - cost-analysis
      - type: tool-calls
        config:
          disallowed:
            - name: "(?i)^(bash|powershell|shell|python|web_fetch|fetch|curl|http|rest)$"
      - type: output-matches
        config:
          pattern: "(?i)query_costs|Cost Management"
      - type: output-matches
        config:
          pattern: "(?i)(token.{0,30}(unavailable|not available|not supported|cannot|does not)|not.{0,30}token|cannot.{0,40}token|does not.{0,40}token)"
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace|management\\.azure\\.com|az\\s+costmanagement|kubectl"
      - type: completed

  - name: "AKS capped results are disclosed"
    prompt: "The supported AKS cost tool returned exactly 5,000 rows for my namespace breakdown and has no continuation input. Explain how you will proceed and what you can truthfully claim from that result."
    config:
      runs: 1
    tags:
      type: integration
      tier: full
      cost: llm
      area: behavior
      regression: partial-results
    graders:
      - type: skill-invocation
        config:
          required:
            - cost-analysis
      - type: output-matches
        config:
          pattern: "(?i)incomplete|partial|truncat|narrow|filter|scope"
      - type: output-not-matches
        config:
          pattern: "(?i)complete (set|result)|all namespaces|invoke.{0,20}(url|nextpage)|curl|az\\s+"

  - name: "Mixed spike and remediation starts with analysis"
    prompt: "I ran over budget last month. Find what changed in my Azure bill, explain the cost drivers, and then tell me where to reduce spend."
    tags:
      type: integration
      tier: full
      cost: llm
      area: routing
      earlyTerminate: '[{"type":"skill-call","skill":"cost-analysis"},{"type":"tool-call-count","count":3}]'
    graders:
      - type: skill-invocation
        config:
          required:
            - cost-analysis

  - name: "Legacy AKS cost spike investigation"
    prompt: "My AKS cluster costs spiked unexpectedly last Sunday from 2am to 4pm EST, help me investigate"
    tags:
      type: integration
      tier: full
      cost: llm
      area: routing
      regression: legacy-routing
      earlyTerminate: '[{"type":"skill-call","skill":"cost-analysis"},{"type":"tool-call-count","count":3}]'
    graders:
      - type: skill-invocation
        config:
          required:
            - cost-analysis
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  - name: "AKS namespace cost mentions cost analysis add-on"
    prompt: "How do I enable namespace-level cost visibility for my AKS cluster?"
    config:
      runs: 1
    tags:
      type: integration
      tier: full
      cost: llm
      area: response-quality
      regression: legacy-quality
    graders:
      - type: skill-invocation
        config:
          required:
            - cost-analysis
      - type: output-matches
        config:
          pattern: "(?i)--enable-cost-analysis|costAnalysis|cost\\s*analysis"
      - type: completed
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  - name: "AKS cost anomaly uses MCP monitoring workflow"
    prompt: "What monitoring steps should I use to investigate a cost spike on an AKS cluster?"
    config:
      runs: 1
    tags:
      type: integration
      tier: full
      cost: llm
      area: response-quality
      regression: legacy-quality
    graders:
      - type: skill-invocation
        config:
          required:
            - cost-analysis
      - type: output-matches
        config:
          pattern: "(?i)query_aks_costs|Azure Monitor|node[- ]count|CPU|memory"
      - type: completed
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace|kubectl\\s+top|az\\s+monitor|az\\s+consumption"

  - name: "AKS proactive anomaly uses historical baseline"
    prompt: |
      Was this Monday's cost unusual for my AKS cluster, what explains the
      increase, and what remains uncertain? Use only this exported summary;
      do not change anything.

      Target: cluster prod-aks, resource group rg-prod, subscription
      00000000-0000-0000-0000-000000000000. All reporting days are complete
      UTC days from the same AKS allocation export, scope, filters, and
      CostUSD column, in USD. For this comparison, use the mean of the four
      preceding Mondays as the baseline:
      - August 31, 2026: $98
      - September 7, 2026: $102
      - September 14, 2026: $100
      - September 21, 2026: $100
      - Candidate day, September 28, 2026: $160

      The baseline Monday averages break down as batch namespace $20,
      idle charges $10, and all other categories combined $70.
      On September 28, batch was $70, idle charges were $20, and all other
      categories combined were $70. These categories reconcile to the totals.
      Workload history shows a batch job and associated capacity ran that day.
      There is no autoscaler or scale-down history explaining the idle increase.
    config:
      runs: 1
    tags:
      type: integration
      tier: full
      cost: llm
      area: response-quality
      regression: aks-proactive-anomaly
    rubric:
      - "The response calculates a $100 baseline from the four preceding Mondays and compares the $160 candidate day with that baseline, reporting a $60 or 60 percent increase. It identifies this as a candidate anomaly relative to the supplied comparable-weekday baseline, not a native anomaly score or proof of statistical significance."
      - "The response reconciles the increase as $50 from the batch namespace and $10 from idle charges, with other categories unchanged. It distinguishes measured cost contributions from operational causation: the observed job and capacity are consistent with the batch increase, but the idle increase's cause remains unverified without autoscaler or scale-down history. It does not invent a cause for idle retention or leave any of the $60 financially unattributed. It analyzes the supplied data without changing resources."
    graders:
      - type: skill-invocation
        config:
          required:
            - cost-analysis
      - type: prompt
        config:
          scoring: binary
          threshold: 1
      - type: completed
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  - name: "AKS anomaly keeps one cost basis"
    prompt: "I am checking an AKS namespace cost spike. For the same namespace and equal-length reporting periods, the older allocation export shows a total of 100 in the Cost column, labeled EUR, and the newer export shows 120 in CostUSD, labeled USD. Does that mean costs rose 20 percent? Tell me how to make a valid comparison, but do not run anything yet."
    config:
      runs: 1
    tags:
      type: integration
      tier: full
      cost: llm
      area: response-quality
      regression: aks-cost-basis-consistency
    rubric:
      - "The response rejects the claimed 20 percent increase because the allocation totals use different currencies and cost columns. It recommends obtaining both periods from the same AKS allocation cost column and currency before calculating an absolute or percentage change, without inventing an exchange rate or treating the supplied totals as comparable."
    graders:
      - type: skill-invocation
        config:
          required:
            - cost-analysis
      - type: prompt
        config:
          scoring: binary
          threshold: 1
      - type: tool-calls
        config:
          disallowed:
            - name: "(?i)^(bash|powershell|shell|python|web_fetch|fetch|curl|http|rest)$"
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  - name: "AKS resource costs reject mixed actual and amortized USD totals"
    prompt: "I am investigating a cost increase for the VM scale set backing my AKS cluster. The baseline week shows $100 USD in amortized cost, and the spike week shows $120 USD in actual cost. Both cover complete weeks and the same resources. Is that a 20 percent increase? Explain what reports I need to compare."
    config:
      runs: 1
    tags:
      type: integration
      tier: full
      cost: llm
      area: response-quality
      regression: aks-resource-cost-basis-consistency
    rubric:
      - "The response rejects the claimed 20 percent increase because actual and amortized costs are different bases even though both totals are USD. It recommends obtaining both periods on the same actual or amortized basis using supported resource-level Cost Management queries, keeping any parallel actual and amortized comparisons separate. If only allocation data is available, it discloses that limitation rather than inventing a query option."
    graders:
      - type: skill-invocation
        config:
          required:
            - cost-analysis
      - type: prompt
        config:
          scoring: binary
          threshold: 1
      - type: tool-calls
        config:
          disallowed:
            - name: "(?i)^(bash|powershell|shell|python|web_fetch|fetch|curl|http|rest)$"
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  - name: "Cost investigation uses comparable evidence"
    prompt: "Explain how you would investigate a one-day Azure cost spike without running tools. Include the baseline, drill-down order, financial dimensions, change correlation, and confidence criteria."
    config:
      runs: 1
    tags:
      type: integration
      tier: full
      cost: llm
      area: response-quality
      regression: investigation-depth
    graders:
      - type: skill-invocation
        config:
          required:
            - cost-analysis
      - type: output-matches
        config:
          pattern: "(?i)equal-length|comparable|weekday|baseline"
      - type: output-matches
        config:
          pattern: "(?i)ServiceName|resource group|ResourceId|Meter"
      - type: output-matches
        config:
          pattern: "(?i)ChargeType|PricingModel|amortized|refund|purchase"
      - type: output-matches
        config:
          pattern: "(?i)resourcechanges|confidence|evidence"
      - type: tool-calls
        config:
          disallowed:
            - name: "(?i)^(bash|powershell|shell|python|web_fetch|fetch|curl|http|rest)$"

  - name: "AI attribution separates direct and inferred cost"
    prompt: "Explain how you would attribute Microsoft Foundry and Azure AI costs by service, account, meter, deployment, project, model, and token without running tools."
    config:
      runs: 1
    tags:
      type: integration
      tier: full
      cost: llm
      area: response-quality
      regression: attribution-depth
    graders:
      - type: skill-invocation
        config:
          required:
            - cost-analysis
      - type: output-matches
        config:
          pattern: "(?i)ServiceName|ResourceId|MeterCategory|Meter"
      - type: output-matches
        config:
          pattern: "(?i)deployment|project|token.{0,40}(not|unavailable|unsupported|separate)"
      - type: output-matches
        config:
          pattern: "(?i)direct|indirect|inferred|confidence|shared|unallocated"
      - type: tool-calls
        config:
          disallowed:
            - name: "(?i)^(bash|powershell|shell|python|web_fetch|fetch|curl|http|rest)$"

  - name: "Historical range guardrail is not bypassed"
    prompt: "The Azure cost query rejected my requested historical period because it is outside the supported 92-day window. Without running tools, explain the valid next step and whether an API fallback can bypass the limit."
    config:
      runs: 1
    tags:
      type: integration
      tier: full
      cost: llm
      area: behavior
      regression: retention-guardrail
    graders:
      - type: skill-invocation
        config:
          required:
            - cost-analysis
      - type: output-matches
        config:
          pattern: "(?i)92.day|narrow|supported (period|window)|recent"
      - type: output-matches
        config:
          pattern: "(?i)fallback.{0,80}(not|cannot|does not)|cannot.{0,80}fallback|does not.{0,80}bypass"
      - type: tool-calls
        config:
          disallowed:
            - name: "(?i)^(bash|powershell|shell|python|web_fetch|fetch|curl|http|rest)$"

  - name: "Negative hypothetical pricing"
    prompt: "Estimate the monthly pay-as-you-go price of a Standard_D4s_v5 Windows VM with a P15 disk in East US."
    tags:
      type: integration
      tier: full
      cost: llm
      area: negative-routing
    constraints:
      max_turns: 1
    graders:
      - type: skill-invocation
        config:
          disallowed:
            - cost-analysis

  - name: "Negative rightsizing"
    prompt: "Find oversized Azure SQL databases and recommend smaller SKUs to reduce spend."
    tags:
      type: integration
      tier: full
      cost: llm
      area: negative-routing
    constraints:
      max_turns: 1
    graders:
      - type: skill-invocation
        config:
          disallowed:
            - cost-analysis

  - name: "Negative budget creation"
    prompt: "Create a monthly Azure budget with alerts at 80 and 100 percent."
    tags:
      type: integration
      tier: full
      cost: llm
      area: negative-routing
    constraints:
      max_turns: 1
    graders:
      - type: skill-invocation
        config:
          disallowed:
            - cost-analysis
