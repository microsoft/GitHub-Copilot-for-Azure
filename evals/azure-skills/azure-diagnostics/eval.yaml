# Vally eval config — migrated from Jest integration tests
# Source: tests/azure-diagnostics/integration.test.ts
# Migration: Jest → Vally (Batch 1 — Simple)
#
# Global graders (evaluate#125 workaround): completed and no_runtime_failure
# are duplicated into every stimulus block below.

name: azure-diagnostics-integration-eval
description: |
  Integration evaluation for azure-diagnostics skill — migrated from Jest integration tests.
  Tests skill routing for Container Apps troubleshooting, image pull failures,
  AKS cluster diagnostics, and Azure VM connectivity troubleshooting prompts
  using invocation rate measurement (5 runs, 80% threshold).

tags:
  type: integration
  skill: azure-diagnostics

defaults:
  runs: 5
  timeout: "10m"
  executor: copilot-sdk-agent-runner
  model: claude-sonnet-5

scoring:
  threshold: 0.8

stimuli:
  # ── container-apps-troubleshooting-prompt ──
  # Jest: "invokes azure-diagnostics skill for Container Apps troubleshooting prompt"
  # Assertions: softCheckSkill + isSkillInvoked (invocation rate ≥ 80%)
  - name: "Container App restart troubleshooting"
    prompt: "My Azure Container App keeps restarting, how do I troubleshoot it?"
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: routing
      requiredSkills:
        - azure-diagnostics
      earlyTerminate: '[{"type":"skill-call","skill":"azure-diagnostics"},{"type":"tool-call-count","count":3}]'
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-diagnostics
      # Global: no_runtime_failure
      - type: output-not-matches
        config:
          pattern: "(?im)^(?:fatal error|unhandled exception)(?:\\s|:)"

  # ── image-pull-failure-prompt ──
  # Jest: "invokes azure-diagnostics skill for image pull failure prompt"
  # Assertions: softCheckSkill + isSkillInvoked (invocation rate ≥ 80%)
  - name: "Image pull failure in Container App"
    prompt: "I'm getting an image pull failure error in my Azure Container App deployment"
    tags:
      type: integration
      tier: full
      cost: llm
      area: routing
      requiredSkills:
        - azure-diagnostics
      earlyTerminate: '[{"type":"skill-call","skill":"azure-diagnostics"},{"type":"tool-call-count","count":3}]'
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-diagnostics
      # Global: no_runtime_failure
      - type: output-not-matches
        config:
          pattern: "(?im)^(?:fatal error|unhandled exception)(?:\\s|:)"

  # ── functions-telemetry-destination-drift ──
  # Ensures healthy-runtime-but-wrong-destination incidents still route through
  # Azure Diagnostics when Azure MCP could answer the surface configuration
  # question directly.
  - name: "Function telemetry destination drift"
    prompt: |
      My Azure Function still processes requests successfully, but telemetry
      disappeared from the expected Application Insights resource immediately
      after APPLICATIONINSIGHTS_CONNECTION_STRING was changed. Help me diagnose
      the configuration or telemetry-destination drift.
    tags:
      type: integration
      tier: full
      cost: llm
      area: routing
      requiredSkills:
        - azure-diagnostics
      earlyTerminate: '[{"type":"skill-call","skill":"azure-diagnostics"},{"type":"tool-call-count","count":3}]'
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-diagnostics
      # Global: no_runtime_failure
      - type: output-not-matches
        config:
          pattern: "(?im)^(?:fatal error|unhandled exception)(?:\\s|:)"

  # ── aks-troubleshooting-prompt ──
  # Jest: "invokes azure-diagnostics skill for AKS troubleshooting prompt"
  # Assertions: softCheckSkill + isSkillInvoked (invocation rate ≥ 80%)
  - name: "AKS pending pods and NotReady node"
    prompt: "My AKS cluster has pods stuck in Pending and one node is NotReady. Can you troubleshoot it?"
    tags:
      type: integration
      tier: full
      cost: llm
      area: routing
      requiredSkills:
        - azure-diagnostics
      earlyTerminate: '[{"type":"skill-call","skill":"azure-diagnostics"},{"type":"tool-call-count","count":3}]'
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-diagnostics
      # Global: no_runtime_failure
      - type: output-not-matches
        config:
          pattern: "(?im)^(?:fatal error|unhandled exception)(?:\\s|:)"

  # ── vm-rdp-troubleshooting-prompt ──
  # Migrated from azure-compute ownership: VM connectivity incidents now route to azure-diagnostics.
  - name: "VM RDP timeout troubleshooting"
    prompt: "I can't RDP into my Azure Windows VM. The connection times out on port 3389. Help me troubleshoot it."
    tags:
      type: integration
      tier: full
      cost: llm
      area: routing
      requiredSkills:
        - azure-diagnostics
      earlyTerminate: '[{"type":"skill-call","skill":"azure-diagnostics"},{"type":"tool-call-count","count":3}]'
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-diagnostics
          disallowed:
            - azure-compute
      # Global: no_runtime_failure
      - type: output-not-matches
        config:
          pattern: "(?im)^(?:fatal error|unhandled exception)(?:\\s|:)"
  # ── pod-evidence-script-invoked ──
  # Behavior check: for a fully identified AKS pod failure, the skill should drive the
  # agent to invoke the read-only pod-evidence bundle instead of re-listing the raw
  # kubectl describe/logs/top sequence (issue #2507).
  #
  # tool-call-match stops before execution, preventing accidental use of any ambient
  # cluster context. shell-command-invoked grades the same tool_call event.
  - name: "Pod-evidence script invoked for CrashLoopBackOff"
    prompt: |
      My AKS pod orders-api-7f989d5d9f-k2v8m in namespace production is
      stuck in CrashLoopBackOff. Invoke the bundled azure-diagnostics
      pod-evidence script for that exact pod and namespace as your first
      diagnostic action. Do not discover Azure resources, change context,
      install tools, or run alternative kubectl or Azure queries first.
    config:
      runs: 1
    tags:
      type: integration
      tier: full
      cost: llm
      area: response-quality
      earlyTerminate: '[{"type":"tool-call-match","toolPattern":"^(bash|powershell|pwsh|run_in_terminal)$","argsPattern":"pod-evidence\\.(sh|ps1)"}]'
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-diagnostics
      - type: shell-command-invoked
        config:
          required:
            - command: "(?i)pod-evidence\\.(sh|ps1)"
              description: "agent invoked the pod evidence bundle"
      # Global: no_runtime_failure
      - type: output-not-matches
        config:
          pattern: "(?im)^(?:fatal error|unhandled exception)(?:\\s|:)"

  # ── messaging-namespace-connectivity-probe ──
  # Added with issue #2511: for the messaging "cannot connect at all" flow the
  # skill should drive the agent to *run* the test-messaging-connectivity probe
  # script rather than emit raw curl/nslookup commands. Asserts the agent invokes
  # the script. tool-call-match terminates before execution so no live namespace
  # or ambient Azure context is touched.
  - name: "Service Bus namespace connectivity probe"
    prompt: |
      We've got a production incident: my app cannot connect to
      contoso.servicebus.windows.net. Invoke the bundled azure-diagnostics
      messaging connectivity script for that exact namespace as your first
      diagnostic action so it checks DNS, AMQP 5671/5672, and HTTPS 443.
      Do not discover Azure resources, install tools, query Resource Health,
      or run ad hoc network probes first.
    tags:
      type: integration
      tier: full
      cost: llm
      # area: behavior — asserts the agent runs the probe script, not routing.
      area: behavior
      # Guarantee the azure-diagnostics description survives char-budget
      # truncation so this behavior test isn't gated on routing luck among the
      # full plugin skill set (the post-multi-plugin skill-loading model loads
      # every plugin skill unless requiredSkills pins the ones under test).
      requiredSkills:
        - azure-diagnostics
      # Terminate the moment the agent starts the probe script — we only need to
      # observe the attempt, not wait for the (network-timeout-laden) run to
      # finish. The shell-command-invoked grader below matches the same tool_call
      # start event, so early termination does not drop the signal. A
      # tool-call-count cap is a cost fallback if the agent never runs the script.
      earlyTerminate: '[{"type":"tool-call-match","toolPattern":"bash|powershell|pwsh|run_in_terminal","argsPattern":"test-messaging-connectivity\\.(sh|ps1)"},{"type":"tool-call-count","count":12}]'
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-diagnostics
      # The agent ran the probe script (either variant). Uses shell-command-invoked
      # (not the built-in tool-calls grader): it strips comments / heredoc bodies
      # before matching, so the script name appearing as literal text in a plan or
      # comment cannot false-positive.
      - type: shell-command-invoked
        config:
          required:
            - command: "(?i)test-messaging-connectivity\\.(sh|ps1)"
              description: "agent ran the messaging connectivity probe script"
      # Global: no_runtime_failure
      - type: output-not-matches
        config:
          pattern: "(?im)^(?:fatal error|unhandled exception)(?:\\s|:)"

  # ── vm-ssh-troubleshooting-prompt ──
  # Migrated from azure-compute ownership: VM connectivity incidents now route to azure-diagnostics.
  - name: "VM SSH refused troubleshooting"
    prompt: "I can't SSH into my Azure Linux VM. SSH says connection refused and I need help checking NSG or firewall issues."
    tags:
      type: integration
      tier: full
      cost: llm
      area: routing
      requiredSkills:
        - azure-diagnostics
      earlyTerminate: '[{"type":"skill-call","skill":"azure-diagnostics"},{"type":"tool-call-count","count":3}]'
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-diagnostics
          disallowed:
            - azure-compute
      # Global: no_runtime_failure
      - type: output-not-matches
        config:
          pattern: "(?im)^(?:fatal error|unhandled exception)(?:\\s|:)"

  # ── inspektor-gadget-run-ig-script ──
  # Exercises the run-ig helper script for Inspektor Gadget without executing it.
  # The prompt supplies a confirmed context, target, and approval boundary;
  # tool-call-match stops the run as soon as the helper invocation starts.
  # NOTE: early-terminated runs must NOT use the `completed` grader.
  - name: "Inspektor Gadget run-ig script invocation"
    prompt: |
      The active kubectl context is already confirmed for the intended AKS
      cluster, and node aks-nodepool1-12345678-vmss000000 exists in that
      context. This explicit request authorizes the privileged Inspektor Gadget
      helper operation. Invoke the bundled azure-diagnostics run-ig script as
      your first action to run trace_dns on that exact node. Do not inspect or
      change Azure subscriptions, clusters, or kubectl context first.
    config:
      runs: 1
    tags:
      type: integration
      tier: full
      cost: llm
      area: behavior
      requiredSkills:
        - azure-diagnostics
      earlyTerminate: '[{"type":"tool-call-match","toolPattern":"^(bash|powershell|pwsh|run_in_terminal)$","argsPattern":"run-ig\\.(sh|ps1)"}]'
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-diagnostics
      # The agent started the run-ig helper script.
      - type: shell-command-invoked
        config:
          required:
            - command: "(?i)run-ig\\.(sh|ps1)"
              description: "agent invoked the Inspektor Gadget helper"
      # Global: no_runtime_failure
      - type: output-not-matches
        config:
          pattern: "(?im)^(?:fatal error|unhandled exception)(?:\\s|:)"

  # ═══════════════════════════════════════════
  # Script execution tests
  # ═══════════════════════════════════════════

  # ── aks-baseline-script-execution ──
  # Verifies the skill invokes the aks-baseline.sh/.ps1 script (issue #2506)
  # rather than pasting the individual az/kubectl commands. The prompt asserts
  # the cluster exists and that kubectl is already authenticated, and names the
  # baseline sweep explicitly, so the agent routes straight to the script as its
  # first shell action instead of first running `az aks get-credentials`/`az aks
  # list` (which fail and detour into ad-hoc troubleshooting when no real cluster
  # exists in the test subscription).
  # tool-call-match stops before the script executes against any ambient Azure
  # or kubectl context. The shell-command-invoked grader matches that start event.
  - name: "AKS baseline runs aks-baseline script"
    prompt: "My AKS cluster aks-prod in resource group aks-rg is up and I'm already authenticated with kubectl pointed at it. Run the aks-baseline diagnostic sweep script now to gather its baseline health, then summarize the state. Don't run az aks get-credentials or list clusters first — go straight to the baseline script."
    config:
      runs: 1
    tags:
      type: integration
      tier: full
      cost: llm
      area: response-quality
      requiredSkills:
        - azure-diagnostics
      earlyTerminate: '[{"type":"tool-call-match","toolPattern":"^(bash|powershell|pwsh|run_in_terminal)$","argsPattern":"aks-baseline\\.(ps1|sh)"}]'
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-diagnostics
      - type: shell-command-invoked
        config:
          required:
            - command: "(?i)aks-baseline\\.(ps1|sh)"
              description: "agent invoked the AKS baseline bundle"
      # Global: no_runtime_failure
      - type: output-not-matches
        config:
          pattern: "(?im)^(?:fatal error|unhandled exception)(?:\\s|:)"