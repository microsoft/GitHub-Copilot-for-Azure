# Vally eval config — script-invocation checks for azure-diagnostics
#
# Purpose: verify that when asked to collect diagnostics, the agent routes to
# the azure-diagnostics skill AND asks to run the bundled diagnostic script
# (containerapp-diagnostics / appservice-diagnostics) rather than hand-rolling
# a chain of `az` commands.
#
# We do not execute the diagnostic scripts. Each stimulus supplies a confirmed
# subscription and exact resource identifiers, then uses `tool-call-match` to
# stop as soon as the expected script invocation starts. The
# `shell-command-invoked` grader matches that same start event.
#
# Per repo convention, stimuli with an earlyTerminate tag MUST NOT use the
# `completed` grader (early-terminated runs always fail it by design).

name: azure-diagnostics-script-invocation-eval
description: |
  Verifies the azure-diagnostics skill drives the agent to invoke its bundled
  diagnostic scripts (containerapp-diagnostics, appservice-diagnostics) when
  asked to collect all diagnostics for a Container App or App Service web app.
  Grades routing plus the presence of a shell tool call running the script, and
  terminates as soon as that script tool call completes so no further work runs.

tags:
  type: integration
  skill: azure-diagnostics

defaults:
  runs: 1
  timeout: "10m"
  executor: copilot-sdk-agent-runner
  model: claude-sonnet-5

scoring:
  threshold: 0.8

stimuli:
  # ── containerapp-diagnostics-invocation ──
  # Asserts: isSkillInvoked + tool call running containerapp-diagnostics.(sh|ps1).
  # Terminates before that script tool call executes.
  - name: "Container App diagnostics uses the bundled script"
    prompt: |
      Subscription 11111111-1111-1111-1111-111111111111 is confirmed and
      already selected. Collect all diagnostic information for Azure Container
      App my-app in resource group my-rg. Invoke the bundled
      containerapp-diagnostics script as your first action. Do not enumerate or
      change subscriptions, discover resources, install tools, or run alternate
      Azure queries first.
    tags:
      type: integration
      tier: full
      cost: llm
      area: response-quality
      earlyTerminate: '[{"type":"tool-call-match","toolPattern":"^(bash|powershell|pwsh|run_in_terminal)$","argsPattern":"containerapp-diagnostics\\.(sh|ps1)"},{"type":"tool-call-count","count":6}]'
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-diagnostics
      - type: shell-command-invoked
        config:
          required:
            - command: "(?i)containerapp-diagnostics\\.(sh|ps1)"
              description: "agent invoked the Container Apps diagnostic bundle"
      # Global: no_runtime_failure
      - type: output-not-matches
        config:
          pattern: "(?im)^(?:fatal error|unhandled exception)(?:\\s|:)"

  # ── appservice-diagnostics-invocation ──
  # Asserts: isSkillInvoked + tool call running appservice-diagnostics.(sh|ps1).
  # Terminates before that script tool call executes.
  - name: "App Service diagnostics uses the bundled script"
    prompt: |
      Subscription 11111111-1111-1111-1111-111111111111 is confirmed and
      already selected. Gather all diagnostic information for Azure App Service
      web app my-app in resource group my-rg. Invoke the bundled
      appservice-diagnostics script as your first action. Do not enumerate or
      change subscriptions, discover resources, install tools, or run alternate
      Azure queries first.
    tags:
      type: integration
      tier: full
      cost: llm
      area: response-quality
      earlyTerminate: '[{"type":"tool-call-match","toolPattern":"^(bash|powershell|pwsh|run_in_terminal)$","argsPattern":"appservice-diagnostics\\.(sh|ps1)"},{"type":"tool-call-count","count":6}]'
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-diagnostics
      - type: shell-command-invoked
        config:
          required:
            - command: "(?i)appservice-diagnostics\\.(sh|ps1)"
              description: "agent invoked the App Service diagnostic bundle"
      # Global: no_runtime_failure
      - type: output-not-matches
        config:
          pattern: "(?im)^(?:fatal error|unhandled exception)(?:\\s|:)"
