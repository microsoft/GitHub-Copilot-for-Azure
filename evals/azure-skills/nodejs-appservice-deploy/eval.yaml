# Vally eval config for nodejs-appservice-deploy
#
# Coverage:
# - Express e2e: full end-to-end deployment against a real Azure subscription.
#   Seeds a minimal Express app fixture, lets the agent run to completion, and
#   uses the `tool-calls` grader to assert the agent issued a supported
#   deploy command (`az webapp deploy` or `azd deploy/up`) and never ran
#   the deprecated `az webapp up`. Cleanup of leaked resource groups is
#   handled by the scheduled job in eng/test-subscription-cleanup/.
# - Routing (Next.js/NestJS/generic Node.js): cheap, early-terminated checks
#   that prompts route to this skill.
# - Negative routing (Python, Container Apps, Functions, Terraform/Bicep):
#   cheap, early-terminated checks that prompts do not route here.
#
# Global graders (evaluate#125 workaround): completed and no_runtime_failure
# are duplicated into every stimulus block below.

name: nodejs-appservice-deploy-eval
description: |
  Evaluation suite for the nodejs-appservice-deploy skill.
  Covers a full Express end-to-end deployment plus routing for other
  Node.js web frameworks (Next.js, NestJS, generic), and negative routing
  boundaries (Python, Container Apps, Functions, Terraform/Bicep).

tags:
  type: integration
  skill: nodejs-appservice-deploy

defaults:
  runs: 3
  # 35m global timeout accommodates the Express e2e stimulus, which runs a
  # real Azure deployment. All other stimuli terminate early.
  timeout: "35m"
  executor: copilot-sdk-agent-runner
  model: claude-sonnet-5

scoring:
  threshold: 0.8

stimuli:
  # ── express-e2e ──
  # Full end-to-end Express deployment against a real Azure subscription.
  # `runs: 1` keeps Azure cost bounded. The `systemPrompt` tag asks for a
  # pseudo-random resource group so concurrent runs don't collide.
  - name: "Express app end-to-end deployment"
    prompt: |
      I have an Express sample app in this workspace.
      Use my current Azure subscription and the eastus2 region.
      Deploy this Node.js app to Azure App Service.
    config:
      runs: 1
    environment:
      files:
        - src: fixture/express-app/app.js
          dest: app.js
        - src: fixture/express-app/package.json
          dest: package.json
    tags:
      type: integration
      tier: full
      cost: azure
      area: e2e-deployment
      framework: express
      systemPrompt: '{"mode":"append","content":"Use a pseudo-random resource group name (suffix with random characters) to avoid collisions with existing resource groups."}'
    graders:
      - type: skill-invocation
        config:
          required:
            - nodejs-appservice-deploy
      # Agent must EXECUTE a supported deploy command.
      - type: tool-calls
        config:
          required:
            - name: "^(bash|powershell|pwsh)$"
              command: "\\baz\\s+webapp\\s+deploy\\b|\\bazd\\s+(deploy|up)\\b"
      # Agent must NOT execute the deprecated `az webapp up` (lookahead
      # avoids matching `az webapp update`).
      - type: tool-calls
        config:
          disallowed:
            - name: "^(bash|powershell|pwsh)$"
              command: "\\baz\\s+webapp\\s+up(?!date)\\b"
      # Post-deploy message must surface the app URL.
      - type: output-matches
        config:
          pattern: "azurewebsites\\.net"
      # Skill rule: do NOT probe the deployed endpoint.
      - type: output-not-matches
        config:
          pattern: "(?i)Invoke-WebRequest|\\bcurl\\s+http|\\bwget\\s+http"
      # Global: no_runtime_failure
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace|crashed"

  # ── nextjs-routing ──
  - name: "Next.js app deployment routing"
    prompt: "Deploy this Next.js app to Azure App Service"
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: routing
      framework: nextjs
      earlyTerminate: '[{"type":"skill-call","skill":"nodejs-appservice-deploy"},{"type":"tool-call-count","count":3}]'
    graders:
      - type: skill-invocation
        config:
          required:
            - nodejs-appservice-deploy
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace|crashed"

  # ── nestjs-routing ──
  - name: "NestJS app deployment routing"
    prompt: "Deploy my NestJS API to Azure App Service"
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: routing
      framework: nestjs
      earlyTerminate: '[{"type":"skill-call","skill":"nodejs-appservice-deploy"},{"type":"tool-call-count","count":3}]'
    graders:
      - type: skill-invocation
        config:
          required:
            - nodejs-appservice-deploy
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace|crashed"

  # ── generic-node-routing ──
  - name: "Generic Node.js app deployment routing"
    prompt: "Deploy my Node.js web app to Azure App Service"
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: routing
      framework: generic
      earlyTerminate: '[{"type":"skill-call","skill":"nodejs-appservice-deploy"},{"type":"tool-call-count","count":3}]'
    graders:
      - type: skill-invocation
        config:
          required:
            - nodejs-appservice-deploy
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace|crashed"

  # ── negative: Python on App Service must route to the Python skill ──
  - name: "Python App Service prompt does not trigger Node.js skill"
    prompt: "Deploy my Flask app to Azure App Service"
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: routing-negative
      earlyTerminate: '[{"type":"skill-call","skill":"python-appservice-deploy"},{"type":"tool-call-count","count":3}]'
    graders:
      - type: skill-invocation
        config:
          disallowed:
            - nodejs-appservice-deploy
          required:
            - python-appservice-deploy

  # ── negative: Node.js on Container Apps must NOT route here ──
  # Only asserts this skill is NOT invoked; azure-prepare or azure-app-onboard
  # may legitimately own the prompt.
  - name: "Node.js Container Apps prompt does not trigger Node.js skill"
    prompt: "Deploy my Node.js app to Azure Container Apps"
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: routing-negative
      earlyTerminate: '[{"type":"skill-call","skill":"azure-prepare"},{"type":"skill-call","skill":"azure-app-onboard"},{"type":"tool-call-count","count":3}]'
    graders:
      - type: skill-invocation
        config:
          disallowed:
            - nodejs-appservice-deploy

  # ── negative: Node.js on Functions must NOT route here ──
  # Only asserts this skill is NOT invoked; azure-prepare or azure-app-onboard
  # may legitimately own the prompt.
  - name: "Node.js Functions prompt does not trigger Node.js skill"
    prompt: "Deploy my Node.js app to Azure Functions"
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: routing-negative
      earlyTerminate: '[{"type":"skill-call","skill":"azure-prepare"},{"type":"skill-call","skill":"azure-app-onboard"},{"type":"tool-call-count","count":3}]'
    graders:
      - type: skill-invocation
        config:
          disallowed:
            - nodejs-appservice-deploy

  # ── negative: Node.js + App Service + Terraform must NOT route here ──
  - name: "Node.js App Service Terraform prompt routes to azure-prepare"
    prompt: "Deploy my Express app to Azure App Service using Terraform"
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: routing-negative
      earlyTerminate: '[{"type":"skill-call","skill":"azure-prepare"},{"type":"tool-call-count","count":3}]'
    graders:
      - type: skill-invocation
        config:
          disallowed:
            - nodejs-appservice-deploy
          required:
            - azure-prepare

  # ── negative: Node.js + App Service + Bicep must NOT route here ──
  - name: "Node.js App Service Bicep prompt routes to azure-prepare"
    prompt: "Deploy my Express app to Azure App Service using Bicep"
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: routing-negative
      earlyTerminate: '[{"type":"skill-call","skill":"azure-prepare"},{"type":"tool-call-count","count":3}]'
    graders:
      - type: skill-invocation
        config:
          disallowed:
            - nodejs-appservice-deploy
          required:
            - azure-prepare
