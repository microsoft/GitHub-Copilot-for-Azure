# Vally eval config — migrated from Jest integration tests
# Source: tests/azure-cloud-migrate/integration.test.ts
# Migration: Jest → Vally
#
# Test groups:
#   brownfield-lambda — clones real AWS sample repos, runs migration + follow-up,
#     verifies skill invocation and output file existence.
#   routing — earlyTerminate routing checks for Spring Boot, AWS Fargate, and
#     Kubernetes migration prompts; verifies skill is invoked.
#
# Note on repo context:
#   Brownfield stimuli clone a real sample repo into the agent workspace via
#   environment.commands, mirroring the JS integration tests' cloneRepo() setup.
#   We use git init + fetch --depth 1 + checkout (rather than a bare `git clone`)
#   so cloning is robust even when the workspace is pre-populated.
#
# Note on earlyTerminate / completed grader:
#   Stimuli that specify earlyTerminate MUST NOT use the `completed` grader
#   because early-terminated runs always fail it by design.

name: azure-cloud-migrate-eval
description: |
  Evaluation suite for the azure-cloud-migrate skill.
  Covers:
  - Brownfield Lambda → Azure migration with real sample repos (face-blur, webapp)
  - Spring Boot to Azure Container Apps routing
  - AWS Fargate / ECS to Azure Container Apps routing
  - Kubernetes to Azure Container Apps routing

tags:
  type: integration
  skill: azure-cloud-migrate

defaults:
  timeout: "45m"
  executor: integration-test-agent-runner
  model: claude-sonnet-4.6

scoring:
  threshold: 0.8

stimuli:
  # ── brownfield-lambda-face-blur ──────────────────────────────────────
  # Jest: brownfield-lambda — "migrates serverless-face-blur-service Lambda to Azure"
  # Assertions: isSkillInvoked + expectFiles (src/app.js, src/detectFaces.js,
  #             src/blurFaces.js, migration-status.md, migration-assessment-report.md)
  - name: "Brownfield Lambda - Face Blur Service Migration"
    prompt: |
      Migrate this Lambda to Azure.
      Use the eastus2 region.
      Use my current subscription.
    tags:
      type: integration
      tier: full
      cost: llm+execute
      area: output
      skill: azure-cloud-migrate
      requiredSkills:
        - azure-cloud-migrate
      followUp:
        - "Go with recommended options and test it locally."
    runs: 1
    environment:
      commands:
        - git init -q
        - git remote add origin https://github.com/aws-samples/serverless-face-blur-service
        - git fetch -q --depth 1 origin main
        - git checkout -q FETCH_HEAD -- .
        - git reset -q --soft FETCH_HEAD
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-cloud-migrate
      - type: completed
      - type: file-exists
        config:
          path: "**/migration-status.md"
      - type: file-exists
        config:
          path: "**/migration-assessment-report.md"
      - type: file-exists
        config:
          path: "**/src/app.js"
      - type: file-exists
        config:
          path: "**/src/detectFaces.js"
      - type: file-exists
        config:
          path: "**/src/blurFaces.js"
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  # ── brownfield-lambda-webapp ─────────────────────────────────────────
  # Jest: brownfield-lambda-webapp — "migrates lambda-refarch-webapp to Azure"
  # Assertions: isSkillInvoked + expectFiles (migration-status.md,
  #             migration-assessment-report.md)
  - name: "Brownfield Lambda - Webapp Migration"
