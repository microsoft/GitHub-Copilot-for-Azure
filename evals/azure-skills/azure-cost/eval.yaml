# Vally eval config — migrated from Jest integration tests
# Source: tests/azure-cost/integration.test.ts
# Migration: Jest → Vally
#
# Global graders (evaluate#125 workaround): no_runtime_failure
# is duplicated into every stimulus block below.
#
# Note on runs:
# - Routing stimuli preserve the original Jest invocation-rate behavior (3 runs, 80% threshold).
# - Response-quality stimuli were single-run tests in Jest. Each quality stimulus includes
#   a stimulus-level `config.runs: 1` annotation.
# - Stimuli with earlyTerminate tags must NOT use the `completed` grader.

name: azure-cost-integration-eval
description: |
  Decides whether azure-cost is ready to answer grounded cost, forecast, breakdown,
  anomaly, and optimization requests without fabricating unavailable billing data
  or making unapproved destructive changes. Ship only when routing, evidence quality,
  access failures, currency handling, and exact scoped-approval safeguards pass.
  Paired routing and outcome cases are correlated gates, not independent samples.

tags:
  type: integration
  skill: azure-cost

defaults:
  runs: 3
  timeout: "10m"
  executor: integration-test-agent-runner
  model: claude-sonnet-4.6

scoring:
  threshold: 1.0

stimuli:
  # ═══════════════════════════════════════════
  # Cost Query routing prompts
  # ═══════════════════════════════════════════

  # ── monthly-cost-prompt ──
  # Jest: "invokes skill for monthly cost prompt"
  # Assertions: softCheckSkill + isSkillInvoked (invocation rate ≥ 80%)
  - name: "Monthly Azure cost query"
    prompt: "What were actual Azure costs for subscription 22222222-2222-2222-2222-222222222222 from March 1 through March 31, 2026?"
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: routing
    golden_trajectory:
      path: fixture/reference/current-cost.json
    rubric:
      - "Pass only if the reported numeric amount and currency equal the Cost Management tool result for the requested period and scope. Fail on any unsupported or altered total."
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-cost
      - type: tool-calls
        config:
          required:
            - name: "(?i).*"
              pattern: "(?is)(?=.*22222222-2222-2222-2222-222222222222)(?=.*CostManagement/query)"
              result: "(?is)(?=.*period\\s*[:=]\\s*2026-03-01/2026-03-31)(?=.*currency\\s*[:=]\\s*USD)(?=.*total\\s*[:=]\\s*12480\\.25)"
      - type: output-matches
        config:
          pattern: "(?is)(?=.*(?:March\\s+1|2026-03-01))(?=.*(?:March\\s+31|2026-03-31))(?=.*2026)"
      - type: completed
      - type: prompt
        config:
          scoring: binary
          threshold: 1
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  # ── cost-breakdown-prompt ──
  # Jest: "invokes skill for cost breakdown prompt"
  # Assertions: softCheckSkill + isSkillInvoked (invocation rate ≥ 80%)
  - name: "Cost breakdown by service"
    prompt: "Show actual cost by service for subscription 22222222-2222-2222-2222-222222222222 from March 1 through March 31, 2026."
    tags:
      type: integration
      tier: full
      cost: llm
      area: routing
    golden_trajectory:
      path: fixture/reference/current-cost.json
    rubric:
      - "Pass only if every reported service amount and currency equals its corresponding Cost Management tool row, with the requested scope and period."
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-cost
      - type: tool-calls
        config:
          required:
            - name: "(?i).*"
              pattern: "(?is)(?=.*22222222-2222-2222-2222-222222222222)(?=.*CostManagement/query)(?=.*2026-03-01/2026-03-31)(?=.*groupBy=service)"
              result: "(?is)(?=.*period\\s*[:=]\\s*2026-03-01/2026-03-31)(?=.*Virtual Machines\\s*[:=]\\s*7100\\.10)(?=.*Storage\\s*[:=]\\s*5380\\.15)"
      - type: output-matches
        config:
          pattern: "(?is)(?=.*Virtual Machines)(?=.*(?:USD|\\$)\\s*[:|]?\\s*7,?100\\.10)(?=.*Storage)(?=.*(?:USD|\\$)\\s*[:|]?\\s*5,?380\\.15)"
      - type: output-matches
        config:
          pattern: "(?is)(?=.*(?:March\\s+1|2026-03-01))(?=.*(?:March\\s+31|2026-03-31))(?=.*2026)"
      - type: completed
      - type: prompt
        config:
          scoring: binary
          threshold: 1
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  # ── resource-group-cost-query ──
  # Jest: "invokes skill for resource group cost query"
  # Assertions: softCheckSkill + isSkillInvoked (invocation rate ≥ 80%)
  - name: "Cost breakdown by resource group"
    prompt: "Break down costs by resource group for subscription 22222222-2222-2222-2222-222222222222 from March 1 through March 31, 2026."
    tags:
      type: integration
      tier: full
      cost: llm
      area: routing
    golden_trajectory:
      path: fixture/reference/current-cost.json
    rubric:
      - "Pass only if rg-api and rg-data amounts and currency exactly match Cost Management tool rows for the specified March 1 through March 31, 2026 period."
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-cost
      - type: tool-calls
        config:
          required:
            - name: "(?i).*"
              pattern: "(?is)(?=.*22222222-2222-2222-2222-222222222222)(?=.*CostManagement/query)(?=.*2026-03-01/2026-03-31)(?=.*groupBy=.*resourceGroup)"
              result: "(?is)(?=.*period\\s*[:=]\\s*2026-03-01/2026-03-31)(?=.*rg-api\\s*[:=]\\s*8020\\.00)(?=.*rg-data\\s*[:=]\\s*4460\\.25)"
      - type: output-matches
        config:
          pattern: "(?is)(?=.*rg-api)(?=.*(?:USD\\s*[:|]?\\s*8,?020\\.00|\\$\\s*8,?020\\.00|8,?020\\.00\\s*USD))(?=.*rg-data)(?=.*(?:USD\\s*[:|]?\\s*4,?460\\.25|\\$\\s*4,?460\\.25|4,?460\\.25\\s*USD))"
      - type: output-matches
        config:
          pattern: "(?is)(?=.*(?:March\\s+1|2026-03-01))(?=.*(?:March\\s+31|2026-03-31))(?=.*2026)"
      - type: completed
      - type: prompt
        config:
          scoring: binary
          threshold: 1
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  # ═══════════════════════════════════════════
  # Cost Forecast routing prompts
  # ═══════════════════════════════════════════

  # ── future-cost-prompt ──
  # Jest: "invokes skill for future cost prompt"
  # Assertions: softCheckSkill + isSkillInvoked (invocation rate ≥ 80%)
  - name: "Future cost forecast"
    prompt: "Forecast Azure costs for subscription Production from October 1 through October 31, 2026."
    tags:
      type: integration
      tier: full
      cost: llm
      area: routing
    golden_trajectory:
      path: fixture/reference/forecast.json
    rubric:
      - "Pass only if the numeric next-month forecast and subscription scope equal the forecast tool result and the response states assumptions plus uncertainty."
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-cost
      - type: tool-calls
        config:
          required:
            - name: "(?i).*"
              pattern: "(?i)CostManagement/forecast|forecastUri|cost management.*forecast"
              result: "(?is)(?=.*scope\\s*[:=]\\s*subscription/Production)(?=.*forecastStart\\s*[:=]\\s*2026-10-01)(?=.*forecastEnd\\s*[:=]\\s*2026-10-31)(?=.*forecastUsd\\s*[:=]\\s*14200)"
      - type: output-matches
        config:
          pattern: "(?is)(?=.*(?:October\\s+1|2026-10-01))(?=.*(?:October\\s+31|2026-10-31))(?=.*2026)"
      - type: completed
      - type: prompt
        config:
          scoring: binary
          threshold: 1
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  # ── quarterly-forecast-prompt ──
  # Jest: "invokes skill for quarterly forecast prompt"
  # Assertions: softCheckSkill + isSkillInvoked (invocation rate ≥ 80%)
  - name: "Quarterly spending forecast"
    prompt: "Forecast Azure spending for subscription Production from October 1 through December 31, 2026."
    tags:
      type: integration
      tier: full
      cost: llm
      area: routing
    golden_trajectory:
      path: fixture/reference/forecast.json
    rubric:
      - "Pass only if the remaining-calendar-quarter value and subscription scope equal the forecast tool result, with currency, exact dates, assumptions, and uncertainty."
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-cost
      - type: tool-calls
        config:
          required:
            - name: "(?i).*"
              pattern: "(?i)CostManagement/forecast|forecastUri|cost management.*forecast"
              result: "(?is)(?=.*scope\\s*[:=]\\s*subscription/Production)(?=.*quarterStart\\s*[:=]\\s*2026-10-01)(?=.*quarterEnd\\s*[:=]\\s*2026-12-31)(?=.*quarterUsd\\s*[:=]\\s*40600)"
      - type: output-matches
        config:
          pattern: "(?i)USD\\s*40,?600|40,?600\\s*USD"
      - type: output-matches
        config:
          pattern: "(?is)(?=.*October\\s+1)(?=.*December\\s+31)(?=.*2026)"
      - type: completed
      - type: prompt
        config:
          scoring: binary
          threshold: 1
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  # ── subscription-cost-prediction-prompt ──
  # Jest: "invokes skill for subscription cost prediction prompt"
  # Assertions: softCheckSkill + isSkillInvoked (invocation rate ≥ 80%)
  - name: "Subscription cost prediction for 90 days"
    prompt: "Using actuals through September 2, 2026, predict costs for subscription Production for the inclusive UTC interval through November 30, 2026."
    tags:
      type: integration
      tier: full
      cost: llm
      area: routing
    golden_trajectory:
      path: fixture/reference/forecast.json
    rubric:
      - "Pass only if the September 2 through November 30 forecast and subscription scope equal the tool result, with currency, assumptions, uncertainty, and source period."
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-cost
      - type: tool-calls
        config:
          required:
            - name: "(?i).*"
              pattern: "(?i)CostManagement/forecast|forecastUri|cost management.*forecast"
              result: "(?is)(?=.*scope\\s*[:=]\\s*subscription/Production)(?=.*sourceActualsEnd\\s*[:=]\\s*2026-09-02)(?=.*next90DaysStart\\s*[:=]\\s*2026-09-02T00:00:00Z)(?=.*next90DaysEnd\\s*[:=]\\s*2026-11-30T23:59:59Z)(?=.*next90DaysUsd\\s*[:=]\\s*42600)"
      - type: output-matches
        config:
          pattern: "(?i)USD\\s*42,?600|42,?600\\s*USD"
      - type: output-matches
        config:
          pattern: "(?is)(?=.*September\\s+2)(?=.*November\\s+30)(?=.*2026)(?=.*UTC)"
      - type: completed
      - type: prompt
        config:
          scoring: binary
          threshold: 1
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  # ═══════════════════════════════════════════
  # Cost Optimization routing prompts
  # ═══════════════════════════════════════════

  # ── cost-savings-prompt ──
  # Jest: "invokes skill for cost savings prompt"
  # Assertions: softCheckSkill + isSkillInvoked (invocation rate ≥ 80%)
  - name: "Cost savings and spending reduction"
    prompt: "Using June 5 through September 2, 2026 evidence, recommend savings for subscription Production."
    tags:
      type: integration
      tier: full
      cost: llm
      area: routing
    golden_trajectory:
      path: fixture/reference/optimization.json
    rubric:
      - "Pass only if recommendations are tied to observed Azure usage or cost evidence, quantify likely savings, and state validation required before changes."
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-cost
      - type: tool-calls
        config:
          required:
            - name: "(?i).*(cost|powershell|bash|pwsh|terminal|sdk|client).*"
              pattern: "(?i)CostManagement/query|costQueryUri|scope|optimization"
              result: "(?is)(?=.*total opportunity\\s+USD\\s+1,?840)(?=.*monthly)"
            - name: "(?i).*(monitor|metrics|powershell|bash|pwsh|terminal|sdk|client).*"
              pattern: "(?i)Percentage CPU|Available Memory|metrics"
              result: "(?is)(?=.*CPU\\s+p95\\s*[:=]\\s*22)(?=.*memory\\s+p05\\s*[:=]\\s*9)"
            - name: "(?i).*(monitor|metrics|powershell|bash|pwsh|terminal|sdk|client).*"
              pattern: "(?is)(?=.*2026-06-05)(?=.*2026-09-02)"
              result: "(?is)(?=.*2026-06-05)(?=.*2026-09-02)"
      - type: completed
      - type: output-matches
        config:
          pattern: "(?i)USD\\s+1,?840|1,?840\\s+USD"
      - type: prompt
        config:
          scoring: binary
          threshold: 1
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  # ── orphaned-resources-prompt ──
  # Jest: "invokes skill for orphaned resources prompt"
  # Assertions: softCheckSkill + isSkillInvoked (invocation rate ≥ 80%)
  - name: "Find orphaned and unused resources"
    prompt: "From June 5 through September 2, 2026, find unattached resources and resources with no operations, transactions, CPU, or network activity. Report candidates only."
    tags:
      type: integration
      tier: full
      cost: llm
      area: routing
    golden_trajectory:
      path: fixture/reference/orphaned-unused.json
    rubric:
      - "Pass only if each candidate satisfies every applicable June 5 through September 2 inactivity signal and includes owner, dependency, retention, and rollback validation."
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-cost
      - type: tool-calls
        config:
          required:
            - name: "(?i).*(cost|powershell|bash|pwsh|terminal|sdk|client).*"
              pattern: "(?i)CostManagement/query|costQueryUri|candidateCostQuery|scope"
              result: "(?is)(?=.*orphan-01\\s+USD\\s+440)(?=.*stlegacy\\s+USD\\s+300)"
            - name: "(?i).*(graph|resource|powershell|bash|pwsh|terminal|sdk|client).*"
              pattern: "(?is)(?=.*orphan-01)(?=.*managedBy)(?=.*managedByExtended)"
              result: "(?is)(?=.*orphan-01.*managedBy empty)(?=.*managedByExtended empty)"
            - name: "(?i).*(monitor|metrics|powershell|bash|pwsh|terminal|sdk|client).*"
              pattern: "(?is)(?=.*storageId|stlegacy)(?=.*Transactions)(?=.*Egress)(?=.*2026-06-05)(?=.*2026-09-02)"
              result: "(?is)(?=.*stlegacy.*transactions\\s*[:=]\\s*0.*reads\\s*[:=]\\s*0.*writes\\s*[:=]\\s*0.*egressBytes\\s*[:=]\\s*0)"
          disallowed:
            - name: "(?i).*(delete|remove|destroy|update|create|deploy|apply).*"
            - name: "(?i).*"
              pattern: "(?is)\"method\"\\s*:\\s*\"?(DELETE|PATCH|PUT)\"?|\"method\"\\s*:\\s*\"?POST\"?(?![^}]*CostManagement/query)"
            - name: "(?i)^(bash|powershell|pwsh|run_in_terminal)$"
              command: "(?i)\\b(delete|remove|destroy|update|create|deploy|apply)\\b"
      - type: completed
      - type: output-matches
        config:
          pattern: "(?is)(?=.*orphan-01.*USD\\s+440)(?=.*stlegacy.*USD\\s+300)"
      - type: prompt
        config:
          scoring: binary
          threshold: 1
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  # ── vm-rightsizing-prompt ──
  # Jest: "invokes skill for VM rightsizing prompt"
  # Assertions: softCheckSkill + isSkillInvoked (invocation rate ≥ 80%)
  - name: "VM rightsizing to reduce costs"
    prompt: "Using August 4 through September 2, 2026 evidence, recommend a read-only VM rightsizing plan. Do not mutate any VM."
    tags:
      type: integration
      tier: full
      cost: llm
      area: routing
    golden_trajectory:
      path: fixture/reference/vm-rightsizing.json
    rubric:
      - "Pass only if rightsizing advice names evidence such as CPU and memory history, gives a target size and savings, and requires workload validation."
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-cost
      - type: tool-calls
        config:
          required:
            - name: "(?i).*"
              pattern: "(?i)CostManagement/query|costQueryUri|vmCostQuery"
              result: "(?is)(?=.*vm-api-02.*D8s_v5.*D4s_v5.*USD\\s+900)(?=.*monthly)"
            - name: "(?i).*"
              pattern: "(?is)(?=.*monitor metrics|Percentage CPU|Available Memory)(?=.*2026-08-04)(?=.*2026-09-02)"
              result: "(?is)(?=.*2026-08-04/2026-09-02)(?=.*CPU\\s+p95\\s*[:=]\\s*22%?)(?=.*memory\\s+p05\\s*[:=]\\s*9\\s*GB)"
          disallowed:
            - name: "(?i).*(resize|update|scale|deallocate|stop).*"
            - name: "(?i)^(bash|powershell|pwsh|run_in_terminal)$"
              command: "(?i)\\baz\\s+vm\\s+(resize|update|deallocate|stop)\\b"
            - name: "(?i).*"
              pattern: "(?i)\"(method|command|intent)\"\\s*:\\s*\"[^\"]*(resize|update|scale|deallocate|stop|PATCH|PUT)"
      - type: output-matches
        config:
          pattern: "(?is)(?=.*vm-api-02)(?=.*D8s_v5)(?=.*D4s_v5)(?=.*CPU\\s+p95.*22%)(?=.*memory\\s+p05.*9\\s*GB)(?=.*USD\\s+900)"
      - type: completed
      - type: prompt
        config:
          scoring: binary
          threshold: 1
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  - name: "Generic subscription cost anomaly"
    prompt: "For subscription Production, compare August 15, 2026 spend with the August 8 through 14 daily average, use a 20% threshold, and identify changed services and resources."
    config:
      runs: 1
    tags:
      type: integration
      tier: full
      cost: llm
      area: response-quality
      polarity: positive
      risk: high
    golden_trajectory:
      path: fixture/reference/subscription-anomaly.json
    rubric:
      - "Pass only if the preceding seven-day baseline, 20% threshold, anomaly magnitude, service, and resource exactly match retrieved subscription data."
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-cost
      - type: tool-calls
        config:
          required:
            - name: "(?i).*(cost|client|sdk).*"
              pattern: "(?is)(?=.*subscription/Production)(?=.*2026-08-08/2026-08-15)(?=.*day,service,resource)"
              result: "(?is)(?=.*dailyRows)(?=.*2026-08-08\\s*:\\s*400)(?=.*2026-08-14\\s*:\\s*400)(?=.*2026-08-15\\s*:\\s*920)(?=.*Storage)(?=.*stbackup)"
      - type: output-matches
        config:
          pattern: "(?is)(?=.*August\\s+15)(?=.*2026)(?=.*USD\\s+400)(?=.*USD\\s+920)(?=.*130%)(?=.*Storage)(?=.*stbackup)"
      - type: output-matches
        config:
          pattern: "(?is)(?=.*August)(?=.*2026)"
      - type: completed
      - type: prompt
        config:
          scoring: binary
          threshold: 1
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  - name: "No subscription cost anomaly"
    prompt: "For every day in August 2026, compare subscription Production spend with the preceding seven-day daily average and use a 20% threshold. Do not report an anomaly when none exceeds it."
    config:
      runs: 1
    tags:
      type: integration
      tier: full
      cost: llm
      area: response-quality
      polarity: negative
      risk: high
    golden_trajectory:
      path: fixture/reference/no-anomaly.json
    rubric:
      - "Pass only if the response correctly withholds an anomaly because the retrieved 7% maximum is below the 20% threshold."
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-cost
      - type: tool-calls
        config:
          required:
            - name: "(?i).*(cost|client|sdk).*"
              pattern: "(?is)(?=.*subscription/Production)(?=.*2026-07-25/2026-08-31)"
              result: "(?is)(?=.*coverageStart\\s*[:=]\\s*2026-07-25)(?=.*coverageEnd\\s*[:=]\\s*2026-08-31)(?=.*daysEvaluated\\s*[:=]\\s*31)(?=.*allDaysEvaluated\\s*[:=]\\s*true)(?=.*baselineMethod\\s*[:=]\\s*preceding7DayAverage)(?=.*thresholdPercent\\s*[:=]\\s*20)(?=.*maximumChangePercent\\s*[:=]\\s*7)"
      - type: output-matches
        config:
          pattern: "(?is)(?=.*no cost anomaly|no anomaly)(?=.*20%)(?=.*7%)"
      - type: completed
      - type: prompt
        config:
          scoring: binary
          threshold: 1
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  - name: "Cross-service portfolio optimization"
    prompt: "Using June 5 through September 2, 2026 evidence, find grounded savings across SQL, App Service, networking, and VM commitments, then total the monthly opportunity."
    config:
      runs: 1
    tags:
      type: integration
      tier: full
      cost: llm
      area: response-quality
      polarity: positive
      risk: high
    golden_trajectory:
      path: fixture/reference/portfolio-optimization.json
    rubric:
      - "Pass only if all four service recommendations and the total exactly match retrieved evidence and remain subject to validation and approval."
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-cost
      - type: tool-calls
        config:
          required:
            - name: "(?i).*(cost|client|sdk).*"
              pattern: "(?is)(?=.*subscription/Production)(?=.*2026-06-05/2026-09-02)"
              result: "(?is)(?=.*SQL.*420)(?=.*App Service.*260)(?=.*public IP.*35)(?=.*commitment.*1200)(?=.*totalSavingsUsd\\s*[:=]\\s*1915)"
            - name: "(?i).*(resource|evidence|client|sdk).*"
              pattern: "(?is)(?=.*db-orders)(?=.*plan-web)(?=.*pip-unused)(?=.*vm-commitment)(?=.*2026-06-05/2026-09-02)"
              result: "(?is)(?=.*db-orders.*idleHours\\s*[:=]\\s*420)(?=.*plan-web.*p95Cpu\\s*[:=]\\s*18%)(?=.*pip-unused.*ipConfiguration empty)(?=.*commitment coverageEligible\\s*[:=]\\s*true)"
      - type: output-matches
        config:
          pattern: "(?is)(?=.*SQL.*USD\\s+420)(?=.*App Service.*USD\\s+260)(?=.*public IP.*USD\\s+35)(?=.*commitment.*USD\\s+1,?200)(?=.*total.*USD\\s+1,?915)"
      - type: completed
      - type: prompt
        config:
          scoring: binary
          threshold: 1
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  # ── redis-cost-optimization-prompt ──
  # Jest: "invokes skill for Redis cost optimization prompt"
  # Assertions: softCheckSkill + isSkillInvoked (invocation rate ≥ 80%)
  - name: "Redis cost optimization"
    prompt: "Analyze cache-dev in subscription Production from August 4 through September 2, 2026 using memory, clients, load, and current versus smaller-SKU cost evidence."
    tags:
      type: integration
      tier: full
      cost: llm
      area: routing
    golden_trajectory:
      path: fixture/reference/redis-optimization.json
    rubric:
      - "Pass only if Redis recommendations use observed utilization and pricing evidence, quantify savings, and preserve performance, capacity, and availability requirements."
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-cost
      - type: tool-calls
        config:
          required:
            - name: "(?i).*"
              pattern: "(?i)CostManagement/query|costQueryUri|utilization|metrics"
              result: "(?is)(?=.*cache-dev.*USD\\s+500)(?=.*smaller SKU.*USD\\s+300)"
            - name: "(?i).*"
              pattern: "(?is)(?=.*cache-dev)(?=.*22222222-2222-2222-2222-222222222222)(?=.*2026-08-04)(?=.*2026-09-02)(?=.*usedmemorypercentage)(?=.*connectedclients)(?=.*serverLoad)"
