name: java-appservice-deploy-eval
description: |
  Spring Boot deployment on a real Azure subscription, Java server routing,
  and boundaries for other stacks, hosting targets and IaC.

tags:
  type: integration
  skill: java-appservice-deploy

defaults:
  runs: 1
  timeout: "35m"
  executor: copilot-sdk-agent-runner
  model: claude-sonnet-5

scoring:
  threshold: 0.8

stimuli:
  - name: "Spring Boot end-to-end deployment"
    prompt: |
      I have a Spring Boot sample app in this workspace.
      Use my current Azure subscription and the eastus2 region.
      Deploy this Java app to Azure App Service.
    agent_environment:
      files:
        - src: fixture/java-app/pom.xml
          dest: pom.xml
        - src: fixture/java-app/src/main/java/com/example/hello/HelloApplication.java
          dest: src/main/java/com/example/hello/HelloApplication.java
    tags:
      type: integration
      tier: full
      cost: azure
      area: e2e-deployment
      framework: spring-boot
      systemPrompt: '{"mode":"append","content":"Use a pseudo-random resource group name (suffix with random characters) to avoid collisions with existing resource groups."}'
    graders:
      - type: skill-invocation
        config:
          required: [java-appservice-deploy]
      - type: tool-calls
        config:
          required:
            - name: "^(bash|powershell|pwsh)$"
              command: "\\baz\\s+quota\\s+(list|show)\\b|check-quota\\.(ps1|sh)"
            - name: "^(bash|powershell|pwsh)$"
              command: "\\baz\\s+quota\\s+usage\\s+(list|show)\\b|check-quota\\.(ps1|sh)"
            - name: "^(bash|powershell|pwsh)$"
              command: "\\baz\\s+appservice\\s+list-locations\\b[^\\n]*--sku\\s+P0v3[^\\n]*--linux-workers-enabled"
            - name: "^(bash|powershell|pwsh)$"
              command: "\\baz\\s+webapp\\s+deploy\\b[^\\n]*--type\\s+jar|\\bazd\\s+(deploy|up)\\b"
          disallowed:
            - name: "^(bash|powershell|pwsh)$"
              command: "\\baz\\s+webapp\\s+up(?!date)\\b"
            - name: "^(bash|powershell|pwsh)$"
              command: "\\baz\\s+webapp\\s+log\\s+tail\\b|[Ii]nvoke-[Ww]eb[Rr]equest|\\bcurl\\s+https?://|\\bwget\\s+https?://"
      - type: output-matches
        config:
          pattern: "https://[^\\s]+\\.azurewebsites\\.net"
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace|crashed"

  - name: "Spring Boot routing"
    prompt: "Deploy my Spring Boot app to Azure App Service"
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: routing
      framework: spring-boot
      earlyTerminate: '[{"type":"skill-call","skill":"java-appservice-deploy"},{"type":"tool-call-count","count":3}]'
    graders:
      - type: skill-invocation
        config:
          required: [java-appservice-deploy]

  - name: "Tomcat WAR routing"
    prompt: "Deploy my Java WAR file to Tomcat on Azure App Service"
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: routing
      framework: tomcat
      earlyTerminate: '[{"type":"skill-call","skill":"java-appservice-deploy"},{"type":"tool-call-count","count":3}]'
    graders:
      - type: skill-invocation
        config:
          required: [java-appservice-deploy]

  - name: "JBoss EAP routing"
    prompt: "Deploy my Jakarta EE app to JBoss EAP on Azure App Service"
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: routing
      framework: jboss-eap
      earlyTerminate: '[{"type":"skill-call","skill":"java-appservice-deploy"},{"type":"tool-call-count","count":3}]'
    graders:
      - type: skill-invocation
        config:
          required: [java-appservice-deploy]

  - name: ".NET routes to .NET skill"
    prompt: "Deploy my ASP.NET Core Web API to Azure App Service"
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: routing-negative
      earlyTerminate: '[{"type":"skill-call","skill":"dotnet-appservice-deploy"},{"type":"tool-call-count","count":3}]'
    graders:
      - type: skill-invocation
        config:
          disallowed: [java-appservice-deploy]
          required: [dotnet-appservice-deploy]

  - name: "Java Container Apps does not route here"
    prompt: "Deploy my Spring Boot app to Azure Container Apps"
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: routing-negative
      earlyTerminate: '[{"type":"skill-call","skill":"azure-prepare"},{"type":"skill-call","skill":"azure-app-onboard"},{"type":"tool-call-count","count":3}]'
    graders:
      - type: skill-invocation
        config:
          disallowed: [java-appservice-deploy]

  - name: "Java Azure Functions does not route here"
    prompt: "Deploy my Java Azure Functions HTTP trigger app"
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: routing-negative
      earlyTerminate: '[{"type":"skill-call","skill":"azure-prepare"},{"type":"skill-call","skill":"azure-app-onboard"},{"type":"tool-call-count","count":3}]'
    graders:
      - type: skill-invocation
        config:
          disallowed: [java-appservice-deploy]

  - name: "Java Terraform uses infrastructure routing"
    prompt: "Deploy my Spring Boot app to Azure App Service using azd with Terraform infrastructure"
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: routing-negative
      earlyTerminate: '[{"type":"skill-call","skill":"azure-prepare"},{"type":"tool-call-count","count":3}]'
    graders:
      - type: skill-invocation
        config:
          disallowed: [java-appservice-deploy]
          required: [azure-prepare]

  - name: "Java Bicep uses infrastructure routing"
    prompt: "In my existing Spring Boot project, use azd with Bicep to provision the Azure App Service infrastructure and deploy it. I need infrastructure as code too, not just a code-only deployment; do not scaffold or redesign the application."
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: routing-negative
      earlyTerminate: '[{"type":"skill-call","skill":"azure-prepare"},{"type":"tool-call-count","count":3}]'
    graders:
      - type: skill-invocation
        config:
          disallowed: [java-appservice-deploy]
          required: [azure-prepare]
