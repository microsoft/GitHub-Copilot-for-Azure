          required:
            - azure-resource-lookup
      - type: tool-calls
        config:
          required:
            - name: "(?i).*(resource.?graph|powershell|bash|pwsh).*"
              result: "(?i)(429|Too Many Requests|throttl).*Retry-After\\s*[:=]\\s*3|Retry-After\\s*[:=]\\s*3.*(429|Too Many Requests|throttl)"
