# Vally eval config — migrated from Jest integration tests
# Source: tests/azure-resource-lookup/integration.test.ts
# Migration: Jest → Vally
#
# The original Jest tests were single-run and checked:
# 1. Keyword presence in assistant output (6 tests)
# 2. Skill routing via isSkillInvoked (1 test — "List the websites" prompt only)
#
# In the Vally migration:
# - Routing stimuli add invocation-rate coverage (5 runs, 80% threshold) beyond
#   the single isSkillInvoked check in the original Jest suite.
# - Response-quality stimuli preserve the original keyword-presence checks (1 run).
# - Stimuli with earlyTerminate tags must NOT use the `completed` grader.

name: azure-resource-lookup-integration-eval
description: |
  Decides whether azure-resource-lookup is ready to return accurate, scoped Azure
  inventories and health results across subscriptions. Ship only when routing,
  grounded counts, explicit tag policy, empty results, access failures, partial
  visibility, and paginated Resource Graph results are handled correctly. Paired
  routing and outcome probes intentionally require both selection stability and
  grounded result quality; failure and scale cases cover distinct risks.

tags:
  type: integration
  skill: azure-resource-lookup

defaults:
  runs: 5
  timeout: "10m"
  executor: integration-test-agent-runner
  model: claude-sonnet-4.6

scoring:
  threshold: 1.0

stimuli:
  # ═══════════════════════════════════════════
  # Skill routing prompts
  # ═══════════════════════════════════════════

  # ── cross-subscription-resource-inventory ──
  # Jest: "handles cross-subscription resource inventory"
  # Vally: checks skill invocation (routing coverage added beyond original Jest keyword check)
  - name: "Cross-subscription resource inventory route and outcome"
    prompt: "How much cloud stuff do I have by type across all the subscriptions I can access?"
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: routing
    golden_trajectory:
      path: fixture/reference/inventory.json
    rubric:
      - "Pass only if the response returns a scoped cross-subscription inventory grouped by resource type with query-derived counts."
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-resource-lookup
      - type: tool-calls
        config:
          required:
            - name: "(?i).*"
              pattern: "(?i)graph query|ResourceGraph|Microsoft\\.ResourceGraph"
              result: "(?i)scope=.*total=.*virtualMachines=.*storageAccounts=.*webSites="
      - type: completed
      - type: prompt
        config:
          scoring: binary
          threshold: 1
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  # ── resources-by-location ──
  # Jest: "finds resources by location"
  # Vally: checks skill invocation (routing coverage added beyond original Jest keyword check)
  - name: "Resources by location across subscriptions"
    prompt: "Return a JSON object containing only eastus2 and westus3 resource counts across subscriptions sub-a and sub-b."
    tags:
      type: integration
      tier: full
      cost: llm
      area: routing
    golden_trajectory:
      path: fixture/reference/location-counts.json
    rubric:
      - "Pass only if the output is exactly the two-key JSON object returned by tool evidence, with no extra location or count."
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-resource-lookup
      - type: tool-calls
        config:
          required:
            - name: "(?i).*"
              pattern: "(?is)(?=.*summarize count\\(\\) by location)(?=.*sub-a)(?=.*sub-b)"
              result: "^(?:\\{\"eastus2\":18,\"westus3\":9\\}|\\{\"westus3\":9,\"eastus2\":18\\})$"
      - type: output-matches
        config:
          pattern: "^(?:\\{\"eastus2\":18,\"westus3\":9\\}|\\{\"westus3\":9,\"eastus2\":18\\})$"
      - type: completed
      - type: prompt
        config:
          scoring: binary
          threshold: 1
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  # ── orphaned-disks ──
  # Jest: "finds orphaned disks"
  # Vally: checks skill invocation (routing coverage added beyond original Jest keyword check)
  - name: "Find orphaned or unattached disks"
    prompt: "Which managed disks in subscription 22222222-2222-2222-2222-222222222222 are unattached?"
    tags:
      type: integration
      tier: full
      cost: llm
      area: routing
    golden_trajectory:
      path: fixture/reference/orphaned-disks.json
    rubric:
      - "Pass only if the response identifies concrete unattached managed disks from queried Azure state and does not mutate them."
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-resource-lookup
      - type: tool-calls
        config:
          required:
            - name: "(?i).*"
              pattern: "(?is)(?=.*microsoft\\.compute/disks)(?=.*managedBy)(?=.*managedByExtended)(?=.*isempty)(?=.*22222222-2222-2222-2222-222222222222)"
              result: "(?is)(?=.*disk-old-01.*rg-legacy)(?=.*disk-test-02.*rg-test)(?=.*managedBy empty)(?=.*managedByExtended empty)"
          disallowed:
            - name: "(?i).*(delete|remove|destroy|update|create|deploy|apply).*"
            - name: "(?i).*"
              pattern: "(?i)\"method\"\\s*:\\s*\"?(DELETE|PATCH|PUT|POST)\"?"
      - type: completed
      - type: output-matches
        config:
          pattern: "(?is)(?=.*disk-old-01.*rg-legacy)(?=.*disk-test-02.*rg-test)"
      - type: prompt
        config:
          scoring: binary
          threshold: 1
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  # ── resources-missing-tags ──
  # Jest: "finds resources missing tags"
  # Vally: checks skill invocation (routing coverage added beyond original Jest keyword check)
  - name: "Find resources missing required tags"
    prompt: "Use policy assignment Corp-Required-Tags to find resources missing Owner, CostCenter, or Environment in my subscription."
    tags:
      type: integration
      tier: full
      cost: llm
      area: routing
    golden_trajectory:
      path: fixture/reference/missing-tags.json
    rubric:
      - "Pass only if the response evaluates Owner, CostCenter, and Environment against Corp-Required-Tags and identifies each missing tag."
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-resource-lookup
      - type: tool-calls
        config:
          required:
            - name: "(?i).*"
              pattern: "(?i)Corp-Required-Tags|policy assignment"
              result: "(?is)(?=.*Owner)(?=.*CostCenter)(?=.*Environment)"
            - name: "(?i).*"
              pattern: "(?is)(?=.*isempty\\(tags\\.Owner\\))(?=.*isempty\\(tags\\.CostCenter\\))(?=.*isempty\\(tags\\.Environment\\))(?=.*\\bor\\b)"
              result: "(?is)(?=.*vm-api-01.*Owner)(?=.*stlogs.*CostCenter)(?=.*app-prod.*Environment)"
      - type: output-matches
        config:
          pattern: "(?is)(?=.*vm-api-01.*Owner)(?=.*stlogs.*CostCenter)(?=.*app-prod.*Environment)"
      - type: completed
      - type: prompt
        config:
          scoring: binary
          threshold: 1
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  # ── list-websites ──
  # Jest: "lists websites in subscription" + "skill should be invoked for resource listing prompts"
  # Vally: checks skill invocation (preserves original Jest isSkillInvoked assertion)
  - name: "List websites in subscription"
    prompt: "List Microsoft App Service websites in subscription 22222222-2222-2222-2222-222222222222 with name, resource group, and location."
    tags:
      type: integration
      tier: full
      cost: llm
      area: routing
    golden_trajectory:
      path: fixture/reference/websites.json
    rubric:
      - "Pass only if the response lists query-returned App Service sites for the requested subscription with identifying details."
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-resource-lookup
      - type: tool-calls
        config:
          required:
            - name: "(?i).*"
              pattern: "(?is)(?=.*microsoft\\.web/sites)(?=.*22222222-2222-2222-2222-222222222222)"
              result: "(?is)(?=.*api-prod.*rg-apps.*eastus2)(?=.*portal-prod.*rg-web.*westus3)"
      - type: completed
      - type: prompt
        config:
          scoring: binary
          threshold: 1
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  # ── resource-health-status ──
  # Jest: "checks resource health status"
  # Vally: checks skill invocation (routing coverage added beyond original Jest keyword check)
  - name: "Find unhealthy or degraded resources"
    prompt: "Across all accessible subscriptions, query Resource Health for unhealthy or degraded resources. Report matching resources, or state clearly when the query returns none."
    tags:
      type: integration
      tier: full
      cost: llm
      area: routing
    golden_trajectory:
      path: fixture/reference/health.json
    rubric:
      - "Pass only if the response uses Resource Health evidence and reports matching resources when present or a clear query-derived empty state when none are present."
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-resource-lookup
      - type: tool-calls
        config:
          required:
            - name: "(?i).*"
              pattern: "(?i)HealthResources|availabilityState|Resource Health"
              result: "(?is)(?=.*vm-api-01\\s+Unavailable)(?=.*db-orders\\s+Degraded)"
      - type: output-matches
        config:
          pattern: "(?is)(?=.*vm-api-01.*Unavailable)(?=.*db-orders.*Degraded)"
      - type: completed
      - type: prompt
        config:
          scoring: binary
          threshold: 1
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  # ═══════════════════════════════════════════
  # Response quality tests
  # ═══════════════════════════════════════════

  # ── cross-subscription-resource-quality ──
  # Jest: "handles cross-subscription resource inventory"
  # Assertions: assistant output mentions "resource"
  - name: "Resource group inventory by type"
    prompt: "For resource group rg-apps, return one compact JSON object in this key order: resourceGroup, Microsoft.Web/sites, Microsoft.Storage/storageAccounts, Microsoft.Insights/components, total."
    config:
      runs: 1
    tags:
      type: integration
      tier: full
      cost: llm
      area: response-quality
    golden_trajectory:
      path: fixture/reference/resource-group.json
    rubric:
      - "Pass only if the JSON object exactly binds each resource type to its Resource Graph count and total."
    graders:
      - type: output-matches
        config:
          pattern: "^\\{\"resourceGroup\":\"rg-apps\",\"Microsoft\\.Web/sites\":3,\"Microsoft\\.Storage/storageAccounts\":2,\"Microsoft\\.Insights/components\":1,\"total\":6\\}$"
      - type: output-matches
        config:
          pattern: "(?i)\"total\"\\s*:\\s*6"
      - type: skill-invocation
        config:
          required:
            - azure-resource-lookup
      - type: tool-calls
        config:
          required:
            - name: "(?i).*"
              pattern: "(?i)resourceGroup\\s*=~?\\s*['\"]rg-apps|resource group.*rg-apps"
              result: "(?is)(?=.*rg-apps)(?=.*total\\s*[:=]\\s*6)"
      - type: prompt
        config:
          scoring: binary
          threshold: 1
      - type: completed
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  # ── resources-by-location-quality ──
  # Jest: "finds resources by location"
  # Assertions: assistant output mentions "location"
  - name: "Resources matching exact tags"
    prompt: "Return compact JSON with no whitespace. Order resources api-prod then db-prod; within each, order Environment, Owner, resourceGroup, location. Include only resources matching Environment=prod AND Owner=team-a."
    config:
      runs: 1
    tags:
      type: integration
      tier: full
      cost: llm
      area: response-quality
    golden_trajectory:
      path: fixture/reference/tag-filter.json
    rubric:
      - "Pass only if the JSON contains exactly the two tool-returned resources with both tags, group, and location."
    graders:
      - type: output-matches
        config:
          pattern: "^\\{\"api-prod\":\\{\"Environment\":\"prod\",\"Owner\":\"team-a\",\"resourceGroup\":\"rg-apps\",\"location\":\"eastus2\"\\},\"db-prod\":\\{\"Environment\":\"prod\",\"Owner\":\"team-a\",\"resourceGroup\":\"rg-data\",\"location\":\"westus3\"\\}\\}$"
      - type: skill-invocation
        config:
          required:
            - azure-resource-lookup
      - type: tool-calls
        config:
          required:
            - name: "(?i).*"
              pattern: "(?is)(?=.*Environment.*prod)(?=.*Owner.*team-a)(?=.*\\band\\b)"
              result: "(?is)(?=.*api-prod.*rg-apps.*eastus2)(?=.*db-prod.*rg-data.*westus3)"
      - type: prompt
        config:
          scoring: binary
          threshold: 1
      - type: completed
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  # ── orphaned-disks-quality ──
  # Jest: "finds orphaned disks"
  # Assertions: assistant output mentions "disk"
  - name: "Orphaned public IPs and NICs"
    prompt: "Find public IPs without ipConfiguration and NICs without virtualMachine attachments. Return names and attachment evidence without changing resources."
    config:
      runs: 1
    tags:
      type: integration
      tier: full
      cost: llm
      area: response-quality
    golden_trajectory:
      path: fixture/reference/orphaned-network.json
    rubric:
      - "Pass only if each network candidate and missing attachment field exactly match tool evidence and no mutation occurs."
    graders:
      - type: output-matches
        config:
          pattern: "(?i)public IP|NIC|network"
      - type: output-matches
        config:
          pattern: "(?is)(?=.*pip-old.*ipConfiguration)(?=.*nic-old.*virtualMachine)"
      - type: skill-invocation
        config:
          required:
            - azure-resource-lookup
      - type: tool-calls
        config:
          required:
            - name: "(?i).*"
              pattern: "(?is)(?=.*microsoft\\.network/publicipaddresses)(?=.*microsoft\\.network/networkinterfaces)(?=.*isempty)"
              result: "(?is)(?=.*pip-old.*ipConfiguration empty)(?=.*nic-old.*virtualMachine empty)"
          disallowed:
            - name: "(?i).*(delete|remove|destroy|update|create|deploy|apply).*"
            - name: "(?i).*"
              pattern: "(?i)\"method\"\\s*:\\s*\"?(DELETE|PATCH|PUT|POST)\"?"
            - name: "(?i)^(bash|powershell|pwsh|run_in_terminal)$"
              command: "(?i)\\b(delete|remove|destroy|update|create|deploy|apply)\\b"
      - type: prompt
        config:
          scoring: binary
          threshold: 1
      - type: completed
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  # ── missing-tags-quality ──
  # Jest: "finds resources missing tags"
  # Assertions: assistant output mentions "tag"
  - name: "Resources with failed provisioning"
    prompt: "List resources whose provisioningState is Failed with name, type, and resource group."
    config:
      runs: 1
    tags:
      type: integration
      tier: full
      cost: llm
      area: response-quality
    golden_trajectory:
      path: fixture/reference/failed-provisioning.json
    rubric:
      - "Pass only if each reported resource has Failed provisioning state and its name, type, and group match tool evidence."
    graders:
      - type: output-matches
        config:
          pattern: "(?i)provisioningState.*Failed|Failed.*provisioningState"
      - type: output-matches
        config:
          pattern: "(?is)(?=.*api-broken.*Microsoft\\.Web/sites.*rg-apps)(?=.*vm-broken.*Microsoft\\.Compute/virtualMachines.*rg-vms)"
      - type: output-matches
        config:
          pattern: "(?is)(?=.*api-broken)(?=.*vm-broken)(?=.*Failed)"
      - type: skill-invocation
        config:
          required:
            - azure-resource-lookup
      - type: tool-calls
        config:
          required:
            - name: "(?i).*"
              pattern: "(?i)provisioningState\\s*=~?\\s*['\"]Failed|provisioningState.*Failed"
              result: "(?is)(?=.*api-broken.*Failed)(?=.*vm-broken.*Failed)"
            - name: "(?i).*"
              pattern: "(?i)Resources"
              result: "(?is)(?=.*Microsoft\\.Web/sites)(?=.*Microsoft\\.Compute/virtualMachines)"
      - type: prompt
        config:
          scoring: binary
          threshold: 1
      - type: completed
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  # ── list-websites-quality ──
  # Jest: "lists websites in subscription"
  # Assertions: assistant output mentions "web", "app", or "site"
  - name: "List Azure Container Apps"
    prompt: "List Microsoft.App/containerApps with each app name, resource group, and location."
    config:
      runs: 1
    tags:
      type: integration
      tier: full
      cost: llm
      area: response-quality
    golden_trajectory:
      path: fixture/reference/container-apps.json
    rubric:
      - "Pass only if every Container App name, resource group, and location exactly match Resource Graph results."
    graders:
      - type: output-matches
        config:
          pattern: "(?i)Microsoft\\.App/containerApps|Container Apps?"
      - type: output-matches
        config:
          pattern: "(?is)(?=.*orders-api.*rg-containers.*eastus2)(?=.*jobs-worker.*rg-containers.*eastus2)"
      - type: skill-invocation
        config:
          required:
            - azure-resource-lookup
      - type: tool-calls
        config:
          required:
            - name: "(?i).*"
              pattern: "(?i)microsoft\\.app/containerapps"
              result: "(?is)(?=.*orders-api.*rg-containers.*eastus2)(?=.*jobs-worker.*rg-containers.*eastus2)"
      - type: prompt
        config:
          scoring: binary
          threshold: 1
      - type: completed
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  # ── resource-health-quality ──
  # Jest: "checks resource health status"
  # Assertions: assistant output mentions "health", "available", or "resource"
  - name: "Lookup resource by exact ID"
    prompt: "Find the resource with ID /subscriptions/22222222-2222-2222-2222-222222222222/resourceGroups/rg-apps/providers/Microsoft.Web/sites/api-prod and report its name, type, group, location, and provisioning state."
    config:
      runs: 1
    tags:
      type: integration
      tier: full
      cost: llm
      area: response-quality
    golden_trajectory:
      path: fixture/reference/exact-id.json
    rubric:
      - "Pass only if the exact resource ID is queried and every reported identity and state field matches its Resource Graph result."
    graders:
      - type: output-matches
        config:
          pattern: "(?is)(?=.*api-prod)(?=.*Microsoft\\.Web/sites)(?=.*rg-apps)(?=.*eastus2)(?=.*Succeeded)"
      - type: output-matches
        config:
          pattern: "22222222-2222-2222-2222-222222222222"
      - type: skill-invocation
        config:
          required:
            - azure-resource-lookup
      - type: tool-calls
        config:
          required:
            - name: "(?i).*"
              pattern: "(?i)/subscriptions/22222222-2222-2222-2222-222222222222/resourceGroups/rg-apps/providers/Microsoft\\.Web/sites/api-prod"
              result: "(?is)(?=.*api-prod)(?=.*Microsoft\\.Web/sites)(?=.*rg-apps)(?=.*eastus2)(?=.*Succeeded)"
      - type: output-matches
        config:
          pattern: "(?i)provisioningState.*Succeeded|Succeeded.*provisioningState"
      - type: prompt
        config:
          scoring: binary
          threshold: 1
      - type: completed
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  # Failure and scale coverage
  - name: "Resource Graph permission failure"
    prompt: "Use azure-resource-lookup to inventory subscription 00000000-0000-0000-0000-000000000001. If access fails, state the limitation and least-privilege role needed to retry."
    config:
      runs: 1
    tags:
      type: integration
      tier: full
      cost: llm
      area: failure-handling
      polarity: negative
      risk: high
    golden_trajectory:
      path: fixture/reference/permission-failure.json
    rubric:
      - "Pass only if the response states that the inventory is incomplete, names the inaccessible subscription, requests least-privilege Reader access, and avoids fabricated results."
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-resource-lookup
      - type: tool-calls
        config:
          required:
            - name: "(?i).*"
              pattern: "00000000-0000-0000-0000-000000000001"
              result: "(?i)AuthorizationFailed|access denied"
      - type: output-matches
        config:
          pattern: "(?i)AuthorizationFailed|access denied|permission"
      - type: output-matches
        config:
          pattern: "(?i)Reader"
      - type: output-matches
        config:
          pattern: "(?is)(?=.*00000000-0000-0000-0000-000000000001)(?=.*cannot report|incomplete|partial)"
      - type: output-not-matches
        config:
          pattern: "(?i)(^|[.!?]\\s*)(complete inventory|all subscriptions total|tenant-wide total)\\s*[:=]?\\s*[0-9]"
      - type: completed
      - type: prompt
        config:
          scoring: binary
          threshold: 1
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  - name: "Empty resource inventory"
    prompt: "Query the current subscription for resources tagged EvaluationSentinel=8fbdc6d1-no-match. Report the observed result distinctly from a query failure."
    config:
      runs: 1
    tags:
      type: integration
      tier: full
      cost: llm
      area: failure-handling
      polarity: negative
      risk: medium
    golden_trajectory:
      path: fixture/reference/empty-inventory.json
    rubric:
      - "Pass only if zero results are reported distinctly from query failure and the response verifies the current subscription scope and exact tag filter."
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-resource-lookup
      - type: tool-calls
        config:
          required:
            - name: "(?i).*"
              pattern: "(?i)EvaluationSentinel.*8fbdc6d1-no-match"
              result: "(?i)0 results|zero results|\\[\\]"
      - type: output-matches
        config:
          pattern: "(?i)zero|no matching resources|empty"
      - type: output-matches
        config:
          pattern: "(?i)subscription|scope"
      - type: output-matches
        config:
          pattern: "(?i)EvaluationSentinel|tag filter"
      - type: completed
      - type: prompt
        config:
          scoring: binary
          threshold: 1
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  - name: "Partial cross-subscription access"
    prompt: "Count resources in my current subscription and in subscription 00000000-0000-0000-0000-000000000001 separately. Report any accessible count and any access failure without calling the result tenant-wide."
    config:
      runs: 1
    tags:
      type: integration
      tier: full
      cost: llm
      area: failure-handling
      polarity: negative
      risk: high
    golden_trajectory:
      path: fixture/reference/partial-access.json
    rubric:
      - "Pass only if the response reports scoped partial counts, names successful and inaccessible subscriptions, and does not label the result complete."
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-resource-lookup
      - type: tool-calls
        config:
          required:
            - name: "(?i).*"
              pattern: "(?i)graph query|ResourceGraph|Microsoft\\.ResourceGraph"
              result: "(?i)[0-9,]+\\s+resources"
            - name: "(?i).*"
              pattern: "(?i)graph query|ResourceGraph|Microsoft\\.ResourceGraph"
              result: "(?i)AuthorizationFailed|access denied"
      - type: output-matches
        config:
          pattern: "(?i)partial|incomplete|excluded"
      - type: output-matches
        config:
          pattern: "00000000-0000-0000-0000-000000000001"
      - type: output-not-matches
        config:
          pattern: "(?i)(tenant-wide|all subscriptions|complete total)\\s*[:=]?\\s*[0-9]"
      - type: completed
      - type: prompt
        config:
          scoring: binary
          threshold: 1
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  - name: "Paginated Resource Graph inventory"
    prompt: "List all resources in subscription 22222222-2222-2222-2222-222222222222, consume every Resource Graph continuation token, deduplicate IDs, and report the final count."
    config:
      runs: 1
    tags:
      type: integration
      tier: full
      cost: llm
      area: scale
      polarity: positive
      risk: high
    golden_trajectory:
      path: fixture/reference/pagination.json
    rubric:
      - "Pass only if tool evidence shows every continuation token was consumed, IDs were deduplicated, and the final count is 2,500."
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-resource-lookup
      - type: tool-calls
        config:
          required:
