# Vally eval config — migrated from Jest integration tests
# Source: tests/azure-ai/integration.test.ts
# Migration: Jest → Vally (Batch 1 — Simple)
#
# Global graders (evaluate#125 workaround): completed and no_runtime_failure
# are duplicated into every stimulus block below.

name: azure-ai-integration-eval
description: |
  Integration evaluation for azure-ai skill — migrated from Jest integration tests.
  Tests skill routing for Azure AI Search and Azure Speech prompts
  using invocation rate measurement (5 runs, 80% threshold).

tags:
  type: integration
  skill: azure-ai

defaults:
  runs: 1
  timeout: "10m"
  executor: claude-sdk-agent-runner
  model: claude-sonnet-5

scoring:
  threshold: 0.8

stimuli:
  - name: "Monitor a background Bash task and compute a result from its final random number"
    turns:
      - |
        Create and start a background Bash script task in the current working directory.
        The script must run for 3 minutes: sleep for 30 seconds, print an incrementing
        count and elapsed time, and repeat six times. Only after the full 180 seconds,
        generate a random number using Bash's $RANDOM and print it as FINAL_RANDOM_NUMBER=<number>.
        Keep the script running as a background task, not a foreground command.
        Schedule a check of the background task's output every minute while it runs.
        When it finishes, read its actual output and report the final random number to me.
      - |
        Use the final random number you read from the background task's actual output
        in the previous turn. Multiply that number by 2, then add 3.
        Present the computed number as RESULT=<number>.
    tags:
      type: integration
      tier: full
      cost: llm
      area: behavior
    graders:
      - type: completed
      - type: output-matches
        turn: 0
        config:
          pattern: 'FINAL_RANDOM_NUMBER=\d+'
      - type: output-matches
        turn: 1
        config:
          pattern: 'RESULT=\d+'
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

