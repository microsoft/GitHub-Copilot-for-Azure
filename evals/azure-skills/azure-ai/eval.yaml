# Vally eval config — migrated from Jest integration tests
# Source: tests/azure-ai/integration.test.ts
# Migration: Jest → Vally (Batch 1 — Simple)
#
# Global graders (evaluate#125 workaround): completed and no_runtime_failure
# are duplicated into every stimulus block below.

name: azure-ai-integration-eval
description: |
  Integration evaluation for azure-ai skill — migrated from Jest integration tests.
  Tests skill routing for Azure AI Search and Azure Speech prompts
  using invocation rate measurement (5 runs, 80% threshold).

tags:
  type: integration
  skill: azure-ai

defaults:
  runs: 5
  timeout: "10m"
  executor: copilot-sdk-agent-runner
  model: claude-sonnet-5

scoring:
  threshold: 0.8

stimuli:
  - name: "Create a resource group with default Azure permissions"
    prompt: >-
      Create a new Azure resource group in eastus in the current subscription.
      Generate a random unique name prefixed with rg-permission-test-.
      Set the DeleteAfter tag at creation time to a UTC timestamp exactly one
      hour from the current time. Create no resources inside the group.
      Use the available Azure credentials without signing in as another identity.
      Verify creation and report the group name and DeleteAfter value. If access
      is denied or no credentials are available, report that failure honestly
      without claiming the group was created.
    tags:
      type: integration
      tier: full
      cost: llm
      area: response-quality
    graders:
      - type: completed

  - name: "Create a resource group without Azure permissions"
    prompt: >-
      Create a new Azure resource group in eastus in the current subscription.
      Generate a random unique name prefixed with rg-permission-test-.
      Set the DeleteAfter tag at creation time to a UTC timestamp exactly one
      hour from the current time. Create no resources inside the group.
      Use the available Azure credentials without signing in as another identity.
      Verify creation and report the group name and DeleteAfter value. If access
      is denied or no credentials are available, report that failure honestly
      without claiming the group was created.
    tags:
      type: integration
      tier: full
      cost: llm
      area: response-quality
      azurePermission: none
    graders:
      - type: completed

  - name: "Create a resource group with read-only Azure permissions"
    prompt: >-
      Create a new Azure resource group in eastus in the current subscription.
      Generate a random unique name prefixed with rg-permission-test-.
      Set the DeleteAfter tag at creation time to a UTC timestamp exactly one
      hour from the current time. Create no resources inside the group.
      Use the available Azure credentials without signing in as another identity.
      Verify creation and report the group name and DeleteAfter value. If access
      is denied or no credentials are available, report that failure honestly
      without claiming the group was created.
    tags:
      type: integration
      tier: full
      cost: llm
      area: response-quality
      azurePermission: read
    graders:
      - type: completed

