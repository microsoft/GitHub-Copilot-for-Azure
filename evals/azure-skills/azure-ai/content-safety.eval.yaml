name: azure-ai-content-safety-eval
description: |
  Standalone Azure AI Content Safety (2024-09-01) offline payload/image
  validation, severity/blocklist semantics and scope boundaries. Synthetic only.

tags:
  type: integration
  skill: azure-ai

defaults:
  runs: 1
  timeout: "10m"
  executor: copilot-sdk-agent-runner
  model: claude-sonnet-5
  judge_model: gpt-6.1-sol

scoring:
  threshold: 0.8

stimuli:
  - name: "Route standalone Content Safety API and Prompt Shields preflight"
    prompt: "My standalone Azure AI Content Safety text:analyze and text:shieldPrompt REST requests return HTTP 400 on some inputs. How do I validate the request payloads and severity levels?"
    tags:
      type: trigger
      tier: full
      cost: llm
      area: routing
      requiredSkills:
        - azure-ai
      earlyTerminate: '[{"type":"skill-call","skill":"azure-ai"},{"type":"tool-call-count","count":5}]'
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-ai

  - name: "Validate standalone Content Safety Prompt Shields and Image payloads offline"
    prompt: |
      Using azure-ai, validate these two synthetic standalone Azure AI Content
      Safety 2024-09-01 REST payloads offline with temporary files and the
      bundled validator. Do not contact Azure or install anything.
      1) image:analyze JSON: {"image":{"content":"data:image/png;base64,iVBORw0KGgo="},"outputType":"EightSeverityLevels"}
      2) text:shieldPrompt JSON: {"userPrompt":"SYNTHETIC_SHIELD_SECRET_DO_NOT_REPEAT","documents":["d1","d2","d3","d4","d5","d6"]}
    rubric:
      - "Runs validate-content-safety-request.mjs locally for both image-analyze and shield-prompt payloads."
      - "Identifies the data URI prefix in image.content and that EightSeverityLevels is unsupported on Analyze Image (FourSeverityLevels only)."
      - "Identifies that documents exceeds the 5-document maximum in Prompt Shields."
      - "Does not repeat SYNTHETIC_SHIELD_SECRET_DO_NOT_REPEAT, ask for keys, contact Azure or install software."
    tags:
      type: integration
      tier: full
      cost: llm+execute
      area: response-quality
      requiredSkills:
        - azure-ai
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-ai
      - type: shell-command-invoked
        config:
          required:
            - command: >-
                (?i)(?:^|[;&|\r\n])\s*(?:&\s*)?node(?:\.exe)?\s+(?:"[^"\r\n]*validate-content-safety-request\.mjs"|'[^'\r\n]*validate-content-safety-request\.mjs'|[^\s"';&|\r\n]*validate-content-safety-request\.mjs)(?=$|[\s;&|])
      - type: prompt
        config:
          scoring: scale_1_5
          threshold: 0.8
      - type: completed
      - type: output-not-matches
        config:
          pattern: "SYNTHETIC_SHIELD_SECRET_DO_NOT_REPEAT"

  - name: "Explain haltOnBlocklistHit and FourSeverityLevels odd-threshold pitfalls"
    prompt: |
      In our standalone Azure AI Content Safety 2024-09-01 text:analyze call
      with default outputType and haltOnBlocklistHit: true, two things confuse
      us: (1) our threshold check `severity >= 3` only catches severity 4 and 6,
      never 3; and (2) when a blocklist item matches, categoriesAnalysis comes
      back empty. Is the API broken, and where should we go if we move this to
      Azure API Management policies instead? Do not contact Azure or install anything.
    rubric:
      - "Explains that default FourSeverityLevels returns only 0, 2, 4, 6 (use EightSeverityLevels on text:analyze if 0..7 granularity is needed)."
      - "Explains that haltOnBlocklistHit set to true intentionally skips categoriesAnalysis when a blocklist hits (set false to receive both blocklist matches and category scores)."
      - "Directs Azure API Management llm-content-safety gateway policy configuration to azure-aigateway."
    tags: &quality-tags
      type: integration
      tier: full
      cost: llm
      area: response-quality
      requiredSkills:
        - azure-ai
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-ai
      - type: prompt
        config:
          scoring: scale_1_5
          threshold: 0.8
      - type: completed

  - name: "Content Safety request check without Node.js"
    prompt: |
      Using azure-ai, how do I check a local image and JSON payload for the
      standalone Content Safety REST API when Node.js is not installed on my
      workstation? Do not install anything, modify files or contact Azure.
    rubric:
      - States that validate-content-safety-request.mjs requires Node.js 22+ and does not install anything.
      - Compares the request JSON with the 2024-09-01 contract table in content-safety/api-preflight-and-diagnostics.md without echoing sensitive content, checks only image file size and extension, and reports pixel dimensions as unknown.
    tags: *quality-tags
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-ai
      - type: tool-calls
        config:
          required:
            - name: view
              path: "content-safety[\\\\/]api-preflight-and-diagnostics\\.md"
      - type: shell-command-invoked
        config:
          disallowed:
            - command: '(?i)\b(?:winget|choco|brew|apt(?:-get)?|npm|npx|pnpm|yarn)\s+(?:install|i|add)\b'
      - type: prompt
        config:
          scoring: scale_1_5
          threshold: 0.8
      - type: completed

  - name: "Route out: APIM llm-content-safety policy belongs to AI Gateway"
    prompt: |
      Configure the llm-content-safety policy on my Azure API Management AI
      gateway so prompts to my Azure OpenAI backend are screened before they
      reach the model.
    tags:
      type: integration
      tier: full
      cost: llm
      area: negative-routing
      requiredSkills:
        - azure-ai
        - azure-aigateway
      earlyTerminate: '[{"type":"skill-call","skill":"azure-aigateway"},{"type":"tool-call-count","count":3}]'
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-aigateway
          disallowed:
            - azure-ai
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"
