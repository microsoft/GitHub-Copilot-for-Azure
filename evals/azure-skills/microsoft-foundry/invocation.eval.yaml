  - name: "Hosted Voice two-agent Bridge workflow and invocation boundaries"
    prompt: |
      Without running any commands, show the two-agent azure.yaml architecture
      and Voice Live Bridge 1.0 event sequence for a Hosted Voice Agent in
      Microsoft Foundry (pairing a Python target named travel-target with a
      Voice wrapper named travel-voice), explain how to diagnose protocol_mismatch
      errors vs Prompt Voice troubleshooting, and distinguish Hosted Voice from
      a custom Hosted real-time/audio agent using raw invocations_ws.
    rubric:
      - "Defines two distinct services in azure.yaml with properties directly under each service block: a kind: hosted target (travel-target) with invocations_ws 1.0.0 and Bridge 1.0 metadata, and a kind: voice wrapper (travel-voice) with conversationEngine: { type: hosted_agent, name: travel-target } and store: false."
      - "Describes the Bridge 1.0 event flow over /invocations_ws (session.start -> session.ready, user.message -> response.created -> response.output_text.delta / response.output_text.done -> response.done) and explains protocol_mismatch vs Prompt Voice troubleshooting."
      - "Distinguishes a managed Foundry Voice Agent (kind: voice over the voice protocol endpoint) from a custom Hosted real-time/audio agent over raw invocations_ws."
    tags:
      type: integration
      tier: full
      cost: llm
      area: routing
    constraints:
      max_turns: 8
    graders:
      - type: skill-invocation
        config:
          required: [microsoft-foundry]
      - type: completed
      - type: output-matches
        config:
          pattern: "(?i)invocations_ws"
      - type: output-matches
        config:
          pattern: "(?i)voiceLiveCompatible"
      - type: output-matches
        config:
          pattern: "(?i)bridgeProtocolVersion"
      - type: output-matches
        config:
          pattern: "(?i)conversationEngine"
      - type: output-matches
        config:
          pattern: "(?i)hosted_agent"
      - type: output-matches
        config:
          pattern: "session\\.start"
      - type: output-matches
        config:
          pattern: "session\\.ready"
      - type: output-matches
        config:
          pattern: "user\\.message"
      - type: output-matches
        config:
          pattern: "response\\.created"
      - type: output-matches
        config:
          pattern: "response\\.output_text\\.(delta|done)"
      - type: output-matches
        config:
          pattern: "response\\.done"
      - type: prompt
        config:
          scoring: binary
          threshold: 1
          prompt: |
            Pass only if the response:
            1. Defines two distinct services/agent names in azure.yaml (directly
               under each service block, not nested under config:): a
               kind: hosted target (travel-target) with invocations_ws 1.0.0 and
               metadata voiceLiveCompatible: "true" and bridgeProtocolVersion: "1.0",
               and a kind: voice wrapper (travel-voice) with
               conversationEngine: { type: hosted_agent, name: travel-target }
               and store: false, omitting modelType/model/instructions on the wrapper.
            2. Describes the Bridge 1.0 event flow on /invocations_ws
               (session.start with protocol_version: "1.0" -> session.ready,
               user.message -> response.created -> response.output_text.delta /
               response.output_text.done -> response.done) and explains that
               session.rejected (protocol_mismatch) occurs when protocol_version
               mismatches or the target lacks Bridge 1.0 metadata / invocations_ws
               1.0.0 / session.ready handshake, while noting that Prompt Voice
               has no Hosted sessions/monitor logs.
            3. Distinguishes a managed Foundry Voice Agent (using kind: voice and
               the voice protocol endpoint) from a custom Hosted real-time/audio
               agent over raw invocations_ws with developer-defined frames.
            Fail if it uses invented PascalCase Bridge event names instead of
            the lowercase dotted Bridge 1.0 events, nests agent properties under
            config:, uses obsolete modelType: hosted_agent or targetAgent, gives
            both services the same name, or claims azd ai agent invoke works on
            the Voice wrapper.
      - type: shell-command-invoked
        config:
          disallowed:
            - command: "(?i)\\bazd\\s+ai\\s+agent\\s+(init|invoke)\\b|\\bazd\\s+(up|provision|deploy)\\b"
              description: "Planning-only Hosted Voice test must not run azd commands"

