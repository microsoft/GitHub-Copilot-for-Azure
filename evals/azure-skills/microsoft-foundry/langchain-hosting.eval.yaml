name: microsoft-foundry-langchain-hosting
description: Offline workflow checks for first-class LangChain and LangGraph hosting.

tags:
  skill: microsoft-foundry
  feature: langchain-hosting-p0
  systemPrompt: >-
    {"mode":"append","content":"This is an offline workflow continuation. Invoke microsoft-foundry and resolve packaged references from the skill directory it returns. The parent dependency and workflow environment checks have already completed successfully. Do not rerun them, run Azure CLI or azd, access the network, or change Azure resources. Use the packaged skill and supplied synthetic inputs. Put any questions in the response instead of pausing for interactive input."}

defaults:
  runs: 1
  timeout: "2m"
  executor: copilot-sdk-agent-runner
  model: claude-sonnet-5
  judge_model: gpt-6.1-sol

scoring:
  threshold: 1

stimuli:
  - name: "Offer a framework for greenfield Python"
    prompt: |
      I want to build a Python hosted agent from scratch. Before scaffolding, list only the decisions you still need from me, with choices and defaults.
    tags:
      id: langchain-python-framework-choice
      type: integration
      tier: full
      cost: llm
      area: create
      systemPrompt: >-
        {"mode":"append","content":"This is an offline planning exercise. Any dependency and environment preflight checks have already succeeded; do not rerun them. Do not run setup or cloud commands, access the network, or modify files. Put any questions in the response instead of pausing for interactive input."}
    constraints:
      max_turns: 8
    rubric:
      - |
        Offers a Python framework decision with Microsoft Agent Framework (MAF)
        as the default, LangChain and LangGraph as one option using
        langchain-azure-ai, and a Bring Your Own / Custom option. Accept equivalent
        wording and any option order. Listing LangChain and LangGraph as
        separate choices does not meet the criterion.
    graders:
      - type: skill-invocation
        config: { required: [microsoft-foundry] }
      - type: tool-calls
        config:
          required:
            - name: &readTool '(?i)^(view|read_file|read|bash|powershell|pwsh|run_in_terminal)$'
              pattern: 'quick-start-hosted\.md'
          disallowed: &liveCommands
            - name: '(?i)^(bash|powershell|pwsh|run_in_terminal)$'
              command: '(?i)\bazd?(?:\.exe)?\s+'
      - &requiredRubric
        type: prompt
        config:
          scoring: binary
          threshold: 1
          prompt: Pass only if the final answer satisfies every rubric criterion.
      - type: diff-empty

  - name: "Skip the framework choice for .NET container hosting"
    prompt: |
      I'm starting a new .NET hosted Foundry agent with container deployment. Before initializing it, list the decisions that still need my input. For the framework status, use `Framework: resolved` if you don't need me to choose, or `Framework: <choices>` if you do.
    tags:
      id: langchain-dotnet-framework-skip
      type: integration
      tier: full
      cost: llm
      area: create
    constraints:
      max_turns: 8
    graders:
      - type: skill-invocation
        config: { required: [microsoft-foundry] }
      - type: tool-calls
        config:
          required:
            - name: *readTool
              pattern: 'create-hosted\.md'
          disallowed: *liveCommands
      - type: output-matches
        config:
          pattern: &frameworkResolved '(?i)Framework(?:\*\*)?:[\s*`]*resolved\b'
      - type: diff-empty

  - name: "Choose a custom host only for explicitly required server lifecycle"
    prompt: |
      I want a new Python Foundry hosted agent using LangGraph and Responses. It must initialize a connection pool once at host server startup and close it at host shutdown. Before scaffolding, recommend the exact official sample and the server class I'd use. For the framework status, use `Framework: resolved` if you don't need me to choose, or `Framework: <choices>` if you do.
    tags:
      id: langchain-explicit-custom-host
      type: integration
      tier: full
      cost: llm
      area: create
    constraints:
      max_turns: 8
    graders:
      - type: skill-invocation
        config: { required: [microsoft-foundry] }
      - type: tool-calls
        config:
          required:
            - name: *readTool
              pattern: 'langchain-langgraph-hosting\.md'
          disallowed: *liveCommands
      - type: output-matches
        config:
          pattern: *frameworkResolved
      - type: output-matches
        config:
          pattern: '(?s)(?=.*langgraph/responses/12-custom-host\b)(?=.*ResponsesHostServer\b)'
      - type: diff-empty

  - name: "Recognize a graph manifest and choose the Responses re-host path"
    agent_environment:
      files:
        - src: fixture/langchain-hosting/graph/main.py
          dest: main.py
        - src: fixture/langchain-hosting/langgraph.json
          dest: langgraph.json
    prompt: |
      Plan how to move this existing Python ticket agent to Microsoft Foundry over Responses. Keep its graph behavior and checkpointing. Don't change any files. Identify the strategy and exact official sample, show the startup command and deployment entry point you would use, and list any decisions that still block the move. For the framework status, use `Framework: resolved` if you don't need me to choose, or `Framework: <choices>` if you do.
    tags:
      id: langchain-manifest-responses-rehost
      type: integration
      tier: full
      cost: llm
      area: migrate
    constraints:
      max_turns: 10
    rubric:
      - |
        Identifies the existing graph binding in langgraph.json as evidence
        that the LangGraph framework is already resolved.
      - &noFrameworkQuestion |
        Does not ask the user to select, name, or confirm a framework in the
        final response. Asking for an unresolved project or model is fine.
    graders:
      - type: skill-invocation
        config: { required: [microsoft-foundry] }
      - type: tool-calls
        config:
          required:
            - name: *readTool
              pattern: 're-host\.md'
            - name: *readTool
              pattern: 'langchain-langgraph-hosting\.md'
            - name: *readTool
              pattern: '\blanggraph\.json\b'
              result: '\./main\.py:graph'
          disallowed: &noCloudOrQuestions
            - name: '(?i)^(bash|powershell|pwsh|run_in_terminal)$'
              command: '(?i)\bazd?(?:\.exe)?\s+'
            - name: '(?i)^(ask_user|askuserquestion|request_user_input)$'
      - type: output-matches
        config:
          pattern: *frameworkResolved
      - type: output-matches
        config:
          pattern: '(?s)(?=.*langgraph/responses/10-run\b)(?=.*startupCommand)(?=.*entryPoint)(?=.*langchain_azure_ai\.agents\.hosting\.run\s+--protocol\s+responses\b)'
      - *requiredRubric
      - type: diff-empty

  - name: "Re-host from dependencies with additive Invocations configuration"
    agent_environment:
      files:
        - src: fixture/langchain-hosting/graph
          dest: .
    prompt: |
      Prepare this Python ticket agent for Microsoft Foundry over Invocations. Add the files and dependencies needed for code deployment, keeping the repository root as the service source directory and preserving the existing program and dependencies. The project and model will be selected later, so only make local configuration edits. Summarize the official sample you followed.
    tags:
      id: langchain-dependencies-invocations-rehost
      type: integration
      tier: full
      cost: llm
      area: migrate
    constraints:
      max_turns: 12
    rubric:
      - |
        Identifies the existing LangGraph dependency in requirements.txt
        as evidence that the framework is already resolved.
      - *noFrameworkQuestion
      - |
        Identifies the official configuration-driven Python LangGraph
        Invocations sample (`langgraph/invocations/03-run`) by path, link,
        or a description that distinguishes it from other samples.
      - |
        The generated azure.yaml has a Python hosted agent at the repository
        root. A single services entry has host: azure.ai.agent, kind: hosted,
        language: python, project: . (or equivalent), and an invocations item
        under protocols. Its startupCommand runs
        `python -m langchain_azure_ai.agents.hosting.run --protocol invocations`
        (a `uv run` prefix is fine), and its codeConfiguration.entryPoint is
        `-m langchain_azure_ai.agents.hosting.run --protocol invocations`.
        Reject fields at the top level or spread across services.
      - |
        The generated langgraph.json is valid JSON, with "." in the dependencies
        array and a graph mapped to "./main.py:graph". The graph name can vary.
      - |
        The requirements.txt edit preserves the existing `langgraph>=1,<2`
        dependency and adds `langchain-azure-ai` with both `hosting` and
        `opentelemetry` extras. The version constraint permits installation
        and excludes releases below 1.2.9. Accept higher floors (such as
        `>=1.2.10`) and compatible pins; reject lower floors, missing extras,
        and contradictory constraints.
    graders:
      - type: skill-invocation
        config: { required: [microsoft-foundry] }
      - type: tool-calls
        config:
          required:
            - name: *readTool
              pattern: 'langchain-langgraph-hosting\.md'
            - name: *readTool
              pattern: '\brequirements\.txt\b'
              result: 'langgraph>=1,<2'
          disallowed: *noCloudOrQuestions
      - type: file-exists
        config: { path: azure.yaml }
      - type: file-exists
        config: { path: langgraph.json }
      - type: file-exists
        config: { path: requirements.txt }
      - type: diff-not-contains
        config:
          pattern: '(?m)^diff --git (?:"?a/main\.py"? .*|.* "?b/main\.py"?)$'
      - type: prompt
        config:
          scoring: binary
          threshold: 1
          evidence: [trajectory, diff]
          prompt: |
            Pass only if every rubric criterion is met. Judge the generated
            configuration and dependency edit from the workspace diff. Do not
            credit claims or examples in the answer in place of file changes.

  - name: "Detect the framework of an already hosted agent from pyproject.toml"
    agent_environment:
      files:
        - src: fixture/langchain-hosting/existing-hosted
          dest: .
    prompt: |
      I want to update the ticket-routing logic of our Python agent that's already hosted on Microsoft Foundry. This checkout contains just its deployment and package manifests. Inspect them and explain how you'd continue development and what decisions you still need from me. Give a plan only; don't change any files.
    tags:
      id: langchain-pyproject-existing-hosted
      type: integration
      tier: full
      cost: llm
      area: create
    constraints:
      max_turns: 10
    rubric:
      - |
        Identifies the existing LangChain / LangGraph stack from the
        langchain-azure-ai dependency in the hosted service's pyproject.toml,
        without asking the user to choose or confirm the framework.
      - |
        Continues development of the existing hosted agent in place, preserving
        its current hosting configuration. Does not propose new scaffolding,
        re-hosting, or changing frameworks.
    graders:
      - type: skill-invocation
        config: { required: [microsoft-foundry] }
      - type: tool-calls
        config:
          required:
            - name: *readTool
              pattern: 'create-hosted\.md'
            - name: *readTool
              pattern: 'azure\.yaml'
              result: 'azure\.ai\.agent'
            - name: *readTool
              pattern: 'pyproject\.toml'
              result: 'langchain-azure-ai'
            - name: *readTool
              pattern: 'langchain-langgraph-hosting\.md'
          disallowed: *liveCommands
      - *requiredRubric
      - type: diff-empty

  - name: "Use the LangGraph Toolbox SDK and surface OAuth consent"
    agent_environment:
      files:
        - src: fixture/langchain-hosting/consent-error.json
          dest: consent-error.json
    prompt: |
      How should I wire an existing Foundry toolbox named `ticket-tools` into my Python LangGraph agent? The tools run with the user's OAuth identity, and I need the user to see a useful response when the attached MCP error occurs. Show the integration snippet, including any tool schema adaptation, and point me to the base and user-identity samples. Don't modify anything.
    tags:
      id: langchain-toolbox-user-oauth
      type: integration
      tier: full
      cost: llm
      area: create
    constraints:
      max_turns: 10
    rubric:
      - |
        Uses AzureAIProjectToolbox with the toolbox name from TOOLBOX_NAME
        and points to both official samples (02-langgraph-toolbox and
        03-langgraph-toolbox-user-identity).
      - |
        Shows or explains an actual tool schema adaptation before binding,
        such as adding missing `properties` to object schemas. Do not
        require a particular helper name or wording.
      - |
        Explains how to surface the URL from the nested CONSENT_REQUIRED error
        to the user when MCP returns -32006.
    graders:
      - type: skill-invocation
        config: { required: [microsoft-foundry] }
      - type: tool-calls
        config:
          required:
            - name: *readTool
              pattern: 'use-toolbox-in-hosted-agent\.md'
            - name: *readTool
              pattern: 'consent-error\.json'
          disallowed: *liveCommands
      - type: output-matches
        config:
          pattern: 'https://auth\.example\.invalid/authorize\?ticket=oak-42\b'
      - *requiredRubric
      - type: diff-empty

  - name: "Restore model trace correlation for LangGraph Responses"
    prompt: |
      My Python LangGraph hosted agent uses the Foundry project's OpenAI endpoint with Entra ID. Its graph runs, but the Foundry portal's Traces tab is empty after a Responses invocation. I suspect my ChatOpenAI setup. Show the corrected model setup, where tracing belongs in the graph, the azure.yaml tracing setting, and how to tell whether the fix worked. Give a plan only.
    tags:
      id: langchain-responses-trace-correlation
      type: integration
      tier: full
      cost: llm
      area: tracing
    constraints:
      max_turns: 10
    rubric:
      - |
        Configures ChatOpenAI with the Foundry project OpenAI endpoint from
        AIProjectClient and Entra authentication using DefaultAzureCredential
        and a bearer-token provider for https://ai.azure.com/.default.
      - |
        Uses `use_responses_api=True` and `output_version="responses/v1"` for
        `gen_ai.response.id` correlation.
      - |
        Calls or instructs the user to call `enable_auto_tracing` inside the
        graph factory and sets `OTEL_AUTO_CONFIGURE_AZURE_MONITOR` to true in
        the hosted service's `azure.yaml`. Accept equivalent code or prose.
    graders:
      - type: skill-invocation
        config: { required: [microsoft-foundry] }
      - type: tool-calls
        config:
          required:
            - name: *readTool
              pattern: 'langchain-langgraph-hosting\.md'
          disallowed: *liveCommands
      - *requiredRubric
      - type: diff-empty

  - name: "Check the hosted agent identity before the first remote smoke test"
    prompt: |
      Our `tickets` Python LangGraph hosted agent was just deployed to Microsoft Foundry. Its Responses endpoint is active, but we haven't sent a request yet. It uses ChatOpenAI to call the project's OpenAI endpoint from inside the container. Give me the verification steps in order, including the commands and anything that would block the first smoke test. Do not run anything.

      Deployment handoff:
      - Foundry project ARM ID: `/subscriptions/00000000-0000-4000-8000-000000000001/resourceGroups/fixture-rg/providers/Microsoft.CognitiveServices/accounts/fixture-foundry/projects/tickets`
      - Agent managed identity principal ID: `22222222-2222-4222-8222-222222222222`
      - Deployment caller principal ID: `11111111-1111-4111-8111-111111111111`
    tags:
      id: langchain-pre-smoke-rbac
      type: integration
      tier: full
      cost: llm
      area: deploy
    constraints:
      max_turns: 10
    rubric:
      - |
        Before any remote `azd ai agent invoke`, gives an `az role assignment list`
        check for the effective `Foundry User` role on the supplied Foundry project
        ARM scope. The check targets the agent's managed identity, not the deployment
        caller. Variables are acceptable if bound to the supplied values.
      - |
        If access is missing or has not been verified, blocks the smoke invocation.
        For a missing role, gives the `az role assignment create --role "Foundry User"`
        remediation for the same principal and project scope, to be performed by
        an authorized operator. Recommends invoking only after effective access is confirmed.
    graders:
      - type: skill-invocation
        config: { required: [microsoft-foundry] }
      - type: tool-calls
        config:
          required:
            - name: *readTool
              pattern: 'deploy[\\/]+deploy\.md' # Windows separators are escaped in serialized tool input.
            - name: *readTool
              pattern: 'langchain-langgraph-hosting\.md'
          disallowed: *liveCommands
      - *requiredRubric
      - type: diff-empty

  - name: "Diagnose the container principal behind model 401"
    agent_environment:
      files:
        - src: fixture/langchain-hosting/model-401.txt
          dest: session.log
    prompt: |
      My deployed Python LangGraph agent starts and accepts requests, but the smoke invocation fails. Diagnose the supplied session.log. Show how to check and correct the issue before the next smoke test, with the relevant commands and scope. Do not run the commands or modify resources.
    tags:
      id: langchain-model-401-rbac
      type: integration
      tier: full
      cost: llm
      area: troubleshoot
    constraints:
      max_turns: 10
    rubric:
      - |
        Diagnoses the failing request as the hosted container's ChatOpenAI call
        to the project's OpenAI endpoint. Distinguishes its managed identity
        (22222222-2222-4222-8222-222222222222) from the already authorized
        invocation caller (11111111-1111-4111-8111-111111111111).
      - |
        Both the `az role assignment list` check and the conditional
        `az role assignment create --role "Foundry User"` fix target that
        managed identity and this exact project ARM scope:
        `/subscriptions/00000000-0000-4000-8000-000000000001/resourceGroups/fixture-rg/providers/Microsoft.CognitiveServices/accounts/fixture-foundry/projects/tickets`.
        Variables are fine if they resolve to the right values. Mentioning the
        right identity and scope in prose is insufficient if either command
        uses the caller or a broader scope. Retries the smoke test only after
        effective access is confirmed.
    graders:
      - type: skill-invocation
        config: { required: [microsoft-foundry] }
      - type: tool-calls
        config:
          required:
            - name: *readTool
              pattern: 'troubleshoot\.md'
            - name: *readTool
              pattern: 'langchain-langgraph-hosting\.md'
            - name: *readTool
              pattern: 'session\.log'
              result: 'ChatOpenAI model request failed inside container'
          disallowed: *liveCommands
      - *requiredRubric
      - type: diff-empty
