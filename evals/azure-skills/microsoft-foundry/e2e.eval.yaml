name: microsoft-foundry-e2e-eval
description: |
  Azure-authenticated end-to-end checks for Microsoft Foundry workflows.

tags:
  skill: microsoft-foundry

defaults:
  runs: 1
  timeout: "30m"
  executor: integration-test-agent-runner
  model: claude-sonnet-4.6

scoring:
  threshold: 1

stimuli:
  # ═══════════════════════════════════════════════════════════════════════════
  # Foundry E2E Checks
  # ═══════════════════════════════════════════════════════════════════════════
  - name: "Golden Path - Create and deploy hosted agent"
    constraints:
      max_turns: 50
    tags:
      id: golden-path-create-and-deploy-hosted-agent
      type: foundry-e2e
      tier: full
      cost: llm
      area: create
    prompt: |
      Create a Python hosted agent for B2B customer onboarding and deploy it to a new Foundry project. Use the Responses protocol. After it is done, run in locally to make sure it can run successfully; then deploy it to foundry and ensure it can respond to users correctly.

      Foundry model: gpt-5.4-nano
      Region: eastus
    graders:
      - type: skill-invocation
        config:
          required:
            - microsoft-foundry
      - type: completed
      - type: prompt
        config:
          scoring: binary
          threshold: 1
          prompt: |
            Verify that the coding agent generated hosted-agent code, created a new Foundry project and model deployment, ran local testing, deployed the agent
            successfully to Microsoft Foundry using direct code deploy, invoked the deployed agent after deployment,
            and received a successful response from that deployed agent. Fail if
            code was not generated, no new Foundry project or model deployment was created, local testing was not run, deployment did not succeed, deployment did not use direct code deploy, the deployed agent was not
            actually invoked after deployment, or the deployed agent invocation failed.

  - name: "Migration - OpenAI Agents SDK to Foundry"
    environment:
      files:
        - src: fixture/openai-agents-sdk
          dest: .
    constraints:
      max_turns: 70
    tags:
      id: migration-openai-agents-sdk-to-foundry
      type: foundry-e2e
      tier: full
      cost: llm
      area: migrate
    prompt: |
      This project is our existing Python customer-support agent built using OpenAI Agents SDK and self-hosted as a container on our internal platform. Re-host it on Microsoft Foundry with the minimum code changes necessary, preserving its existing architecture and behavior. Run it locally to make sure it works, create a new Foundry project with Foundry models and deploy the agent there, then invoke the deployed agent to make sure it works after deployment.

      Foundry model: gpt-5.4-nano
      Region: eastus
    graders:
      - type: skill-invocation
        config:
          required:
            - microsoft-foundry
      - type: completed
      - type: prompt
        config:
          scoring: binary
          threshold: 1
          prompt: |
            Verify that the coding agent inspected the existing OpenAI Agents SDK project and re-hosted it as a Microsoft Foundry hosted agent
            while preserving its underlying OpenAI Agents SDK architecture, core agent behavior, and local get_order_status MCP tool.
            Replacing or adapting only the HTTP server or protocol adapter for the Foundry runtime is acceptable and does not count as replacing the underlying SDK architecture.
            Verify that the coding agent created a new Foundry project and model deployment, ran the migrated agent locally, deployed it successfully with direct code deploy,
            invoked the deployed agent with an order-status request, and received a successful tool-grounded response.
