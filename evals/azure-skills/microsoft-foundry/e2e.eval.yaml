name: microsoft-foundry-e2e-eval
description: |
  Azure-authenticated end-to-end checks for Microsoft Foundry workflows.

tags:
  skill: microsoft-foundry

defaults:
  runs: 1
  timeout: "30m"
  executor: integration-test-agent-runner
  model: claude-sonnet-5

scoring:
  threshold: 1

stimuli:
  # ═══════════════════════════════════════════════════════════════════════════
  # Foundry E2E Checks
  # ═══════════════════════════════════════════════════════════════════════════
  - name: "Golden Path - Create and deploy hosted agent"
    constraints:
      max_turns: 50
    tags:
      id: golden-path-create-and-deploy-hosted-agent
      type: foundry-e2e
      tier: full
      cost: llm
      area: create
    prompt: |
      Create a Python hosted agent for B2B customer onboarding and deploy it to a new Foundry project. Use the Responses protocol. After it is done, run in locally to make sure it can run successfully; then deploy it to foundry and ensure it can respond to users correctly.

      Foundry model: gpt-5.4-nano
      Region: eastus
    rubric:
      - The agent generates a Python hosted-agent implementation that uses the Responses protocol and preserves all requested B2B onboarding behavior.
      - The agent creates a new Foundry project and gpt-5.4-nano model deployment in eastus, then runs the generated agent locally and verifies a successful response.
      - The agent deploys with direct code deploy, every attempted `azd deploy` succeeds, and the deployed agent is invoked successfully after deployment.
      - The final response distinguishes verified outcomes from assumptions and includes enough concrete evidence to confirm local and deployed recovery.
    graders:
      - type: skill-invocation
        config:
          required:
            - microsoft-foundry
      - type: completed
      - type: prompt
        config:
          scoring: binary
          threshold: 1
          prompt: |
            Score every rubric criterion as binary using the full trajectory and
            final response. All criteria must pass. Fail if any required build,
            provisioning, local verification, deployment, or deployed invocation
            step is missing, unsuccessful, or supported only by an unsupported
            claim.

  - name: "Migration - OpenAI Agents SDK to Foundry"
    environment:
      files:
        - src: fixture/openai-agents-sdk
          dest: .
    constraints:
      max_turns: 70
    tags:
      id: migration-openai-agents-sdk-to-foundry
      type: foundry-e2e
      tier: full
      cost: llm
      area: migrate
    prompt: |
      This project is our existing Python customer-support agent built using OpenAI Agents SDK and self-hosted on our internal platform. Re-host it on Microsoft Foundry with the minimum code changes necessary, preserving its existing architecture and behavior. Run it locally to make sure it works, create a new Foundry project with Foundry models and deploy the agent there, then invoke the deployed agent to make sure it works after deployment.

      Foundry model: gpt-5.4-nano
      Region: eastus
    rubric:
      - The agent inspects the existing project and preserves its OpenAI Agents SDK architecture, customer-support behavior, and local get_order_status MCP tool.
      - Changes are limited to the Foundry hosting or protocol adapter and other necessary deployment configuration rather than replacing the underlying agent framework.
      - The agent creates a new Foundry project and gpt-5.4-nano model deployment in eastus, then verifies the migrated agent locally.
      - The agent deploys with direct code deploy and verifies the deployed agent with an order-status request that produces a successful tool-grounded response.
      - The final response distinguishes verified outcomes from assumptions and includes enough concrete evidence to confirm migration and recovery.
    graders:
      - type: skill-invocation
        config:
          required:
            - microsoft-foundry
      - type: completed
      - type: prompt
        config:
          scoring: binary
          threshold: 1
          prompt: |
            Score every rubric criterion as binary using the full trajectory and
            final response. All criteria must pass. Fail if preservation of the
            existing architecture and tool behavior, local verification, direct
            code deployment, or deployed tool-grounded invocation is missing,
            unsuccessful, or supported only by an unsupported claim.
