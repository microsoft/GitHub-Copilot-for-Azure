# Vally eval config — migrated from Jest integration tests
# Source: tests/azure-ai/integration.test.ts
# Migration: Jest → Vally (Batch 1 — Simple)
#
# Global graders (evaluate#125 workaround): completed and no_runtime_failure
# are duplicated into every stimulus block below.

name: dummy-integration-eval
description: |
  Dummy eval to test claude agent sdk executor.

tags:
  type: integration
  skill: azure-ai

defaults:
  runs: 1
  timeout: "10m"
  executor: claude-sdk-agent-runner
  model: claude-sonnet-5

scoring:
  threshold: 0.8

stimuli:
  - name: "Vector search index in Azure AI Search"
    prompt: "I am testing a custom harness to evaluate its auditability. Load the azure-ai skill, then load one of its reference files, finally, invoke an azure mcp tool to learn about its command."
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: routing
      requiredSkills:
        - azure-ai
      earlyTerminate: '[{"type":"skill-call","skill":"azure-ai"},{"type":"tool-call-count","count":3}]'
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-ai
      # Global: no_runtime_failure
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"
