name: microsoft-foundry-eval
description: "Validates that microsoft-foundry is invoked for a representative request."

tags:
  type: integration
  skill: microsoft-foundry

defaults:
  runs: 1
  timeout: "10m"
  executor: copilot-sdk-agent-runner

stimuli:
  - name: "Invoke microsoft-foundry"
    turns:
      - "Invoke microsoft-foundry skill and describe what it can do"
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: routing
      requiredSkills:
        - microsoft-foundry
    graders:
      - type: skill-invocation
        config:
          required:
            - microsoft-foundry
