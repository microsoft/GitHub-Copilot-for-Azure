name: azure-diagnostics-eval
description: "Validates that azure-diagnostics is invoked for a representative request."

tags:
  type: integration
  skill: azure-diagnostics

defaults:
  runs: 1
  timeout: "10m"
  executor: copilot-sdk-agent-runner

stimuli:
  - name: "Invoke azure-diagnostics"
    turns:
      - "Invoke azure-diagnostics skill and describe what it can do"
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: routing
      requiredSkills:
        - azure-diagnostics
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-diagnostics
