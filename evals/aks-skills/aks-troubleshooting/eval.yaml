    graders:
      - type: skill-invocation
        config:
          disallowed:
            - aks-troubleshooting
            - aks-network-capture
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  - name: "Route out: AKS cluster creation"
    prompt: "Create and provision a new production AKS cluster with a system node pool. This is not troubleshooting an existing incident."
    tags:
      type: integration
      tier: full
      cost: llm
      area: negative-routing
      requiredSkills:
        - aks-troubleshooting
        - azure-kubernetes
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-kubernetes
          disallowed:
            - aks-troubleshooting
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  - name: "Route out: AKS cost and rightsizing"
    prompt: "Analyze the monthly cost of my healthy AKS clusters and recommend node-pool rightsizing opportunities. There is no active incident."
    tags:
      type: integration
      tier: full
      cost: llm
      area: negative-routing
      requiredSkills:
        - aks-troubleshooting
        - azure-cost
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-cost
          disallowed:
            - aks-troubleshooting
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  - name: "Evidence order: supplied CrashLoopBackOff evidence starts locally"
    prompt: |
      Diagnose without running commands. Pod api-7d9 in namespace checkout is
      in CrashLoopBackOff. Its supplied last state is Terminated reason=Error,
      exitCode=1, and previous logs end with "missing PAYMENT_ENDPOINT". We do
      not have Log Analytics or Container insights. State the next evidence
      reads in order and what remains uncertain.
    tags:
      type: integration
      tier: full
      cost: llm
      area: evidence-order
      source_url: "https://learn.microsoft.com/troubleshoot/azure/azure-kubernetes/create-upgrade-delete/pod-stuck-crashloopbackoff-mode"
      requiredSkills:
        - aks-troubleshooting
        - azure-diagnostics
    rubric:
      - "The response starts with target-bound pod status, describe/events, termination details, and current/previous logs for api-7d9 in checkout; uses the supplied missing PAYMENT_ENDPOINT log as application/configuration evidence; does not require an Azure, Resource Health, Log Analytics, or Container insights sweep before those workload reads; records unavailable monitoring evidence as unknown and expands to node or Azure evidence only if the pod branch requires it; claims no checks ran and proposes no mutation."
    graders:
      - type: skill-invocation
        config:
          required: [aks-troubleshooting]
          disallowed: [azure-diagnostics]
      - type: prompt
        config:
          scoring: binary
          threshold: 1
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  - name: "Evidence order: failed upgrade starts from Azure operation"
    prompt: |
      Diagnose without running commands or retrying. An existing AKS cluster
      upgrade operation failed and the cluster provisioningState is Failed. No
      exact nested catalog signature was supplied. State the first evidence to
      retrieve and the later Kubernetes branch.
    tags:
      type: integration
      tier: full
      cost: llm
      area: evidence-order
      requiredSkills:
        - aks-troubleshooting
        - aks-known-issues
    rubric:
      - "The response starts with the target-bound failed Azure upgrade operation, exact error, cluster and node-pool state, versions, and supported upgrade path; then branches to deprecated APIs, admission webhooks, PDB/drain blockers, node and event evidence as applicable; does not invoke the exact-signature catalog without the missing nested signature; claims no reads ran and requires approval before retrying or changing the cluster."
    graders:
      - type: skill-invocation
        config:
          required: [aks-troubleshooting]
          disallowed: [aks-known-issues]
      - type: prompt
        config:
          scoring: binary
          threshold: 1

  - name: "DNS: LocalDNS-enabled pool has UDP-only failures"
    prompt: |
      Diagnose without running commands or changing DNS. DNS fails only for
      pods on AKS node pool user-a, where LocalDNS is enabled. TCP queries work,
      UDP queries fail, and pods on user-b resolve normally. State the
      read-only branch and mutation boundary.
    tags:
      type: integration
      tier: full
      cost: llm
      area: dns-local
      source_url: "https://learn.microsoft.com/troubleshoot/azure/azure-kubernetes/connectivity/dns/troubleshoot-localdns"
      requiredSkills:
        - aks-troubleshooting
    rubric:
      - "The response branches to the LocalDNS path for affected pool user-a; scopes pool, node, protocol, and DNS-zone behavior; inspects the affected pod resolver, LocalDNS forwarding configuration/service/logs, and UDP path before CoreDNS; does not restart or blame CoreDNS from the symptom alone; states that query logging needs approval and has cost; warns that a node-pool LocalDNS configuration update can reimage nodes; claims no reads ran and performs no mutation."
    graders:
      - type: skill-invocation
        config:
          required: [aks-troubleshooting]
      - type: prompt
        config:
          scoring: binary
          threshold: 1

  - name: "API: webhook timeout with no ready endpoints"
    prompt: |
      Diagnose without running commands or changing resources. Creating a
      Deployment returns "failed calling webhook" with HTTP 504. Supplied
      evidence shows the named webhook Service has zero endpoints. Its
      failurePolicy and selector were not supplied.
    tags:
      type: integration
      tier: full
      cost: llm
      area: api-webhook
      source_url: "https://learn.microsoft.com/azure/architecture/operator-guides/aks/aks-triage-controllers"
      requiredSkills:
        - aks-troubleshooting
    rubric:
      - "The response reads the named validating or mutating webhook configuration, failurePolicy, timeoutSeconds, namespaceSelector, Service, EndpointSlice/endpoints, and backing pods; uses zero endpoints as backend evidence but does not infer the full blast radius without failurePolicy and selector; never deletes, patches, or weakens the webhook from the error string; claims no reads ran and requires owner approval for remediation."
    graders:
      - type: skill-invocation
        config:
          required: [aks-troubleshooting]
      - type: prompt
        config:
          scoring: binary
          threshold: 1

  - name: "API: node-dependent logs timeout uses tunnel branch"
    prompt: |
      Diagnose without running commands or changing nodes. kubectl logs and
      exec time out only for pods scheduled on nodes node-a and node-b; the same
      commands work on other nodes and ordinary API list calls succeed. The
      error references port 10250.
    tags:
      type: integration
      tier: full
      cost: llm
      area: api-tunnel
      source_url: "https://learn.microsoft.com/troubleshoot/azure/azure-kubernetes/connectivity/tunnel-connectivity-issues"
      requiredSkills:
        - aks-troubleshooting
        - aks-network-capture
    rubric:
      - "The response identifies a node-placement-dependent API-server-to-kubelet tunnel or port-10250 branch rather than general pod networking; proposes read-only checks of pod placement, affected node conditions, konnectivity-agent state, and the relevant NSG/firewall/UDR path; does not start packet capture or change node firewall/iptables state; marks service-side causes for escalation with target and incident evidence; claims no reads ran."
    graders:
      - type: skill-invocation
        config:
          required: [aks-troubleshooting]
          disallowed: [aks-network-capture]
      - type: prompt
        config:
          scoring: binary
          threshold: 1

  # ── Development regressions for the #3164 completion items C–H. Derived from
  # public Learn pages (source_url); these are recall/reasoning checks against
  # the skill text, not independent holdouts. Diagnose-only prompts: no reads run.

  - name: "API: 429 storm with managed apiserver guard present"
    prompt: |
      Diagnose without running commands or changing resources. kubectl and CI
      jobs against AKS cluster 'prod' get HTTP 429 for the last hour. Supplied
      evidence: `kubectl get flowschemas` lists `aks-managed-apiserver-guard`
      and a matching PriorityLevelConfiguration exists. No client request
      metrics were supplied.
    tags:
      type: integration
      tier: full
      cost: llm
      area: api-pressure
      case_id: api-429-managed-guard
      derived_from: api-server-webhooks-tunnel.md
      source_url: "https://learn.microsoft.com/troubleshoot/azure/azure-kubernetes/create-upgrade-delete/troubleshoot-apiserver-etcd"
      requiredSkills:
        - aks-troubleshooting
    rubric:
      - "The response identifies aks-managed-apiserver-guard as the AKS managed throttling mechanism applied after API-server OOM events, states that its presence explains the throttling but does not by itself prove the root cause (client load, list/watch patterns, or etcd object growth still need evidence), does not propose deleting or relabeling the guard objects, and asks for client request evidence or etcd size/object-count evidence next."
    graders:
      - type: skill-invocation
        config:
          required: [aks-troubleshooting]
      - type: output-matches
        config:
          pattern: "(?i)aks-managed-apiserver-guard"
      - type: output-not-matches
        config:
          pattern: "(?i)kubectl delete (flowschema|prioritylevelconfiguration)"
      - type: prompt
        config:
          scoring: binary
          threshold: 1

  - name: "API: etcd object growth names the owner as correlation"
    prompt: |
      Diagnose without running commands or changing resources. API latency on
      AKS cluster 'prod' has grown over two weeks. Supplied evidence:
      apiserver_storage_objects for `events.events.k8s.io` and a CRD kind
      `jobs.batch.example.com` both rose from ~2k to ~40k; database size metric
      is 3.1 GB. No controller logs were supplied.
    tags:
      type: integration
      tier: full
      cost: llm
      area: api-pressure
      case_id: etcd-object-growth-correlation
      derived_from: api-server-webhooks-tunnel.md
      source_url: "https://learn.microsoft.com/troubleshoot/azure/azure-kubernetes/create-upgrade-delete/troubleshoot-apiserver-etcd"
      requiredSkills:
        - aks-troubleshooting
    rubric:
      - "The response treats the 3.1 GB database and rising object counts as etcd-pressure evidence (Learn: above 2 GB is large, 8 GB default limit), names the growing kinds and the need to evidence the owning controller via ownerReferences, managedFields, or controller logs before blaming it, calls the link a correlation until then, and does not delete objects or prescribe cleanup without owner approval."
    graders:
      - type: skill-invocation
        config:
          required: [aks-troubleshooting]
      - type: output-not-matches
        config:
          pattern: "(?i)kubectl delete (jobs|events)"
      - type: prompt
        config:
          scoring: binary
          threshold: 1

  - name: "Failed state: operation record before node evidence"
    prompt: |
      Diagnose without running commands or changing resources. AKS cluster
      'prod' shows provisioningState Failed after a node pool scale-up. The
      operator has the Azure CLI but is not sure the aks-preview extension is
      installed. What evidence do you read first, and what if the extension is
      unavailable?
    tags:
      type: integration
      tier: full
      cost: llm
      area: failed-state
      case_id: failed-state-operation-record-first
      derived_from: node-issues.md
      source_url: "https://learn.microsoft.com/troubleshoot/azure/azure-kubernetes/availability-performance/cluster-node-virtual-machine-failed-state"
      requiredSkills:
        - aks-troubleshooting
    rubric:
      - "The response reads the failed operation record first via az aks operation show-latest or show (stating it is an aks-preview extension command), falls back to the activity log with az monitor activity-log list when the extension is unavailable and labels that as degraded evidence, routes an exact catalog error code to aks-known-issues, and does not run az resource update reconcile or vmss update-instances without owner approval."
    graders:
      - type: skill-invocation
        config:
          required: [aks-troubleshooting]
      - type: output-matches
        config:
          pattern: "(?i)az aks operation show"
      - type: output-matches
        config:
          pattern: "(?i)activity[- ]log"
      - type: prompt
        config:
          scoring: binary
          threshold: 1

  - name: "Auto-upgrade: maintenance window but channel none"
    prompt: |
      Diagnose without running commands or changing resources. The owner says
      AKS Standard cluster 'prod' "never auto-upgrades" although they created
      an aksManagedAutoUpgradeSchedule maintenance window two months ago.
      Supplied evidence: autoUpgradeProfile.upgradeChannel is none and node pool
      'np1' powerState is Stopped.
    tags:
      type: integration
      tier: full
      cost: llm
      area: upgrade
      case_id: auto-upgrade-channel-none
      derived_from: references/auto-upgrade-evidence.md
      source_url: "https://learn.microsoft.com/azure/aks/planned-maintenance"
      requiredSkills:
        - aks-troubleshooting
    rubric:
      - "The response explains that a planned-maintenance window only schedules upgrades and does not enable them, so upgradeChannel none means cluster auto-upgrade was never enabled; notes that the stopped node pool would receive an upgrade only when started; presents choosing a channel as an owner decision and does not run az aks update or az aks upgrade."
    graders:
      - type: skill-invocation
        config:
          required: [aks-troubleshooting]
      - type: output-matches
        config:
          pattern: "(?i)channel"
      - type: output-not-matches
        config:
          pattern: "(?i)I (have |will )?(run|ran|executed) az aks (update|upgrade)"
      - type: prompt
        config:
          scoring: binary
          threshold: 1

  - name: "Autoscaler: HPA ceiling is not an autoscaler fault"
    prompt: |
      Diagnose without running commands or changing resources. "The cluster
      autoscaler isn't scaling my AKS node pool." Supplied evidence: the
      workload HPA is at maxReplicas=10 with 10/10 pods Running, no pods are
      Pending, node pool 'np1' is at 4 of maxCount 8, and
      cluster_autoscaler_unschedulable_pods_count is 0.
    tags:
      type: integration
      tier: full
      cost: llm
      area: node-scaling
      case_id: autoscaler-hpa-ceiling
      derived_from: node-issues.md
      source_url: "https://learn.microsoft.com/azure/aks/cluster-autoscaler"
      requiredSkills:
        - aks-troubleshooting
    rubric:
