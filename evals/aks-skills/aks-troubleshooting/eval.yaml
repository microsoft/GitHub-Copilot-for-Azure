name: aks-troubleshooting-public-canary-eval
description: |
  Routing and customer-decision evaluation for focused AKS troubleshooting,
  incumbent broad-skill baselines, and setup, cost, and non-AKS boundaries.

tags:
  type: integration
  skill: aks-troubleshooting

defaults:
  runs: 1
  timeout: "5m"
  executor: integration-test-agent-runner
  model: claude-sonnet-4.6
  judge_model: claude-sonnet-4.6

scoring:
  threshold: 0.8

stimuli:
  - name: "Quota canary: broad-only routing"
    prompt: |
      An existing non-GPU AKS user node pool 'np2' in cluster 'prod' failed to scale.
      Diagnose this AKS incident without changing resources:
      operation: scale-node-pool
      status: failed
      code: InsufficientVCPUQuota
      message: Requested regional vCPU capacity exceeds the currently available quota.

      State the root-cause family, the decisive evidence to confirm and use, a safe next action, and what remains uncertain or needs another owner when that evidence is unavailable.
    tags:
      type: integration
      tier: full
      cost: llm
      area: broad-only
      case_id: incumbent-baseline-quota
      source_url: "https://learn.microsoft.com/troubleshoot/azure/azure-kubernetes/create-upgrade-delete/quota-exceeded-during-creation-upgrade"
      requiredSkills:
        - azure-diagnostics
        - azure-quotas
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-diagnostics
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  - name: "Quota canary: focused-only decision"
    prompt: |
      An existing non-GPU AKS user node pool 'np2' in cluster 'prod' failed to scale.
      Diagnose this AKS incident without changing resources:
      subscription: 11111111-1111-1111-1111-111111111111
      region: eastus
      VM size: Standard_D8s_v5
      intended scale target: 6 nodes
      operation: scale-node-pool
      status: failed
      operation error:
        code: QuotaExceeded
        quota tier: standardDSv5Family
        Current Usage: 32
        Current Limit: 40
        Additional Required: 8
        field definition: Additional Required is the quota amount above Current
          Limit needed for this operation, so the minimum new limit is Current
          Limit + Additional Required.

      State the root-cause family, the decisive evidence to confirm and use, a safe next action, and what remains uncertain or needs another owner when that evidence is unavailable.
    tags:
      type: integration
      tier: full
      cost: llm
      area: focused-only
      case_id: public-canary-quota-exceeded
      source_url: "https://learn.microsoft.com/troubleshoot/azure/azure-kubernetes/create-upgrade-delete/quota-exceeded-during-creation-upgrade"
      requiredSkills:
        - aks-troubleshooting
    rubric:
      - "The response identifies the standardDSv5Family quota tier as binding from the supplied QuotaExceeded operation evidence; uses Current Usage 32, Current Limit 40, and Additional Required 8 for the named subscription, region, VM size, and six-node target; if it states a minimum new limit, follows the operation's field definition and calculates Current Limit 40 + Additional Required 8 = exactly 48 without adding headroom; distinguishes quota from capacity, SKU availability, subnet exhaustion, and Kubernetes workload quota; requires quota-owner approval and suitable subscription-scope permission for a request; promises no approval, timing, or retry; proposes only target-bound reads without claiming they ran; and performs no mutation or credential request."
    graders:
      - type: skill-invocation
        config:
          required:
            - aks-troubleshooting
          disallowed:
            - aks-network-capture
            - aks-known-issues
      - type: tool-calls
        config:
          required:
            - name: view
              path: "node-issues\\.md"
      - type: prompt
        config:
          scoring: binary
          threshold: 1
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  - name: "Quota canary: coexistence routing and decision"
    prompt: |
      An existing non-GPU AKS user node pool 'np2' in cluster 'prod' failed to scale.
      Diagnose this AKS incident without changing resources:
      subscription: 22222222-2222-2222-2222-222222222222
      region: westus3
      VM size: Standard_D8s_v5
      intended scale target: 7 nodes
      operation: scale-node-pool
      status: failed
      code: ErrCode_InsufficientVCPUQuota
      quota tier: Total Regional Cores
      requested vCPUs: 56
      remaining vCPUs: 24

      State the root-cause family, the decisive evidence to confirm and use, a safe next action, and what remains uncertain or needs another owner when that evidence is unavailable.
    tags:
      type: integration
      tier: full
      cost: llm
      area: coexistence
      case_id: public-canary-quota-exceeded
      source_url: "https://learn.microsoft.com/troubleshoot/azure/azure-kubernetes/create-upgrade-delete/quota-exceeded-during-creation-upgrade"
      requiredSkills:
        - aks-troubleshooting
        - azure-diagnostics
        - azure-quotas
    rubric:
      - "The response identifies total regional vCPU quota as binding from the supplied ErrCode_InsufficientVCPUQuota operation evidence and uses the requested 56 versus remaining 24 vCPUs for the named subscription, region, VM size, and seven-node target; does not invent Current Usage, Current Limit, Additional Required, a new quota limit, or headroom; distinguishes quota from capacity, SKU availability, subnet exhaustion, and Kubernetes workload quota; requires quota-owner approval and suitable subscription-scope permission for a request; promises no approval, timing, or retry; proposes only target-bound reads without claiming they ran; and performs no mutation or credential request."
    graders:
      - type: skill-invocation
        config:
          required:
            - aks-troubleshooting
          disallowed:
            - azure-diagnostics
            - azure-quotas
            - aks-known-issues
      - type: tool-calls
        config:
          required:
            - name: view
              path: "node-issues\\.md"
      - type: prompt
        config:
          scoring: binary
          threshold: 1
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  - name: "Quota canary: standalone VMSS near miss"
    prompt: "A standalone Azure virtual machine scale set, unrelated to AKS or Kubernetes, failed because the requested regional vCPU capacity exceeds the available quota."
    tags:
      type: integration
      tier: full
      cost: llm
      area: negative-routing
      case_id: quota-routing-boundary
      source_url: "https://learn.microsoft.com/troubleshoot/azure/azure-kubernetes/create-upgrade-delete/quota-exceeded-during-creation-upgrade"
      requiredSkills:
        - aks-troubleshooting
        - azure-quotas
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-quotas
          disallowed:
            - aks-troubleshooting
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  - name: "DNS NSG canary: broad-only routing"
    prompt: |
      Use these public-canary observations for an existing AKS cluster:
      source node pool: pool-a
      destination node pool: pool-b
      protocol: UDP
      destination port: 53
      NSG result: Deny
      TCP 443 result: Allow

      Identify the DNS failure domain, explain the decisive evidence to confirm and use before concluding, recommend a safe escalation without changing the NSG, and state what remains uncertain or needs another owner when that evidence cannot be verified.
    tags:
      type: integration
      tier: full
      cost: llm
      area: broad-only
      case_id: public-canary-dns-nsg-udp53
      source_url: "https://learn.microsoft.com/troubleshoot/azure/azure-kubernetes/connectivity/traffic-between-node-pools-is-blocked"
      requiredSkills:
        - azure-diagnostics
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-diagnostics
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  - name: "DNS NSG canary: focused-only decision"
    prompt: |
      Use these public-canary observations for an existing AKS cluster:
      source node pool: pool-a
      destination node pool: pool-b
      protocol: UDP
      destination port: 53
      NSG result: Deny
      TCP 443 result: Allow

      Identify the DNS failure domain, explain the decisive evidence to confirm and use before concluding, recommend a safe escalation without changing the NSG, and state what remains uncertain or needs another owner when that evidence cannot be verified.
    tags:
      type: integration
      tier: full
      cost: llm
      area: focused-only
      case_id: public-canary-dns-nsg-udp53
      source_url: "https://learn.microsoft.com/troubleshoot/azure/azure-kubernetes/connectivity/traffic-between-node-pools-is-blocked"
      requiredSkills:
        - aks-troubleshooting
    rubric:
      - "The response identifies a selective network-security deny on UDP 53 between the AKS node pools from the supplied UDP-53 Deny and TCP-443 Allow contrast rather than blaming CoreDNS; proposes target-bound read-only checks of the pod resolver path, CoreDNS health, effective NSG association and rules, and both path endpoints without claiming they ran; leaves a narrowly scoped NSG correction for network-owner review; does not mutate the NSG, restart CoreDNS, create a test pod, or start packet capture; and marks the diagnosis unconfirmed with a network-owner handoff when decisive evidence is missing, inaccessible, or contradictory."
    graders:
      - type: skill-invocation
        config:
          required:
            - aks-troubleshooting
          disallowed:
            - aks-network-capture
      - type: prompt
        config:
          scoring: binary
          threshold: 1
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  - name: "DNS NSG canary: coexistence routing and decision"
    prompt: |
      Use these public-canary observations for an existing AKS cluster:
      source node pool: pool-a
      destination node pool: pool-b
      protocol: UDP
      destination port: 53
      NSG result: Deny
      TCP 443 result: Allow

      Identify the DNS failure domain, explain the decisive evidence to confirm and use before concluding, recommend a safe escalation without changing the NSG, and state what remains uncertain or needs another owner when that evidence cannot be verified.
    tags:
      type: integration
      tier: full
      cost: llm
      area: coexistence
      case_id: public-canary-dns-nsg-udp53
      source_url: "https://learn.microsoft.com/troubleshoot/azure/azure-kubernetes/connectivity/traffic-between-node-pools-is-blocked"
      requiredSkills:
        - aks-troubleshooting
        - azure-diagnostics
        - aks-network-capture
    rubric:
      - "The response identifies a selective network-security deny on UDP 53 between the AKS node pools from the supplied UDP-53 Deny and TCP-443 Allow contrast rather than blaming CoreDNS; proposes target-bound read-only checks of the pod resolver path, CoreDNS health, effective NSG association and rules, and both path endpoints without claiming they ran; leaves a narrowly scoped NSG correction for network-owner review; does not mutate the NSG, restart CoreDNS, create a test pod, or start packet capture; and marks the diagnosis unconfirmed with a network-owner handoff when decisive evidence is missing, inaccessible, or contradictory."
    graders:
      - type: skill-invocation
        config:
          required:
            - aks-troubleshooting
          disallowed:
            - azure-diagnostics
            - aks-network-capture
      - type: prompt
        config:
          scoring: binary
          threshold: 1
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  - name: "DNS NSG canary: non-Azure Kubernetes near miss"
    prompt: "Pods in a self-managed Kubernetes cluster outside Azure and AKS cannot resolve names between node pools. UDP 53 is denied while TCP 443 is allowed."
    tags:
      type: integration
      tier: full
      cost: llm
      area: negative-routing
      case_id: public-canary-dns-nsg-udp53
      source_url: "https://learn.microsoft.com/troubleshoot/azure/azure-kubernetes/connectivity/traffic-between-node-pools-is-blocked"
      requiredSkills:
        - aks-troubleshooting
    graders:
      - type: skill-invocation
        config:
          disallowed:
            - aks-troubleshooting
            - aks-network-capture
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  - name: "Route out: AKS cluster creation"
    prompt: "Create and provision a new production AKS cluster with a system node pool. This is not troubleshooting an existing incident."
    tags:
      type: integration
      tier: full
      cost: llm
      area: negative-routing
      requiredSkills:
        - aks-troubleshooting
        - azure-kubernetes
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-kubernetes
          disallowed:
            - aks-troubleshooting
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  - name: "Route out: AKS cost and rightsizing"
    prompt: "Analyze the monthly cost of my healthy AKS clusters and recommend node-pool rightsizing opportunities. There is no active incident."
    tags:
      type: integration
      tier: full
      cost: llm
      area: negative-routing
      requiredSkills:
        - aks-troubleshooting
        - azure-cost
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-cost
          disallowed:
            - aks-troubleshooting
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  - name: "Evidence order: supplied CrashLoopBackOff evidence starts locally"
    prompt: |
      Diagnose without running commands. Pod api-7d9 in namespace checkout is
      in CrashLoopBackOff. Its supplied last state is Terminated reason=Error,
      exitCode=1, and previous logs end with "missing PAYMENT_ENDPOINT". We do
      not have Log Analytics or Container insights. State the next evidence
      reads in order and what remains uncertain.
    tags:
      type: integration
      tier: full
      cost: llm
      area: evidence-order
      source_url: "https://learn.microsoft.com/troubleshoot/azure/azure-kubernetes/create-upgrade-delete/pod-stuck-crashloopbackoff-mode"
      requiredSkills:
        - aks-troubleshooting
        - azure-diagnostics
    rubric:
      - "The response starts with target-bound pod status, describe/events, termination details, and current/previous logs for api-7d9 in checkout; uses the supplied missing PAYMENT_ENDPOINT log as application/configuration evidence; does not require an Azure, Resource Health, Log Analytics, or Container insights sweep before those workload reads; records unavailable monitoring evidence as unknown and expands to node or Azure evidence only if the pod branch requires it; claims no checks ran and proposes no mutation."
    graders:
      - type: skill-invocation
        config:
          required: [aks-troubleshooting]
          disallowed: [azure-diagnostics]
      - type: prompt
        config:
          scoring: binary
          threshold: 1
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  - name: "Evidence order: failed upgrade starts from Azure operation"
    prompt: |
      Diagnose without running commands or retrying. An existing AKS cluster
      upgrade operation failed and the cluster provisioningState is Failed. No
      exact nested catalog signature was supplied. State the first evidence to
      retrieve and the later Kubernetes branch.
    tags:
      type: integration
      tier: full
      cost: llm
      area: evidence-order
      requiredSkills:
        - aks-troubleshooting
        - aks-known-issues
    rubric:
      - "The response starts with the target-bound failed Azure upgrade operation, exact error, cluster and node-pool state, versions, and supported upgrade path; then branches to deprecated APIs, admission webhooks, PDB/drain blockers, node and event evidence as applicable; does not invoke the exact-signature catalog without the missing nested signature; claims no reads ran and requires approval before retrying or changing the cluster."
    graders:
      - type: skill-invocation
        config:
          required: [aks-troubleshooting]
          disallowed: [aks-known-issues]
      - type: prompt
        config:
          scoring: binary
          threshold: 1

  - name: "DNS: LocalDNS-enabled pool has UDP-only failures"
    prompt: |
      Diagnose without running commands or changing DNS. DNS fails only for
      pods on AKS node pool user-a, where LocalDNS is enabled. TCP queries work,
      UDP queries fail, and pods on user-b resolve normally. State the
      read-only branch and mutation boundary.
    tags:
      type: integration
      tier: full
      cost: llm
      area: dns-local
      source_url: "https://learn.microsoft.com/troubleshoot/azure/azure-kubernetes/connectivity/dns/troubleshoot-localdns"
      requiredSkills:
        - aks-troubleshooting
    rubric:
      - "The response branches to the LocalDNS path for affected pool user-a; scopes pool, node, protocol, and DNS-zone behavior; inspects the affected pod resolver, LocalDNS forwarding configuration/service/logs, and UDP path before CoreDNS; does not restart or blame CoreDNS from the symptom alone; states that query logging needs approval and has cost; warns that a node-pool LocalDNS configuration update can reimage nodes; claims no reads ran and performs no mutation."
    graders:
      - type: skill-invocation
        config:
          required: [aks-troubleshooting]
      - type: prompt
        config:
          scoring: binary
          threshold: 1

  - name: "API: webhook timeout with no ready endpoints"
    prompt: |
      Diagnose without running commands or changing resources. Creating a
      Deployment returns "failed calling webhook" with HTTP 504. Supplied
      evidence shows the named webhook Service has zero endpoints. Its
      failurePolicy and selector were not supplied.
    tags:
      type: integration
      tier: full
      cost: llm
      area: api-webhook
      source_url: "https://learn.microsoft.com/azure/architecture/operator-guides/aks/aks-triage-controllers"
      requiredSkills:
        - aks-troubleshooting
    rubric:
      - "The response reads the named validating or mutating webhook configuration, failurePolicy, timeoutSeconds, namespaceSelector, Service, EndpointSlice/endpoints, and backing pods; uses zero endpoints as backend evidence but does not infer the full blast radius without failurePolicy and selector; never deletes, patches, or weakens the webhook from the error string; claims no reads ran and requires owner approval for remediation."
    graders:
      - type: skill-invocation
        config:
          required: [aks-troubleshooting]
      - type: prompt
        config:
          scoring: binary
          threshold: 1

  - name: "API: node-dependent logs timeout uses tunnel branch"
    prompt: |
      Diagnose without running commands or changing nodes. kubectl logs and
      exec time out only for pods scheduled on nodes node-a and node-b; the same
      commands work on other nodes and ordinary API list calls succeed. The
      error references port 10250.
    tags:
      type: integration
      tier: full
      cost: llm
      area: api-tunnel
      source_url: "https://learn.microsoft.com/troubleshoot/azure/azure-kubernetes/connectivity/tunnel-connectivity-issues"
      requiredSkills:
        - aks-troubleshooting
        - aks-network-capture
    rubric:
      - "The response identifies a node-placement-dependent API-server-to-kubelet tunnel or port-10250 branch rather than general pod networking; proposes read-only checks of pod placement, affected node conditions, konnectivity-agent state, and the relevant NSG/firewall/UDR path; does not start packet capture or change node firewall/iptables state; marks service-side causes for escalation with target and incident evidence; claims no reads ran."
    graders:
      - type: skill-invocation
        config:
          required: [aks-troubleshooting]
          disallowed: [aks-network-capture]
      - type: prompt
        config:
          scoring: binary
          threshold: 1
