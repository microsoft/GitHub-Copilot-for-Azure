name: azure-diagnostics-queue-trigger-targeted-eval
description: |
  Targeted improvement-only evaluation for measuring queue poison-message
  diagnosis stability across repeated Skill-only and Skill+MCP runs.

tags:
  type: integration
  skill: azure-diagnostics

defaults:
  runs: 5
  timeout: "10m"
  executor: copilot-sdk-agent-runner
  model: gpt-5.6-sol
  judge_model: claude-opus-4.8

scoring:
  threshold: 0.8

stimuli:
  - name: "Queue trigger poison message diagnosis"
    prompt: "My Azure Function queue trigger keeps moving messages to the poison queue after 5 dequeue attempts. How do I diagnose why the messages are failing?"
    rubric:
      - The response explains that poison-queue movement occurs after repeated failed processing attempts governed by maxDequeueCount and treats it as a symptom of an underlying invocation, binding, payload, or application failure.
      - Diagnosis examines Function invocation logs and exceptions, the original and poison messages, dequeue metadata, binding configuration, and payload compatibility before recommending configuration changes.
      - Remediation fixes the underlying processing failure and uses bounded, idempotent replay after validation; it does not merely increase maxDequeueCount, delete poison messages, or replay them blindly.
      - Verification processes a representative failed message successfully, confirms dequeue counts stop increasing, checks that the poison queue no longer grows for the corrected cause, and monitors for duplicate side effects.
    tags:
      type: integration
      tier: full
      cost: llm
      area: response-quality
      requiredSkills:
        - azure-diagnostics
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-diagnostics
      - type: output-matches
        config:
          pattern: "(?i)maxDequeueCount|dequeue count|poison queue"
      - type: prompt
        config:
          scoring: scale_1_5
          threshold: 0.7
      - type: completed
      - type: output-not-matches
        config:
          pattern: "(?im)^(?:fatal error|unhandled exception)(?:\\s|:)"
