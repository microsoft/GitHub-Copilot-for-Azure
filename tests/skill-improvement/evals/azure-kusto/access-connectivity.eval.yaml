name: azure-kusto-access-connectivity
description: Synthetic restricted-telemetry-aligned scenarios for Azure Data Explorer access and connectivity.
tags:
  type: integration
  skill: azure-kusto
defaults:
  runs: 1
  timeout: "10m"
  executor: copilot-sdk-agent-runner
  model: claude-sonnet-5
  judge_model: claude-sonnet-5
scoring:
  threshold: 0.7
stimuli:
  - name: "Diagnose forbidden database queries"
    prompt: "I can see my ADX cluster, but queries against the database return Forbidden. Help me identify which access and connection checks to make."
    rubric:
      - The response explains that seeing the Azure resource does not prove the active identity has Kusto database query permission.
      - The response gives an evidence-first sequence that verifies the active identity and tenant, cluster URI and database name, network reachability, and effective Kusto database principal permissions.
      - The response distinguishes authentication, network, and database authorization failures and does not claim which one occurred without diagnostic evidence.
    tags: &tags
      type: integration
      tier: full
      cost: llm
      area: response-quality
    graders: &graders
      - type: prompt
        config:
          scoring: scale_1_5
          threshold: 0.7
      - type: completed
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"
  - name: "Diagnose environment-specific cluster connection"
    prompt: "My Kusto cluster URL works in the portal but not from this environment. Help me verify the URI, authentication, network access, and database permissions without changing anything."
    rubric:
      - The response verifies the exact cluster URI used in the failing environment, including host spelling and expected Azure cloud suffix, rather than assuming the portal URL is reused correctly.
      - The response proposes read-only checks for the environment's active identity or token context, tenant, DNS or network path, and Kusto database permission.
      - The response orders checks to isolate URI, authentication, network, and authorization causes and avoids proposing configuration or permission changes as part of diagnosis.
    tags: *tags
    graders: *graders
