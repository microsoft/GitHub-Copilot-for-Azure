name: azure-kusto-discover-cluster-database
description: Ten matched scenarios for discovering Azure Data Explorer clusters and databases.
tags:
  type: integration
  skill: azure-kusto
defaults:
  runs: 1
  timeout: "10m"
  executor: integration-test-agent-runner
  model: claude-sonnet-5
  judge_model: claude-sonnet-5
scoring:
  threshold: 0.7
stimuli:
  - name: "Discover all accessible ADX clusters"
    prompt: "I need to find every Azure Data Explorer cluster I can access in my current subscription. Explain the read-only steps and the Azure Kusto MCP tool you would use."
    rubric:
      - The response identifies the active subscription as required context and uses `kusto_cluster_list` or the equivalent read-only Azure Kusto MCP cluster-list operation.
      - The workflow covers all clusters visible in that subscription and explains that visibility is limited by the active identity's access.
      - The response describes an actionable tool call without claiming that clusters were found when no live tool results are supplied.
    tags: &tags
      type: integration
      tier: full
      cost: llm
      area: response-quality
    graders: &graders
      - type: prompt
        config:
          scoring: scale_1_5
          threshold: 0.7
      - type: completed
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"
  - name: "Find databases in a named cluster"
    prompt: "List the databases in my ADX cluster telemetry-prod after I provide my subscription. Tell me which Kusto MCP operation should be called and what inputs it needs."
    rubric:
      - The response identifies `kusto_database_list` or the equivalent database-list operation as the operation that returns databases for a cluster.
      - The response states that subscription, resource group, and cluster name are required and obtains the resource group through cluster discovery if it was not supplied.
      - The response uses `telemetry-prod` only as the supplied cluster name and does not fabricate database results.
    tags: *tags
    graders: *graders
  - name: "Locate a cluster without its resource group"
    prompt: "I know my Azure Data Explorer cluster is named salesadx but I do not know its resource group. How should you locate it before listing its databases?"
    rubric:
      - The response first lists or searches accessible clusters in the relevant subscription and matches the exact cluster name `salesadx` to recover its resource group.
      - The response then uses the discovered subscription, resource group, and cluster identifiers to list databases.
      - The response handles zero or multiple matching clusters explicitly and does not guess the resource group.
    tags: *tags
    graders: *graders
  - name: "Enumerate clusters across subscriptions"
    prompt: "I have access to several Azure subscriptions and need to identify which one contains an ADX cluster named securitylogs. Give me an efficient read-only discovery workflow."
    rubric:
      - The response enumerates the subscriptions available to the active identity and runs read-only cluster discovery within each relevant subscription.
      - The workflow filters exact or clearly identified cluster names for `securitylogs` and records the matching subscription and resource group.
      - The response avoids switching persistent context unnecessarily or claiming a match without tool evidence.
    tags: *tags
    graders: *graders
  - name: "Resolve a cluster URI to a resource"
    prompt: "The only detail I have is https://operations.eastus.kusto.windows.net. Help me identify the corresponding ADX cluster and then discover its databases without guessing."
    rubric:
      - The response parses the supplied URI as a clue but verifies it against discovered Azure Data Explorer cluster endpoints rather than treating the hostname as sufficient proof.
      - The workflow searches accessible subscriptions or a requested scope, identifies the matching cluster resource and resource group, and then lists its databases.
      - The response accounts for endpoint aliases or no match and does not invent subscription, resource group, or database names.
    tags: *tags
    graders: *graders
  - name: "Find a development Kusto database"
    prompt: "Find the Azure Data Explorer database used for development in a cluster called appinsights-dev. Describe the tool sequence and how you would identify the likely database."
    rubric:
      - The response discovers the `appinsights-dev` cluster and its resource group before listing databases with the appropriate read-only Kusto MCP operation.
      - The response treats development naming as a candidate signal and explains how to verify the intended database from metadata or user confirmation.
      - The response does not claim that a particular database is the development database without discovery evidence.
    tags: *tags
    graders: *graders
  - name: "Confirm database existence"
    prompt: "Before I run any KQL, confirm whether database Customer360 exists in cluster analytics-west. Which Kusto discovery call should happen first and why?"
    rubric:
      - The response explains that the cluster must first be resolved to its subscription and resource group when those identifiers are not already known.
      - After cluster resolution, the response lists databases for `analytics-west` and checks for an exact `Customer360` match before any query execution.
      - The response distinguishes this planned workflow from an actual existence result when no live tools have been run.
    tags: *tags
    graders: *graders
  - name: "Discover regional ADX clusters"
    prompt: "I need an inventory of Azure Data Explorer clusters in westus3 for a migration assessment. Explain how to discover and filter them using read-only Azure operations."
    rubric:
      - The response lists ADX clusters in the specified subscription scope using read-only Azure or Kusto discovery operations.
      - The workflow filters the returned resource metadata by the `westus3` location and retains identifiers needed for the migration inventory.
      - The response requests clarification if multiple subscriptions are in scope and does not invent regional resources.
    tags: *tags
    graders: *graders
  - name: "Diagnose an ambiguous cluster name"
    prompt: "Two teams both refer to their ADX environment as prod-kusto. Show how you would discover the exact subscription, resource group, cluster, and database before querying."
    rubric:
      - The response searches accessible subscriptions for candidate clusters and records each candidate's exact subscription, resource group, resource name, and endpoint.
      - The response lists databases only after a candidate cluster is resolved and uses database or ownership context to disambiguate the teams' environments.
      - The response requires evidence or user selection before querying and does not choose a candidate from the nickname alone.
    tags: *tags
    graders: *graders
  - name: "Inventory cluster databases"
    prompt: "Create a read-only inventory plan that lists each ADX cluster in one subscription and the databases under each cluster. Map every step to the relevant Kusto MCP tool."
    rubric:
      - The plan calls `kusto_cluster_list` or the equivalent once for the target subscription to enumerate clusters and their resource groups.
      - For each discovered cluster, the plan calls `kusto_database_list` or the equivalent with the discovered subscription, resource group, and cluster name.
      - The response defines a useful inventory output linking every database to its cluster and keeps all operations read-only without claiming live results.
    tags: *tags
    graders: *graders
