name: azure-kusto-improvement

target:
  plugin: azure-skills
  skill: azure-kusto
  baselineRef: main
  editablePaths:
    - plugins/azure-skills/skills/azure-kusto/**

evaluations:
  root: tests/skill-improvement/evals/azure-kusto
  development:
    - analyze-logs-telemetry.eval.yaml
  heldOut: []

models:
  answers:
    - gpt-5.6-sol
  judges:
    - claude-opus-4.8

experiment:
  repetitions: 1
  conditions:
    - name: Agent only
      skill: disabled
      mcp: disabled
    - name: Skill only
      skill: enabled
      mcp: disabled
    - name: MCP only
      skill: disabled
      mcp: enabled
    - name: Skill + MCP
      skill: enabled
      mcp: enabled

improvementAgent:
  enabled: true
  model: claude-sonnet-5

acceptance:
  minimumQualityImprovementPoints: 2
  maximumEvalRegressionPoints: 5
  maximumModelRegressionPoints: 5
  minimumSkillInvocationRate: 0.8
  requireHeldOutImprovement: false

limits:
  maxIterations: 2
  maxAnswerGenerations: 700
  maxJudgeCalls: 700
  maxDurationMinutes: 360
  maxConcurrentJobs: 5
  maxSkillTokenIncreasePercent: 15

output:
  issue: never
  draftPullRequest: accepted-candidate-only
