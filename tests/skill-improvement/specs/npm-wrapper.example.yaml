# Illustrative custom evaluator configuration. The named npm scripts must be
# supplied by the repository that uses this specification.
name: npm-wrapper-example

target:
  plugin: azure-skills
  skill: azure-kusto
  baselineRef: main

evaluations:
  root: tests/skill-improvement/evals/azure-kusto
  development:
    - access-connectivity.eval.yaml
  heldOut: []

models:
  answers:
    - gpt-5.6-sol
  judges:
    - gpt-5.6-sol

evaluator:
  kind: command
  generate:
    executable: npm
    args:
      - run
      - test:vally
      - "--"
      - --suite
      - foundry-e2e
      - --model
      - "{answerModel}"
      - --runs
      - "{repetitions}"
      - --skip-grade
      - --output
      - jsonl
      - --output-dir
      - "{generationDirectory}"
    workingDirectory: .
    environment:
      VALLY_RUNS: "{repetitions}"
  grade:
    executable: npm
    args:
      - run
      - test:vally:grade
      - "--"
      - --suite
      - foundry-e2e
      - --judge-model
      - "{judgeModel}"
      - --run-dir
      - "{runDirectory}"
      - --output
      - jsonl
    workingDirectory: .
  output:
    format: vally-jsonl
    generationStdout: trajectories
    gradingStdin: trajectories
    gradingStdout: graded-trajectories
    runDirectoryMarker: eval-results.md

experiment:
  repetitions: 1
  conditions:
    - name: skill-with-mcp
      skill: enabled
      mcp: enabled
    - name: no-skill-with-mcp
      skill: disabled
      mcp: enabled

improvementAgent:
  enabled: false
  model: claude-sonnet-5

acceptance:
  minimumQualityImprovementPoints: 0
  maximumEvalRegressionPoints: 0
  maximumModelRegressionPoints: 0
  requireHeldOutImprovement: false

limits:
  maxIterations: 0
  maxAnswerGenerations: 100
  maxJudgeCalls: 100
  maxDurationMinutes: 60
  maxConcurrentJobs: 2
  maxSkillTokenIncreasePercent: 15

output:
  issue: never
  draftPullRequest: never
