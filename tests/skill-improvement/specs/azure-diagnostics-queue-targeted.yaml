name: azure-diagnostics-queue-targeted-improvement

target:
  plugin: azure-skills
  skill: azure-diagnostics
  baselineRef: main
  editablePaths:
    - plugins/azure-skills/skills/azure-diagnostics/**

evaluations:
  root: tests/skill-improvement/evals/azure-diagnostics-queue-targeted
  development:
    - queue-trigger.eval.yaml
  heldOut: []

models:
  answers:
    - gpt-5.6-sol
  judges:
    - claude-sonnet-5

experiment:
  repetitions: 5
  conditions:
    - name: Skill only
      skill: enabled
      mcp: disabled
    - name: Skill + MCP
      skill: enabled
      mcp: enabled

improvementAgent:
  enabled: true
  model: claude-sonnet-5

acceptance:
  minimumQualityImprovementPoints: 0
  maximumEvalRegressionPoints: 0
  maximumModelRegressionPoints: 0
  minimumSkillInvocationRate: 0.8
  requireHeldOutImprovement: false

refinement:
  minimumScoreImprovementPoints: 1
  maximumQualityRegressionPoints: 0

limits:
  maxIterations: 2
  maxAnswerGenerations: 40
  maxJudgeCalls: 40
  maxDurationMinutes: 180
  maxConcurrentJobs: 2
  maxSkillTokenIncreasePercent: 15

output:
  issue: never
  draftPullRequest: accepted-candidate-only
