name: azure-diagnostics-improvement

target:
  plugin: azure-skills
  skill: azure-diagnostics
  baselineRef: main
  editablePaths:
    - plugins/azure-skills/skills/azure-diagnostics/**

evaluations:
  root: evals/azure-skills/azure-diagnostics
  development:
    - eval.yaml
    - fixture-evidence.eval.yaml
    - functions-troubleshooting.eval.yaml
    - response-quality.eval.yaml
    - script-invocation.eval.yaml
  heldOut:
    - held-out.eval.yaml

models:
  answers:
    - gpt-6.1-sol
  judges:
    - claude-opus-4.8

experiment:
  repetitions: 1
  conditions:
    - name: Agent only
      skill: disabled
      mcp: disabled
    - name: Skill only
      skill: enabled
      mcp: disabled
    - name: Skill + MCP
      skill: enabled
      mcp: enabled
    - name: MCP only
      skill: disabled
      mcp: enabled

improvementAgent:
  enabled: false
  model: claude-sonnet-5

acceptance:
  minimumQualityImprovementPoints: 2
  maximumEvalRegressionPoints: 15
  maximumModelRegressionPoints: 5
  minimumSkillInvocationRate: 0.8

heldOutAcceptance:
  enabled: false
  minimumQualityImprovementPoints: 0
  maximumEvalRegressionPoints: 0
  maximumModelRegressionPoints: 0

refinement:
  minimumScoreImprovementPoints: 1
  maximumQualityRegressionPoints: 0

limits:
  maxIterations: 0
  maxAnswerGenerations: 144
  maxJudgeCalls: 144
  maxDurationMinutes: 360
  maxConcurrentVallyProcesses: 5
  generationWorkersPerVallyProcess: 1
  maxSkillTokenIncreasePercent: 15

output:
  issue: never
  draftPullRequest: never
