name: azure-diagnostics-functions-vnet-baseline

target:
  plugin: azure-skills
  skill: azure-diagnostics
  baselineRef: kaghiya/diagnostics-functions-vnet-live-evals
  editablePaths:
    - plugins/azure-skills/skills/azure-diagnostics/**

evaluations:
  root: evals/azure-skills/azure-diagnostics
  development:
    - functions-vnet-routing-comparative.eval.yaml

models:
  answers:
    - gpt-5.6-sol
  judges:
    - claude-sonnet-5

experiment:
  repetitions: 2
  conditions:
    - name: Agent only
      skill: disabled
      mcp: disabled
    - name: MCP only
      skill: disabled
      mcp: enabled
    - name: Skill only
      skill: enabled
      mcp: disabled
    - name: Skill + MCP
      skill: enabled
      mcp: enabled

improvementAgent:
  enabled: false
  model: claude-sonnet-5

acceptance:
  minimumQualityImprovementPoints: 0
  maximumEvalRegressionPoints: 0
  maximumModelRegressionPoints: 0
  minimumSkillInvocationRate: 0.8

heldOutAcceptance:
  enabled: false
  minimumQualityImprovementPoints: 0
  maximumEvalRegressionPoints: 0
  maximumModelRegressionPoints: 0

refinement:
  minimumScoreImprovementPoints: 0
  maximumQualityRegressionPoints: 0

limits:
  maxIterations: 0
  maxAnswerGenerations: 32
  maxJudgeCalls: 32
  maxDurationMinutes: 180
  maxConcurrentVallyProcesses: 4
  generationWorkersPerVallyProcess: 1
  maxSkillTokenIncreasePercent: 0

output:
  issue: never
  draftPullRequest: never
