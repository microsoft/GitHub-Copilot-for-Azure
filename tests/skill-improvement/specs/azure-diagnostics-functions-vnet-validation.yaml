name: azure-diagnostics-functions-vnet-validation

target:
  plugin: azure-skills
  skill: azure-diagnostics
  baselineRef: main
  editablePaths:
    - plugins/azure-skills/skills/azure-diagnostics/**

evaluations:
  root: evals/azure-skills/azure-diagnostics
  development:
    - functions-vnet-routing.eval.yaml

models:
  answers:
    - gpt-5.6-sol
  judges:
    - claude-sonnet-5

experiment:
  repetitions: 2
  conditions:
    - name: Agent only
      skill: disabled
      mcp: disabled
    - name: MCP only
      skill: disabled
      mcp: enabled
    - name: Skill only
      skill: enabled
      mcp: disabled
    - name: Skill + MCP
      skill: enabled
      mcp: enabled

improvementAgent:
  enabled: true
  model: claude-sonnet-5

acceptance:
  minimumQualityImprovementPoints: 0
  maximumEvalRegressionPoints: 0
  maximumModelRegressionPoints: 0
  minimumSkillInvocationRate: 0.8

heldOutAcceptance:
  enabled: false
  minimumQualityImprovementPoints: 0
  maximumEvalRegressionPoints: 0
  maximumModelRegressionPoints: 0

refinement:
  minimumScoreImprovementPoints: 0
  maximumQualityRegressionPoints: 0

limits:
  maxIterations: 3
  maxAnswerGenerations: 40
  maxJudgeCalls: 40
  maxDurationMinutes: 300
  maxConcurrentVallyProcesses: 2
  generationWorkersPerVallyProcess: 1
  maxSkillTokenIncreasePercent: 15

output:
  issue: never
  draftPullRequest: accepted-candidate-only
