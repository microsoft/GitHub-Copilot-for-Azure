name: Run permission-isolated integration tests
description: Run matching stimuli with isolated Azure identities and transfer reports through private stage storage.
inputs:
  skill:
    required: true
    description: Plugin/skill reference
  permission:
    required: true
    description: Azure permission (read, write, admin, none, or empty for admin-backed untagged tests)
  model-override:
    default: ""
    description: Model override
  no-skills:
    default: "false"
    description: Disable skill loading
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: tests/package-lock.json
    - name: Install dependencies
      shell: bash
      working-directory: tests
      run: npm ci
    - name: Install azd
      uses: Azure/setup-azd@0b7e3a35ab00f2eee7080c845eb39c3f0ebfa553 # v2
    - name: Authenticate isolated profiles
      uses: ./.github/actions/azure-profiles
      with:
        permission: ${{ inputs.permission == '' && 'admin' || inputs.permission }}
        refresh: "true"
    - name: Build plugin output
      shell: bash
      run: |
        npm ci --ignore-scripts
        npm run build
    - name: Setup Copilot CLI
      uses: mvkaran/setup-copilot-cli@d05a47209e6b3185c9c55702bef49f28e6eebef7 # v1
      with:
        token: ${{ github.token }}
    - name: Run matching integration tests
      id: tests
      shell: bash
      working-directory: tests
      env:
        SKILL: ${{ inputs.skill }}
        TEST_PERMISSION: ${{ inputs.permission }}
        TEST_AZURE_PERMISSION: ${{ inputs.permission }}
        NO_SKILLS: ${{ inputs.no-skills == 'true' && 'true' || '' }}
        MODEL_OVERRIDE: ${{ inputs.model-override }}
      run: |
        case "$TEST_AZURE_PERMISSION" in
          read) tag_args=(--tag azurePermission=read) ;;
          write) tag_args=(--tag azurePermission=write) ;;
          admin) tag_args=(--tag azurePermission=admin) ;;
          none) tag_args=(--tag azurePermission=none) ;;
          "") tag_args=(--tag 'azurePermission!=read' --tag 'azurePermission!=write' --tag 'azurePermission!=admin' --tag 'azurePermission!=none') ;;
          *) echo "::error::Unsupported Azure permission: $TEST_AZURE_PERMISSION"; exit 1 ;;
        esac
        npm run test:vally -- --plugin "${SKILL%%/*}" --skill "${SKILL##*/}" --workers 2 "${tag_args[@]}"
    - name: Record test execution status
      if: always()
      shell: bash
      working-directory: tests
      env:
        TEST_PERMISSION: ${{ inputs.permission }}
        TEST_OUTCOME: ${{ steps.tests.outcome }}
      run: |
        node --input-type=module - <<'JS'
        import { writeFileSync } from "node:fs";
        writeFileSync("permission-run.json", JSON.stringify({
          permission: process.env.TEST_PERMISSION,
          outcome: process.env.TEST_OUTCOME,
        }));
        JS
    - name: Upload private reports
      if: always()
      shell: bash
      working-directory: tests
      env:
        SKILL: ${{ inputs.skill }}
        REPORT_GROUP: ${{ inputs.permission == '' && 'default' || inputs.permission }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: npx tsx report-storage.ts upload
    - name: Stop profile refresh
      if: always()
      uses: ./.github/actions/stop-azure-profiles
