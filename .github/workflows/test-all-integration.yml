# Test all skills.
#
# Runs all integration tests.
# Triggered manually or on schedule.

name: Integration Tests - all

permissions:
  id-token: write
  contents: read
  copilot-requests: write

on:
  schedule:
    # Nightly job to run all the integration tests, except weekends in PST.
    # 9:00 PM PST Mon-Fri (5:00 AM UTC Tue-Sat)
    - cron: "0 5 * * 2-6"
    # 12:00 AM PST Tue-Sat (8:00 AM UTC Tue-Sat)
    - cron: "0 8 * * 2-6"
    # 4:00 AM PST Tue-Sat (12:00 PM UTC Tue-Sat)
    - cron: "0 12 * * 2-6"
  workflow_dispatch:
    inputs:
      skills:
        description: 'Comma separated list of skills to test (e.g. "azure-skills/appinsights-instrumentation,azure-skills/azure-ai"). Each string must be in the form of "<plugin-dirname>/<skill-name>".'
        required: true
        type: string
      model-override:
        description: "Model to use for testing"
        required: false
        type: string
        default: claude-sonnet-5
      no-skills:
        description: "Optional: whether to override the run to load no skills"
        required: false
        type: boolean
        default: false
      skill-test-pattern:
        description: "Optional: pattern by name or describe block for filtering skill tests. This parameter does not apply to azure-deploy tests"
        required: false
        type: string
        default: ""
      deploy-test-pattern:
        description: "Optional: Comma separated patterns by name or describe block for filtering azure-deploy tests."
        required: false
        type: string
        default: ""

jobs:
  resolve-inputs:
    name: Resolve workflow inputs
    runs-on: ubuntu-latest
    if: github.repository == 'microsoft/GitHub-Copilot-for-Azure'
    outputs:
      skills: ${{ steps.resolve.outputs.skills }}
      deploy-test-pattern: ${{ steps.resolve.outputs.deploy-test-pattern }}
    steps:
      - name: Checkout repository
        if: github.event_name == 'schedule'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Resolve inputs based on trigger type
        id: resolve
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        env:
          INPUT_SKILLS: ${{ inputs.skills }}
          INPUT_DEPLOY_TEST_PATTERN: ${{ inputs.deploy-test-pattern }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        with:
          script: |
            const eventName = context.eventName;

            if (eventName === "workflow_dispatch") {
              // Manual trigger - use provided inputs
              core.setOutput("skills", process.env.INPUT_SKILLS);
              core.setOutput("deploy-test-pattern", process.env.INPUT_DEPLOY_TEST_PATTERN);
            } else {
              // Scheduled trigger - read from tests/skills.json
              const cron = process.env.EVENT_SCHEDULE;
              core.info(`Schedule: ${cron}`);

              const fs = require("fs");
              const skillsJson = JSON.parse(fs.readFileSync("tests/skills.json", "utf8"));

              // Collect skills from all plugins for this cron schedule
              const skillsList = skillsJson.plugins
                .map(plugin => {
                  const entry = plugin.integrationTestSchedule?.[cron];
                  return entry ? entry.split(",").map(s => `${plugin.dirname}/${s.trim()}`) : [];
                })
                .flat();

              if (skillsList.length === 0) {
                core.setFailed(`No skills specified for schedule: ${cron}`);
                return;
              }

              const skills = skillsList.join(",");
              core.info(`Skills from schedule config: ${skills}`);
              core.setOutput("skills", skills);
            }

  setup:
    name: Build skill matrix
    needs: resolve-inputs
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_azure_deploy: ${{ steps.set-matrix.outputs.has_azure_deploy }}
      read-matrix: ${{ steps.azure-permissions.outputs.read-matrix }}
      none-matrix: ${{ steps.azure-permissions.outputs.none-matrix }}
      default-matrix: ${{ steps.azure-permissions.outputs.default-matrix }}
      report-matrix: ${{ steps.azure-permissions.outputs.report-matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: tests

      - name: Parse skills input into matrix
        id: set-matrix
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        env:
          SKILLS_INPUT: ${{ needs.resolve-inputs.outputs.skills }}
        with:
          script: |
            // Convert comma separated list of skills to a JSON array
            // Each item is in the form of "<plugin-dirname>/<skill-name>"
            // Filter out azure-deploy (it runs via a separate reusable workflow)
            const skillsInput = process.env.SKILLS_INPUT || "";
            const skills = skillsInput.split(",").map(s => s.trim());

            // Check if azure-deploy is in the list
            const hasAzureDeploy = skills.includes("azure-skills/azure-deploy");
            core.setOutput("has_azure_deploy", hasAzureDeploy.toString());

            // Build matrix excluding azure-deploy
            const matrix = skills.filter(s => s !== "azure-skills/azure-deploy");
            core.setOutput("matrix", JSON.stringify(matrix));

      - name: Discover required Azure permissions
        id: azure-permissions
        working-directory: tests
        env:
          SKILLS_INPUT: ${{ needs.resolve-inputs.outputs.skills }}
        run: npx tsx discover-azure-permissions.ts

  # Call the azure-deploy workflow when azure-deploy is in the skills list
  azure-deploy:
    name: Integration – azure-deploy
    needs: [resolve-inputs, setup]
    if: needs.setup.outputs.has_azure_deploy == 'true'
    uses: ./.github/workflows/test-azure-deploy.yml
    with:
      model-override: ${{ inputs.model-override }}
      test-pattern: ${{ needs.resolve-inputs.outputs.deploy-test-pattern }}
      no-skills: ${{ inputs.no-skills || false }}

  test-read:
    name: Integration read – ${{ matrix.skill }}
    needs: setup
    if: needs.setup.outputs.read-matrix != '[]'
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        skill: ${{ fromJson(needs.setup.outputs.read-matrix) }}
    uses: ./.github/workflows/test-integration-read.yml
    with:
      skill: ${{ matrix.skill }}
      model-override: ${{ inputs.model-override || '' }}
      no-skills: ${{ inputs.no-skills || false }}

  test-none:
    name: Integration none – ${{ matrix.skill }}
    needs: setup
    if: needs.setup.outputs.none-matrix != '[]'
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        skill: ${{ fromJson(needs.setup.outputs.none-matrix) }}
    uses: ./.github/workflows/test-integration-none.yml
    with:
      skill: ${{ matrix.skill }}
      model-override: ${{ inputs.model-override || '' }}
      no-skills: ${{ inputs.no-skills || false }}

  test-default:
    name: Integration default – ${{ matrix.skill }}
    needs: setup
    if: needs.setup.outputs.default-matrix != '[]'
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        skill: ${{ fromJson(needs.setup.outputs.default-matrix) }}
    uses: ./.github/workflows/test-integration-default.yml
    with:
      skill: ${{ matrix.skill }}
      model-override: ${{ inputs.model-override || '' }}
      no-skills: ${{ inputs.no-skills || false }}

  report:
    name: Aggregate and report – ${{ matrix.skill }}
    needs: [setup, test-read, test-none, test-default]
    if: always() && !cancelled() && needs.setup.result == 'success' && needs.setup.outputs.report-matrix != '[]'
    environment: cideploytest
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include: ${{ fromJson(needs.setup.outputs.report-matrix) }}

    defaults:
      run:
        working-directory: tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: tests/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build plugin output
        run: |
          cd ..
          npm ci --ignore-scripts
          npm run build

      # github.token(aka. GITHUB_TOKEN) is granted permission to make CAPI requests by having the copilot-requests permission
      - name: Setup Copilot CLI
        id: setup-copilot-cli
        uses: mvkaran/setup-copilot-cli@d05a47209e6b3185c9c55702bef49f28e6eebef7 # v1
        with:
          token: ${{ github.token }}

      - name: Resolve artifact key
        id: artifact-key
        env:
          SKILL: ${{ matrix.skill }}
        run: |
          echo "key=${SKILL%%/*}__${SKILL##*/}" >> "$GITHUB_OUTPUT"

      - name: Download permission results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: integration-${{ steps.artifact-key.outputs.key }}-*-${{ github.run_attempt }}
          path: tests/permission-artifacts

      - name: Aggregate reports
        id: aggregate
        continue-on-error: true
        env:
          SKILL: ${{ matrix.skill }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_PERMISSIONS: ${{ toJson(matrix.permissions) }}
        run: npx tsx aggregate-permission-results.ts

      - name: Generate skill report
        if: always() && steps.aggregate.outputs.has-results == 'true'
        id: generate-skill-report
        env:
          SKILL: ${{ matrix.skill }}
        run: |
          SKILL_NAME="${SKILL##*/}"
          npm run report -- --skill "$SKILL_NAME"

      - name: Show skill report
        if: always() && steps.aggregate.outputs.has-results == 'true'
        id: show-skill-report
        run: |
          SKILL_REPORT=$(find reports -name "*-SKILL-REPORT.md" -type f | head -n 1)
          if [ -n "$SKILL_REPORT" ]; then
            echo "Found skill report: $SKILL_REPORT"
            cat "$SKILL_REPORT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No skill report found"
          fi

      - name: Show aggregation completeness
        if: always()
        run: |
          if [ -f reports/test-run-all-integration/aggregation.json ]; then
            echo '### Permission result aggregation' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat reports/test-run-all-integration/aggregation.json >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload aggregated reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aggregated-${{ steps.artifact-key.outputs.key }}-${{ github.run_attempt }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            tests/reports/test-run-all-integration/

      - name: Azure login for publishing
        if: always() && steps.aggregate.outputs.has-results == 'true' && vars.REPORT_STORAGE_ACCOUNT != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Note: The managed identity must have write permission to the target storage account
      - name: Publish report to Azure Storage
        if: always() && steps.aggregate.outputs.has-results == 'true' && github.event_name == 'schedule' && vars.REPORT_STORAGE_ACCOUNT != ''
        id: publish-report
        env:
          RUN_ID: ${{ github.run_id }}
          JOB_ID: ${{ github.job }}
          STORAGE_ACCOUNT: ${{ vars.REPORT_STORAGE_ACCOUNT }}
          STORAGE_CONTAINER: ${{ vars.REPORT_STORAGE_CONTAINER || 'integration-reports' }}
          SKILL: ${{ matrix.skill }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          SKILL_NAME="${SKILL##*/}"
          PREFIX="${DATE}/${RUN_ID}/${SKILL_NAME}/"
          echo "Uploading reports to ${STORAGE_ACCOUNT}/${STORAGE_CONTAINER}/${PREFIX}"
          az storage blob upload-batch \
            --account-name "$STORAGE_ACCOUNT" \
            --destination "$STORAGE_CONTAINER" \
            --destination-path "$PREFIX" \
            --source reports/test-run-all-integration/ \
            --auth-mode login \
            --overwrite

      # Publish reports to the same storage account but a separate container for manual runs.
      # Note: The managed identity must have write permission to the target storage account.
      - name: Publish report to Azure Storage (manual run)
        if: always() && steps.aggregate.outputs.has-results == 'true' && github.event_name == 'workflow_dispatch' && vars.REPORT_STORAGE_ACCOUNT != ''
        id: publish-report-manual
        env:
          RUN_ID: ${{ github.run_id }}
          JOB_ID: ${{ github.job }}
          STORAGE_ACCOUNT: ${{ vars.REPORT_STORAGE_ACCOUNT }}
          STORAGE_CONTAINER: ${{ vars.MANUAL_REPORT_STORAGE_CONTAINER || 'manual-integration-reports' }}
          SKILL: ${{ matrix.skill }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          SKILL_NAME="${SKILL##*/}"
          PREFIX="${DATE}/${RUN_ID}/${SKILL_NAME}/"
          echo "Uploading reports to ${STORAGE_ACCOUNT}/${STORAGE_CONTAINER}/${PREFIX}"
          az storage blob upload-batch \
            --account-name "$STORAGE_ACCOUNT" \
            --destination "$STORAGE_CONTAINER" \
            --destination-path "$PREFIX" \
            --source reports/test-run-all-integration/ \
            --auth-mode login \
            --overwrite

      # Upload per-test token usage to the Azure Table that powers the dashboard's
      # "token usage over time" page. Runs for both scheduled and manual runs.
      # Note: The managed identity must have Storage Table Data Contributor on the storage account.
      - name: Upload token usage to table
        if: always() && steps.aggregate.outputs.has-results == 'true' && vars.REPORT_STORAGE_ACCOUNT != ''
        env:
          TOKEN_USAGE_STORAGE_ACCOUNT: ${{ vars.REPORT_STORAGE_ACCOUNT }}
          TOKEN_USAGE_TABLE_NAME: ${{ vars.TOKEN_USAGE_TABLE || 'integrationtokenusage' }}
          SKILL_INPUT: ${{ matrix.skill }}
          BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          export SKILL="${SKILL_INPUT##*/}"
          npm run upload:token-usage

      # Upload per-run tool usage (one row per tool call) to the Azure Table that
      # powers the dashboard's per-run tool review. Runs for both scheduled and manual runs.
      # Note: The managed identity must have Storage Table Data Contributor on the storage account.
      - name: Upload tool usage to table
        if: always() && steps.aggregate.outputs.has-results == 'true' && vars.REPORT_STORAGE_ACCOUNT != ''
        env:
          TOOL_USAGE_STORAGE_ACCOUNT: ${{ vars.REPORT_STORAGE_ACCOUNT }}
          TOOL_USAGE_TABLE_NAME: ${{ vars.TOOL_USAGE_TABLE || 'integrationtoolusage' }}
          SKILL_INPUT: ${{ matrix.skill }}
          BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          export SKILL="${SKILL_INPUT##*/}"
          npm run upload:tool-usage

      - name: Require complete aggregation
        if: always()
        env:
          AGGREGATE_OUTCOME: ${{ steps.aggregate.outcome }}
        run: |
          if [ "$AGGREGATE_OUTCOME" != "success" ]; then
            echo "::error::Permission results are missing, incomplete, or could not be merged"
            exit 1
          fi
