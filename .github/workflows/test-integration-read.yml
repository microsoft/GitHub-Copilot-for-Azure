name: Integration tests - read identity
on:
  workflow_call:
    inputs:
      skill:
        required: true
        type: string
      model-override:
        type: string
        default: ""
      no-skills:
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
  copilot-requests: write
jobs:
  test:
    runs-on: ubuntu-latest
    environment: cideploytest
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_READ_CLIENT_ID: ${{ vars.AZURE_READ_CLIENT_ID }}
      AZURE_WRITE_CLIENT_ID: ${{ vars.AZURE_WRITE_CLIENT_ID }}
      AZURE_ADMIN_CLIENT_ID: ${{ vars.AZURE_ADMIN_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_STAGE_SUBSCRIPTION_ID: ${{ vars.AZURE_STAGE_SUBSCRIPTION_ID }}
      AZURE_FIXTURE_COORDINATION_STORAGE_ACCOUNT: ${{ vars.AZURE_FIXTURE_COORDINATION_STORAGE_ACCOUNT }}
      AZURE_FIXTURE_COORDINATION_CONTAINER: ${{ vars.AZURE_FIXTURE_COORDINATION_CONTAINER }}
      REPORT_STORAGE_ACCOUNT: ${{ vars.REPORT_STORAGE_ACCOUNT }}
      REPORT_STORAGE_CONTAINER: ${{ github.event_name == 'schedule' && (vars.REPORT_STORAGE_CONTAINER || 'integration-reports') || (vars.MANUAL_REPORT_STORAGE_CONTAINER || 'manual-integration-reports') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - name: Run read-only tests
        uses: ./.github/actions/test-permission
        with:
          skill: ${{ inputs.skill }}
          permission: read
          model-override: ${{ inputs.model-override }}
          no-skills: ${{ inputs.no-skills }}
