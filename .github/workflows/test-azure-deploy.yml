# azure-deploy groups use isolated fixture/test profiles and private stage reports.
name: Integration Tests - azure-deploy
permissions:
  id-token: write
  contents: read
  copilot-requests: write
on:
  workflow_dispatch:
    inputs:
      model-override:
        description: Model to use for testing
        required: false
        type: choice
        options:
          - claude-sonnet-5
          - claude-opus-4.8
      test-pattern:
        description: Optional comma-separated test groups; empty runs all groups.
        required: false
        type: string
        default: ""
      no-skills:
        description: Disable skill loading
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      model-override:
        description: Model to use for testing
        required: false
        type: string
      test-pattern:
        description: Optional comma-separated test groups
        required: false
        type: string
        default: ""
      no-skills:
        description: Disable skill loading
        required: false
        type: boolean
        default: false
jobs:
  setup:
    name: Build test matrix
    environment: cideploytest
    runs-on: ubuntu-latest
    outputs:
      none-matrix: ${{ steps.set-matrix.outputs.none-matrix }}
      admin-matrix: ${{ steps.set-matrix.outputs.admin-matrix }}
      report-groups: ${{ steps.set-matrix.outputs.report-groups }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Authenticate stage storage
        uses: ./.github/actions/azure-profiles
      - name: Parse test-pattern input into matrix
        id: set-matrix
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        env:
          INPUT: ${{ inputs.test-pattern }}
        with:
          script: |
            const DEFAULT = ["skill-invocation","vanilla-static-web-apps-deploy","vanilla-app-service-deploy","vanilla-azure-functions-deploy","vanilla-azure-container-apps-deploy","terraform-static-web-apps-deploy","terraform-app-service-deploy","terraform-azure-functions-deploy","terraform-azure-container-apps-deploy","brownfield-dotnet","brownfield-javascript","brownfield-python"];
            const input = process.env.INPUT || "";
            const matrix = [...new Set(input
              ? input.split(",").map(s => s.trim()).filter(Boolean)
              : DEFAULT)];
            if (matrix.some(group => !/^[a-z0-9-]+$/.test(group))) {
              throw new Error("Test group names must contain only lowercase letters, digits, and hyphens");
            }
            core.setOutput("none-matrix", JSON.stringify(matrix.filter(group => group === "skill-invocation")));
            core.setOutput("admin-matrix", JSON.stringify(matrix.filter(group => group !== "skill-invocation")));
            core.setOutput("report-groups", JSON.stringify(matrix));
  test-none:
    name: azure-deploy none – ${{ matrix.test-group }}
    needs: setup
    if: needs.setup.outputs.none-matrix != '[]'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        test-group: ${{ fromJson(needs.setup.outputs.none-matrix) }}
    uses: ./.github/workflows/test-azure-deploy-group.yml
    with:
      group: ${{ matrix.test-group }}
      permission: none
      model-override: ${{ inputs.model-override || '' }}
      no-skills: ${{ inputs.no-skills || false }}
  test-admin:
    name: azure-deploy admin – ${{ matrix.test-group }}
    needs: setup
    if: needs.setup.outputs.admin-matrix != '[]'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        test-group: ${{ fromJson(needs.setup.outputs.admin-matrix) }}
    uses: ./.github/workflows/test-azure-deploy-group.yml
    with:
      group: ${{ matrix.test-group }}
      permission: admin
      model-override: ${{ inputs.model-override || '' }}
      no-skills: ${{ inputs.no-skills || false }}
  report:
    name: Consolidate azure-deploy reports
    needs: [setup, test-none, test-admin]
    if: always() && !cancelled() && needs.setup.result == 'success' && needs.setup.outputs.report-groups != '[]'
    uses: ./.github/workflows/report-integration-skill.yml
    with:
      skill: azure-skills/azure-deploy
      groups: ${{ needs.setup.outputs.report-groups }}
