# Run every azure-deploy category with per-stimulus profiles and direct report publication.
name: Integration Tests - azure-deploy
permissions:
  id-token: write
  contents: read
  copilot-requests: write
on:
  workflow_dispatch:
    inputs:
      model-override:
        description: Model to use for testing
        required: false
        type: choice
        options:
          - claude-sonnet-5
          - claude-opus-4.8
      test-pattern:
        description: Optional comma-separated test groups; empty runs all groups.
        required: false
        type: string
        default: ""
      no-skills:
        description: Disable skill loading
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      model-override:
        description: Model to use for testing
        required: false
        type: string
      test-pattern:
        description: Optional comma-separated test groups
        required: false
        type: string
        default: ""
      no-skills:
        description: Disable skill loading
        required: false
        type: boolean
        default: false
jobs:
  setup:
    name: Build test matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Parse test-pattern input into matrix
        id: set-matrix
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        env:
          INPUT: ${{ inputs.test-pattern }}
        with:
          script: |
            const DEFAULT = ["skill-invocation","vanilla-static-web-apps-deploy","vanilla-app-service-deploy","vanilla-azure-functions-deploy","vanilla-azure-container-apps-deploy","terraform-static-web-apps-deploy","terraform-app-service-deploy","terraform-azure-functions-deploy","terraform-azure-container-apps-deploy","brownfield-dotnet","brownfield-javascript","brownfield-python"];
            const input = process.env.INPUT || "";
            const matrix = [...new Set(input
              ? input.split(",").map(s => s.trim()).filter(Boolean)
              : DEFAULT)];
            if (matrix.some(group => !/^[a-z0-9-]+$/.test(group))) {
              throw new Error("Test group names must contain only lowercase letters, digits, and hyphens");
            }
            core.setOutput("matrix", JSON.stringify(matrix));
  test:
    name: azure-deploy – ${{ matrix.test-group }}
    needs: setup
    if: needs.setup.outputs.matrix != '[]'
    environment: cideploytest
    runs-on: ubuntu-latest
    env:
      AZURE_STAGE_CLIENT_ID: ${{ vars.AZURE_STAGE_CLIENT_ID }}
      AZURE_READ_CLIENT_ID: ${{ vars.AZURE_READ_CLIENT_ID }}
      AZURE_WRITE_CLIENT_ID: ${{ vars.AZURE_WRITE_CLIENT_ID }}
      AZURE_ADMIN_CLIENT_ID: ${{ vars.AZURE_ADMIN_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_STAGE_SUBSCRIPTION_ID: ${{ vars.AZURE_STAGE_SUBSCRIPTION_ID }}
      AZURE_FIXTURE_COORDINATION_STORAGE_ACCOUNT: ${{ vars.AZURE_FIXTURE_COORDINATION_STORAGE_ACCOUNT }}
      AZURE_FIXTURE_COORDINATION_CONTAINER: ${{ vars.AZURE_FIXTURE_COORDINATION_CONTAINER }}
      REPORT_STORAGE_ACCOUNT: ${{ vars.REPORT_STORAGE_ACCOUNT }}
      REPORT_STORAGE_CONTAINER: ${{ github.event_name == 'schedule' && (vars.REPORT_STORAGE_CONTAINER || 'integration-reports') || (vars.MANUAL_REPORT_STORAGE_CONTAINER || 'manual-integration-reports') }}
      TOKEN_USAGE_STORAGE_ACCOUNT: ${{ vars.REPORT_STORAGE_ACCOUNT }}
      TOKEN_USAGE_TABLE_NAME: ${{ vars.TOKEN_USAGE_TABLE || 'integrationtokenusage' }}
      TOOL_USAGE_STORAGE_ACCOUNT: ${{ vars.REPORT_STORAGE_ACCOUNT }}
      TOOL_USAGE_TABLE_NAME: ${{ vars.TOOL_USAGE_TABLE || 'integrationtoolusage' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        test-group: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - name: Setup terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Run group tests and publish reports
        uses: ./.github/actions/test-integration
        with:
          skill: azure-skills/azure-deploy
          test-tag: category=${{ matrix.test-group }}
          report-group: ${{ matrix.test-group }}
          model-override: ${{ inputs.model-override || '' }}
          no-skills: ${{ inputs.no-skills || false }}
          playwright: "true"
