name: Sync skill and reference allowlists

on:
  schedule:
    - cron: '0 11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-azure-mcp
  cancel-in-progress: true

jobs:
  generate-allowlists:
    if: github.repository == 'microsoft/GitHub-Copilot-for-Azure'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          path: source-repo
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: source-repo/scripts/package-lock.json

      - name: Install scripts dependencies
        working-directory: source-repo/scripts
        run: npm ci --ignore-scripts

      - name: Generate allowlist JSON files
        working-directory: source-repo/scripts
        env:
          ALLOWLIST_DIR: ${{ github.workspace }}/generated-allowlists
        run: |
          PLUGIN_PATHS=()
          for plugin_dir in ../plugins/*; do
            if [ -d "$plugin_dir" ]; then
              PLUGIN_PATHS+=("$plugin_dir/skills")
            fi
          done

          if [ "${#PLUGIN_PATHS[@]}" -eq 0 ]; then
            echo "No plugin directories found under ../plugins"
            exit 1
          fi

          mkdir -p "$ALLOWLIST_DIR"
          npm run generateMcpAllowlists -- "${PLUGIN_PATHS[@]}" "$ALLOWLIST_DIR"

      - name: Upload generated allowlists
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-allowlists
          path: |
            generated-allowlists/allowed-skill-names.json
            generated-allowlists/allowed-plugin-file-references.json
          if-no-files-found: error

  sync-allowlists:
    if: github.repository == 'microsoft/GitHub-Copilot-for-Azure'
    needs: generate-allowlists
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: mcp
            resource-directory: servers/Azure.Mcp.Server/src/Resources
            branch: sync/azure-skills-references
            pr-title: Sync skill references from GitHub-Copilot-for-Azure
          - repository: GitHub-Copilot-for-Azure
            resource-directory: telemetry-reporter/resources
            branch: sync/telemetry-reporter-allowlists
            pr-title: 'chore: sync telemetry reporter allowlists'
    env:
      TARGET_REPO: microsoft/${{ matrix.repository }}
      RESOURCE_DIR: ${{ matrix.resource-directory }}
      BRANCH_NAME: ${{ matrix.branch }}
      PR_TITLE: ${{ matrix.pr-title }}
      SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
      SOURCE_COMMIT: ${{ github.sha }}

    steps:
      - name: Download generated allowlists
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plugin-allowlists
          path: generated-allowlists

      - name: Generate token for target repo
        id: target-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.GHCP4A_BOT_APP_ID }}
          private-key: ${{ secrets.GHCP4A_BOT_PRIVATE_KEY }}
          owner: microsoft
          repositories: ${{ matrix.repository }}

      - name: Clone target repo and create feature branch
        env:
          GH_TOKEN: ${{ steps.target-token.outputs.token }}
        run: |
          gh repo clone "$TARGET_REPO" target-repo -- --branch main --single-branch

          cd target-repo
          git checkout -b "$BRANCH_NAME"

      - name: Copy JSON files to target repo
        run: |
          TARGET_DIR="target-repo/$RESOURCE_DIR"
          cp generated-allowlists/allowed-skill-names.json "$TARGET_DIR/allowed-skill-names.json"
          cp generated-allowlists/allowed-plugin-file-references.json "$TARGET_DIR/allowed-plugin-file-references.json"

      - name: Commit and push changes
        id: commit
        working-directory: target-repo
        env:
          GH_TOKEN: ${{ steps.target-token.outputs.token }}
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            "$RESOURCE_DIR/allowed-skill-names.json" \
            "$RESOURCE_DIR/allowed-plugin-file-references.json"
          if git diff --cached --quiet; then
            echo "No changes to sync."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            DIFF_EXIT_CODE=$?
            if [ "$DIFF_EXIT_CODE" -ne 1 ]; then
              echo "::error::Failed to compare staged allowlists." >&2
              exit "$DIFF_EXIT_CODE"
            fi

            git commit -m "$PR_TITLE"
            git push --force origin "$BRANCH_NAME"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update Pull Request
        if: steps.commit.outputs.has_changes == 'true'
        working-directory: target-repo
        env:
          GH_TOKEN: ${{ steps.target-token.outputs.token }}
        run: |
          PR_BODY="Skill and reference-file allowlists can drift as plugin sources change. This automated PR refreshes \`$RESOURCE_DIR/allowed-skill-names.json\` and \`$RESOURCE_DIR/allowed-plugin-file-references.json\` with the lists generated from [GitHub-Copilot-for-Azure]($SOURCE_URL) at commit \`$SOURCE_COMMIT\`. The Azure MCP and standalone telemetry reporter updates are proposed in separate PRs using the same generated snapshot; reporter builds and releases remain unchanged."

          EXISTING_PR=$(gh pr list \
            --repo "$TARGET_REPO" \
            --head "$BRANCH_NAME" \
            --base "main" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$EXISTING_PR" ]; then
            echo "Updating existing PR #$EXISTING_PR"
            gh pr edit "$EXISTING_PR" \
              --repo "$TARGET_REPO" \
              --title "$PR_TITLE" \
              --body "$PR_BODY"
          else
            echo "Creating new PR"
            gh pr create \
              --repo "$TARGET_REPO" \
              --base "main" \
              --head "$BRANCH_NAME" \
              --title "$PR_TITLE" \
              --body "$PR_BODY"
          fi
