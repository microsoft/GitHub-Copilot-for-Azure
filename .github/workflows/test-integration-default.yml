name: Integration tests - default identity
on:
  workflow_call:
    inputs:
      skill:
        required: true
        type: string
      model-override:
        type: string
        default: ""
      no-skills:
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
  copilot-requests: write
jobs:
  test:
    runs-on: ubuntu-latest
    environment: cideploytest
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - name: Run default-identity tests
        uses: ./.github/actions/test-permission
        with:
          skill: ${{ inputs.skill }}
          permission: ""
          model-override: ${{ inputs.model-override }}
          no-skills: ${{ inputs.no-skills }}
