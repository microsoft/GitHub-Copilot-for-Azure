name: Skill Improvement

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  copilot-requests: write

on:
  workflow_dispatch:
    inputs:
      run-spec:
        description: "Repository-relative skill improvement run specification"
        required: true
        type: string
        default: "tests/skill-improvement/specs/azure-kusto.yaml"
      baseline-ref:
        description: "Optional baseline branch, tag, or commit; defaults to the workflow branch"
        required: false
        type: string
        default: ""
      create-draft-pr:
        description: "Create a draft PR when a candidate passes every acceptance rule"
        required: false
        type: boolean
        default: false
      pr-base:
        description: "Base branch for an optional draft PR"
        required: false
        type: string
        default: "main"
      judge-source-run-id:
        description: "Optional source Skill Improvement run ID for judge-only repeatability analysis"
        required: false
        type: string
        default: ""
      judge-repetitions:
        description: "Number of times to re-grade each fixed baseline trajectory set"
        required: false
        type: number
        default: 3
      judge-models:
        description: "Comma-separated judge models for repeatability and cross-judge agreement"
        required: false
        type: string
        default: "claude-sonnet-5,claude-opus-4.8"

concurrency:
  group: skill-improvement-${{ inputs.judge-source-run-id || inputs.run-spec }}
  cancel-in-progress: false

jobs:
  improve:
    if: inputs.judge-source-run-id == ''
    name: Improve skill
    runs-on: ubuntu-latest
    timeout-minutes: 420
    environment: skill-improvement-evals
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_EVALS_SUBSCRIPTION_ID: ${{ vars.AZURE_EVALS_SUBSCRIPTION_ID }}
      AZURE_EVALS_RESOURCE_GROUP: ${{ vars.AZURE_EVALS_RESOURCE_GROUP }}
      RUN_OUTPUT: tests/skill-improvement-runs/${{ github.run_id }}
      BASELINE_REF: ${{ inputs.baseline-ref || github.ref_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout workflow source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Install azd
        uses: Azure/setup-azd@0b7e3a35ab00f2eee7080c845eb39c3f0ebfa553 # v2

      - name: Log in with Azure (Federated Credentials)
        run: |
          azd auth login `
            --client-id "$Env:AZURE_CLIENT_ID" `
            --federated-credential-provider "github" `
            --tenant-id "$Env:AZURE_TENANT_ID"
        shell: pwsh

      - name: Azure login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # azure/login only fetches the OIDC access token once.
      # If a test starts after the token expires, it will fail with authentication errors.
      # This step runs code to refresh the cached OIDC access token periodically to ensure all tests have a valid access token.
      # Learn more at https://github.com/Azure/login/issues/372
      # Refresh interval is sub-5-minutes because the OIDC token's lifetime is
      # 5 minutes. Using 240s avoids seeing invalid tokens due to clock skew.
      - name: Fetch OIDC token every 240 seconds
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          while true; do
            token=$(curl -s -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" | jq .value -r)
            az login --service-principal -u $AZURE_CLIENT_ID -t $AZURE_TENANT_ID --federated-token $token --output none
            sleep 240
          done &

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            tests/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          cd tests
          npm ci

      - name: Setup Copilot CLI
        uses: mvkaran/setup-copilot-cli@d05a47209e6b3185c9c55702bef49f28e6eebef7 # v1
        with:
          token: ${{ github.token }}

      - name: Validate run specification
        working-directory: tests
        env:
          RUN_SPEC: ${{ inputs.run-spec }}
        run: |
          npm run skill-improvement -- validate \
            --config "../${RUN_SPEC}"

      - name: Run skill improvement
        id: run
        continue-on-error: true
        working-directory: tests
        env:
          RUN_SPEC: ${{ inputs.run-spec }}
        run: |
          npm run skill-improvement -- execute \
            --config "../${RUN_SPEC}" \
            --baseline-ref "${BASELINE_REF}" \
            --output "../${RUN_OUTPUT}"

      - name: Ensure managed evaluation resources are stopped
        if: always()
        working-directory: tests
        env:
          RUN_SPEC: ${{ inputs.run-spec }}
        run: |
          npm run skill-improvement -- cleanup-resources \
            --config "../${RUN_SPEC}"

      - name: Ensure a report exists
        if: always()
        shell: bash
        env:
          RUN_SPEC: ${{ inputs.run-spec }}
        run: |
          mkdir -p "$RUN_OUTPUT"
          if [[ ! -f "$RUN_OUTPUT/report.md" ]]; then
            cat > "$RUN_OUTPUT/report.md" <<EOF
          # Skill improvement run failed

          The workflow failed before the TypeScript engine could create its detailed report.

          - Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - Run specification: \`${RUN_SPEC}\`
          - Baseline ref: \`${BASELINE_REF}\`
          EOF
          fi
          if [[ ! -f "$RUN_OUTPUT/report-summary.md" ]]; then
            cp "$RUN_OUTPUT/report.md" "$RUN_OUTPUT/report-summary.md"
          fi

      - name: Add decision summary
        if: always()
        shell: bash
        run: |
          cat "$RUN_OUTPUT/report-summary.md" >> "$GITHUB_STEP_SUMMARY"
          printf '\nWorkflow run: %s/%s/actions/runs/%s\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Read workflow outputs
        if: always()
        id: metadata
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("node:fs");
            const path = require("node:path");

            const metadataPath = path.join(
              process.env.RUN_OUTPUT,
              "workflow-outputs.json"
            );
            const metadata = fs.existsSync(metadataPath)
              ? JSON.parse(fs.readFileSync(metadataPath, "utf8"))
              : {
                  accepted: false,
                  issueMode: "never",
                  draftPullRequestMode: "never",
                  skill: "unknown",
                  finalPatchPath: null,
                };
            core.setOutput("accepted", metadata.accepted);
            core.setOutput("issue-mode", metadata.issueMode);
            core.setOutput("draft-pr-mode", metadata.draftPullRequestMode);
            core.setOutput("skill", metadata.skill);
            core.setOutput("patch", metadata.finalPatchPath ?? "");
      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skill-improvement-${{ github.run_id }}
          path: ${{ env.RUN_OUTPUT }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish report to Azure Storage
        if: always() && vars.REPORT_STORAGE_ACCOUNT != ''
        shell: bash
        env:
          STORAGE_ACCOUNT: ${{ vars.REPORT_STORAGE_ACCOUNT }}
          STORAGE_CONTAINER: ${{ vars.SKILL_IMPROVEMENT_STORAGE_CONTAINER }}
          SKILL: ${{ steps.metadata.outputs.skill }}
        run: |
          if [[ -z "$STORAGE_CONTAINER" ]]; then
            echo "::error::SKILL_IMPROVEMENT_STORAGE_CONTAINER must be configured when REPORT_STORAGE_ACCOUNT is set."
            exit 1
          fi
          DATE=$(date -u +%Y-%m-%d)
          SKILL="${SKILL:-unknown}"
          PREFIX="${DATE}/${GITHUB_RUN_ID}/${SKILL}/"
          UPLOAD_OUTPUT="${RUNNER_TEMP}/skill-improvement-upload-${GITHUB_RUN_ID}"
          mkdir -p "$UPLOAD_OUTPUT"
          cp -a "$RUN_OUTPUT/." "$UPLOAD_OUTPUT/"
          (cd tests && npx tsx skill-improvement/redact-output.ts "$UPLOAD_OUTPUT")
          az storage blob upload-batch \
            --account-name "$STORAGE_ACCOUNT" \
            --destination "$STORAGE_CONTAINER" \
            --destination-path "$PREFIX" \
            --source "$UPLOAD_OUTPUT" \
            --auth-mode login \
            --overwrite \
            --only-show-errors \
            --output none

      - name: Create result issue
        if: always() && steps.metadata.outputs.issue-mode == 'always'
        id: issue
        shell: bash
        run: |
          issue_body="$RUNNER_TEMP/skill-improvement-issue-body.md"
          cp "$RUN_OUTPUT/report-summary.md" "$issue_body"
          cat >> "$issue_body" <<EOF

          Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF
          issue_url=$(gh issue create \
            --title "Skill improvement: ${{ steps.metadata.outputs.skill }} (run $GITHUB_RUN_ID)" \
            --body-file "$issue_body")
          echo "url=$issue_url" >> "$GITHUB_OUTPUT"
          echo "Result issue: $issue_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Create accepted candidate branch
        if: >-
          steps.metadata.outputs.accepted == 'true'
          && steps.metadata.outputs.draft-pr-mode == 'accepted-candidate-only'
          && inputs.create-draft-pr
        id: candidate
        shell: bash
        run: |
          branch="skill-improvement/${{ steps.metadata.outputs.skill }}-${GITHUB_RUN_ID}"
          git checkout -b "$branch" "$BASELINE_REF"
          git apply --index "$RUN_OUTPUT/${{ steps.metadata.outputs.patch }}"
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "feat: improve ${{ steps.metadata.outputs.skill }} from evaluations" \
            -m "Co-authored-by: Copilot App <223556219+Copilot@users.noreply.github.com>"
          git push origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Generate token for draft pull request
        if: steps.candidate.outputs.branch != ''
        id: draft-pr-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.GHCP4A_BOT_APP_ID }}
          private-key: ${{ secrets.GHCP4A_BOT_PRIVATE_KEY }}
          owner: microsoft
          repositories: GitHub-Copilot-for-Azure

      - name: Create draft pull request
        if: steps.candidate.outputs.branch != ''
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ steps.draft-pr-token.outputs.token }}
          PR_BASE: ${{ inputs.pr-base }}
        run: |
          body_file="$RUNNER_TEMP/skill-improvement-pr-body.md"
          cat > "$body_file" <<EOF
          Automated candidate from skill improvement run $GITHUB_RUN_ID.

          Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          This pull request is intentionally a draft and requires human review.
          EOF
          if [[ -n "${{ steps.issue.outputs.url }}" ]]; then
            printf '\nResult issue: %s\n' "${{ steps.issue.outputs.url }}" >> "$body_file"
          fi
          pr_url=$(gh pr create \
            --draft \
            --base "$PR_BASE" \
            --head "${{ steps.candidate.outputs.branch }}" \
            --title "feat: improve ${{ steps.metadata.outputs.skill }} from evaluations" \
            --body-file "$body_file")
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "Draft pull request: $pr_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Link draft pull request from issue
        if: steps.issue.outputs.url != '' && steps.pr.outputs.url != ''
        shell: bash
        env:
          GH_TOKEN: ${{ steps.draft-pr-token.outputs.token }}
        run: |
          issue_number="${{ steps.issue.outputs.url }}"
          issue_number="${issue_number##*/}"
          gh issue comment "$issue_number" \
            --body "Accepted candidate draft pull request: ${{ steps.pr.outputs.url }}"

      - name: Fail when the engine failed
        if: steps.run.outcome == 'failure'
        run: exit 1

  judge-repeatability:
    if: inputs.judge-source-run-id != ''
    name: Judge repeatability
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: skill-improvement-evals
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ inputs.judge-source-run-id }}
      JUDGE_REPETITIONS: ${{ inputs.judge-repetitions }}
      JUDGE_MODELS: ${{ inputs.judge-models }}
      OUTPUT_DIR: judge-repeatability-${{ github.run_id }}

    steps:
      - name: Checkout workflow source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: tests/package-lock.json

      - name: Install test dependencies
        working-directory: tests
        run: npm ci

      - name: Setup Copilot CLI
        uses: mvkaran/setup-copilot-cli@d05a47209e6b3185c9c55702bef49f28e6eebef7 # v1
        with:
          token: ${{ github.token }}

      - name: Download fixed source trajectories
        shell: bash
        run: |
          mkdir -p source-run "$OUTPUT_DIR"
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "skill-improvement-$SOURCE_RUN_ID" \
            --dir source-run

          mapfile -d '' answer_files < <(
            find source-run/baseline/generation -type f -name answers.jsonl -print0
          )
          if [[ "${#answer_files[@]}" -eq 0 ]]; then
            echo "::error::No baseline answers.jsonl files found in source run $SOURCE_RUN_ID."
            exit 1
          fi
          printf 'Found %s fixed trajectory sets.\n' "${#answer_files[@]}"

      - name: Re-grade fixed trajectories
        shell: bash
        run: |
          set -euo pipefail
          plugin="$GITHUB_WORKSPACE/tests/vally/vally-graders.ts"
          IFS=',' read -r -a judge_models <<< "$JUDGE_MODELS"

          while IFS= read -r -d '' answers; do
            eval_dir="$(dirname "$answers")"
            eval_spec="$(find "$eval_dir" -maxdepth 1 -type f -name '*.yaml' -print -quit)"
            if [[ -z "$eval_spec" ]]; then
              echo "::error::No eval spec found beside $answers."
              exit 1
            fi

            relative="${eval_dir#source-run/baseline/generation/}"
            for judge_model in "${judge_models[@]}"; do
              judge_model="${judge_model//[[:space:]]/}"
              if [[ -z "$judge_model" ]]; then
                continue
              fi
              for repeat in $(seq 1 "$JUDGE_REPETITIONS"); do
                output="$OUTPUT_DIR/$judge_model/repeat-$repeat/$relative"
                mkdir -p "$output"
                (
                  cd tests
                  "$GITHUB_WORKSPACE/tests/node_modules/.bin/vally" grade \
                    --eval-spec "$GITHUB_WORKSPACE/$eval_spec" \
                    --grader-plugin "$plugin" \
                    --judge-model "$judge_model" \
                    --run-dir "$GITHUB_WORKSPACE/$eval_dir" \
                    --output jsonl \
                    --verbose \
                    < "$GITHUB_WORKSPACE/$answers" \
                    > "$GITHUB_WORKSPACE/$output/judgments.jsonl" \
                    2> "$GITHUB_WORKSPACE/$output/stderr.log"
                )
              done
            done
          done < <(
            find source-run/baseline/generation -type f -name answers.jsonl -print0
          )

      - name: Summarize judge repeatability
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const root = process.env.OUTPUT_DIR;
          const sourceRunId = process.env.SOURCE_RUN_ID;
          const resultFiles = [];

          function visit(directory) {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const fullPath = path.join(directory, entry.name);
              if (entry.isDirectory()) {
                visit(fullPath);
              } else if (entry.name === "judgments.jsonl") {
                resultFiles.push(fullPath);
              }
            }
          }

          visit(root);
          const rows = [];
          const verdicts = [];

          for (const file of resultFiles.sort()) {
            const relative = path.relative(root, file).split(path.sep);
            const judgeModel = relative[0];
            const repeat = relative[1].replace("repeat-", "");
            const condition = relative[2];
            const records = fs.readFileSync(file, "utf8")
              .split(/\r?\n/)
              .filter(Boolean)
              .map(line => JSON.parse(line));
            const overallScores = [];
            const promptScores = [];
            const verificationScores = [];
            let passed = 0;

            records.forEach((record, index) => {
              const grade = record.gradeResult;
              if (grade?.passed) {
                passed += 1;
              }
              overallScores.push(Number(grade?.score ?? 0));
              const prompt = grade?.details?.find(detail => detail.name === "prompt");
              if (prompt) {
                promptScores.push(Number(prompt.score ?? 0));
                const verification = prompt.metadata?.rubric_scores?.find(
                  item => /verification/i.test(item.criterion ?? "")
                );
                if (verification) {
                  const score = Number(verification.score ?? 0);
                  verificationScores.push(score);
                }
                verdicts.push({
                  judgeModel,
                  condition,
                  repeat: Number(repeat),
                  trajectory: index + 1,
                  passed: grade?.passed === true,
                  overallScore: Number(grade?.score ?? 0),
                  promptScore: Number(prompt.score ?? 0),
                  promptEvidence: prompt.evidence ?? "",
                  rubricScores: prompt.metadata?.rubric_scores ?? [],
                });
              }
            });

            const average = values => values.length
              ? values.reduce((sum, value) => sum + value, 0) / values.length
              : 0;
            const range = values => values.length
              ? `${Math.min(...values).toFixed(2)}-${Math.max(...values).toFixed(2)}`
              : "N/A";

            rows.push({
              judgeModel,
              condition,
              repeat,
              passed: `${passed}/${records.length}`,
              averageOverall: average(overallScores).toFixed(3),
              promptRange: range(promptScores),
              verificationRange: range(verificationScores),
            });
          }

          let unstable = false;
          const repeatabilityGroups = new Map();
          const agreementGroups = new Map();
          for (const verdict of verdicts) {
            const repeatabilityKey =
              `${verdict.judgeModel}|${verdict.condition}|${verdict.trajectory}`;
            const agreementKey = `${verdict.condition}|${verdict.trajectory}`;
            for (const [groups, key] of [
              [repeatabilityGroups, repeatabilityKey],
              [agreementGroups, agreementKey],
            ]) {
              const values = groups.get(key) ?? [];
              values.push(verdict);
              groups.set(key, values);
            }
            if (!verdict.passed) {
              unstable = true;
            }
          }

          function hasUnstableSpread(values) {
            const passValues = new Set(values.map(value => value.passed));
            const verificationScores = values.flatMap(value => {
              const verification = value.rubricScores.find(
                item => /verification/i.test(item.criterion ?? "")
              );
              return verification ? [Number(verification.score)] : [];
            });
            const verificationSpread = verificationScores.length
              ? Math.max(...verificationScores) - Math.min(...verificationScores)
              : 0;
            return passValues.size > 1 || verificationSpread > 1;
          }

          if ([...repeatabilityGroups.values()].some(hasUnstableSpread)) {
            unstable = true;
          }
          if ([...agreementGroups.values()].some(hasUnstableSpread)) {
            unstable = true;
          }

          const lines = [
            "# Judge repeatability",
            "",
            `Source Skill Improvement run: ${sourceRunId}`,
            `Judge repetitions: ${process.env.JUDGE_REPETITIONS}`,
            `Judge models: ${process.env.JUDGE_MODELS}`,
            "",
            "| Judge | Condition | Repeat | Passed | Average overall score | Prompt score range | Verification rubric range |",
            "| --- | --- | ---: | ---: | ---: | ---: | ---: |",
            ...rows.map(row =>
              `| ${row.judgeModel} | ${row.condition} | ${row.repeat} | ${row.passed} | ${row.averageOverall} | ${row.promptRange} | ${row.verificationRange} |`
            ),
            "",
            unstable
              ? "**Result: UNSTABLE** — a verdict failed/flipped or verification scores differed by more than one rubric point."
              : "**Result: STABLE** — every verdict passed, pass/fail decisions were repeatable, and verification scores stayed within one rubric point within and across judges.",
          ];
          const summary = `${lines.join("\n")}\n`;
          fs.writeFileSync(path.join(root, "summary.md"), summary);
          fs.writeFileSync(
            path.join(root, "prompt-verdicts.jsonl"),
            `${verdicts.map(record => JSON.stringify(record)).join("\n")}\n`
          );
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);

          if (unstable) {
            process.exitCode = 1;
          }
          NODE

      - name: Upload judge-repeatability artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: judge-repeatability-${{ github.run_id }}
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: error
          retention-days: 30
