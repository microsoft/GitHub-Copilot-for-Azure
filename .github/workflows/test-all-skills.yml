# Test All Skills - non-integration
#
# Runs the non-integration test suite for all skills.
# Triggered manually or on significant changes.

name: Test All Skills - non-integration

permissions:
  contents: read

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "tests/**"
      - "plugins/*/skills/**"
      - ".github/workflows/test-*.yml"
  pull_request:
    paths:
      - "tests/**"
      - "plugins/*/skills/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run All Skill Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: tests/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build plugin output
        run: |
          cd ..
          npm ci --ignore-scripts
          npm run build

      - name: Run tests
        env:
          CI: true
        run: npm test
