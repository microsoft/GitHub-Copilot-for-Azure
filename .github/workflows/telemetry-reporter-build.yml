name: Telemetry Reporter

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "telemetry-reporter/**"
      - ".github/workflows/telemetry-reporter-build.yml"
      - "hooks/scripts/install-telemetry.sh"
      - "hooks/scripts/install-telemetry.ps1"

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: telemetry-reporter/global.json

      - name: Build
        working-directory: ./telemetry-reporter
        run: dotnet build ./ghcfa-telem.slnx --configuration Debug

      - name: Test
        working-directory: ./telemetry-reporter
        env:
          AZURE_MCP_COLLECT_TELEMETRY: "false"
        run: >
          dotnet test ./ghcfa-telem.slnx --configuration Debug --no-build
          --results-directory ./TestResults
          --report-xunit
          --report-xunit-filename telemetry-tests.xml
          --report-xunit-html
          --report-xunit-html-filename telemetry-tests.html

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: telemetry-test-results
          path: |
            telemetry-reporter/TestResults/**/*.xml
            telemetry-reporter/TestResults/**/*.html
          if-no-files-found: error

  native-musl:
    name: Native AOT (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-musl-x64
            runner: ubuntu-24.04
          - rid: linux-musl-arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Build, smoke-test, and package Native AOT
        shell: pwsh
        working-directory: ./telemetry-reporter
        env:
          AZURE_MCP_COLLECT_TELEMETRY: "false"
        run: >
          ./eng/scripts/Build-Native.ps1
          -RuntimeIdentifier '${{ matrix.rid }}'
          -RestoreConfigFile ./nuget.config

      - name: Upload verified runtime and symbols packages
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: telemetry-reporter_${{ matrix.rid }}
          path: telemetry-reporter/artifacts/packages/*
          if-no-files-found: error
