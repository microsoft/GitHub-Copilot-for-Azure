name: Refresh Azure MCP allowlists

on:
  schedule:
    - cron: '43 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-azure-mcp-allowlists
  cancel-in-progress: false

jobs:
  discover:
    if: github.repository == 'microsoft/GitHub-Copilot-for-Azure'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - name: Install scripts dependencies
        run: npm ci --ignore-scripts
        working-directory: scripts
      - name: Resolve newest Azure MCP release
        working-directory: scripts
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run generateAzureMcpAllowlist -- resolve --output ../release.json
      - name: Download and verify release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG=$(jq -er .tag release.json)
          gh release download "$RELEASE_TAG" --repo microsoft/mcp \
            --pattern Azure.Mcp.Server-linux-x64.zip --dir "$RUNNER_TEMP/azure-mcp"
          npm --prefix scripts run generateAzureMcpAllowlist -- verify-asset \
            --release "$PWD/release.json" \
            --archive "$RUNNER_TEMP/azure-mcp/Azure.Mcp.Server-linux-x64.zip"
          unzip -q "$RUNNER_TEMP/azure-mcp/Azure.Mcp.Server-linux-x64.zip" \
            -d "$RUNNER_TEMP/azure-mcp/server"
          chmod +x "$RUNNER_TEMP/azure-mcp/server/azmcp"
      - name: Discover commands and namespace tools
        run: |
          npm --prefix scripts run generateAzureMcpAllowlist -- discover \
            --binary "$RUNNER_TEMP/azure-mcp/server/azmcp" \
            --release "$PWD/release.json" --output "$PWD/discovery.json"
      - name: Upload discovery
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: azure-mcp-discovery
          path: |
            discovery.json
            release.json
          if-no-files-found: error

  publish:
    if: github.repository == 'microsoft/GitHub-Copilot-for-Azure'
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate publication token
        id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.GHCP4A_BOT_APP_ID }}
          private-key: ${{ secrets.GHCP4A_BOT_PRIVATE_KEY }}
          owner: microsoft
          repositories: GitHub-Copilot-for-Azure
          permission-contents: write
          permission-pull-requests: write
      - name: Checkout current main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Download discovery
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: azure-mcp-discovery
          path: ${{ runner.temp }}/azure-mcp-discovery
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - name: Install scripts dependencies
        run: npm ci --ignore-scripts
        working-directory: scripts
      - name: Check refresh implementation
        working-directory: scripts
        run: |
          npm test -- src/__tests__/generate-azure-mcp-allowlist.test.ts src/__tests__/azure-mcp-publication.test.ts
          npm run typecheck
          npm run lint -- src/generate-azure-mcp-allowlist.ts src/azure-mcp-publication.ts src/__tests__/generate-azure-mcp-allowlist.test.ts src/__tests__/azure-mcp-publication.test.ts
      - name: Publish one update PR
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/azure-mcp-gitconfig
        run: |
          gh auth setup-git
          node --import ./scripts/node_modules/tsx/dist/loader.mjs \
            scripts/src/azure-mcp-publication.ts \
            "$RUNNER_TEMP/azure-mcp-discovery/discovery.json"
