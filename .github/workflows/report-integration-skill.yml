name: Consolidate one skill's integration reports
on:
  workflow_call:
    inputs:
      skill:
        required: true
        type: string
      permissions:
        type: string
        default: ""
      groups:
        type: string
        default: ""
jobs:
  report:
    environment: cideploytest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      copilot-requests: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_STAGE_SUBSCRIPTION_ID: ${{ vars.AZURE_STAGE_SUBSCRIPTION_ID }}
      REPORT_STORAGE_ACCOUNT: ${{ vars.REPORT_STORAGE_ACCOUNT }}
      REPORT_STORAGE_CONTAINER: ${{ github.event_name == 'schedule' && (vars.REPORT_STORAGE_CONTAINER || 'integration-reports') || (vars.MANUAL_REPORT_STORAGE_CONTAINER || 'manual-integration-reports') }}
      SKILL: ${{ inputs.skill }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
    defaults:
      run:
        working-directory: tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Authenticate stage storage
        uses: ./.github/actions/azure-profiles
        with:
          refresh: "true"
      - name: Build plugin output
        run: |
          cd ..
          npm ci --ignore-scripts
          npm run build
      - name: Setup Copilot CLI
        uses: mvkaran/setup-copilot-cli@d05a47209e6b3185c9c55702bef49f28e6eebef7 # v1
        with:
          token: ${{ github.token }}
      - name: Download private reports
        id: download
        continue-on-error: true
        run: npx tsx report-storage.ts download
      - name: Aggregate reports
        id: aggregate
        if: always() && steps.download.outcome != 'skipped'
        continue-on-error: true
        env:
          EXPECTED_PERMISSIONS: ${{ inputs.permissions }}
          EXPECTED_GROUPS: ${{ inputs.groups }}
        run: npx tsx aggregate-permission-results.ts
      - name: Generate skill report
        if: always() && steps.aggregate.outputs.has-results == 'true'
        run: npm run report -- --skill "${SKILL##*/}"
      - name: Publish consolidated reports privately
        if: always() && steps.aggregate.outputs.has-results == 'true'
        run: npx tsx report-storage.ts publish
      - name: Upload token usage to table
        if: always() && steps.aggregate.outputs.has-results == 'true'
        env:
          TOKEN_USAGE_STORAGE_ACCOUNT: ${{ vars.REPORT_STORAGE_ACCOUNT }}
          TOKEN_USAGE_TABLE_NAME: ${{ vars.TOKEN_USAGE_TABLE || 'integrationtokenusage' }}
          BRANCH: ${{ github.ref_name }}
        run: |
          export SKILL="${SKILL##*/}"
          npm run upload:token-usage
      - name: Upload tool usage to table
        if: always() && steps.aggregate.outputs.has-results == 'true'
        env:
          TOOL_USAGE_STORAGE_ACCOUNT: ${{ vars.REPORT_STORAGE_ACCOUNT }}
          TOOL_USAGE_TABLE_NAME: ${{ vars.TOOL_USAGE_TABLE || 'integrationtoolusage' }}
          BRANCH: ${{ github.ref_name }}
        run: |
          export SKILL="${SKILL##*/}"
          npm run upload:tool-usage
      - name: Stop profile refresh
        if: always()
        uses: ./.github/actions/stop-azure-profiles
      - name: Check report completeness
        if: always()
        env:
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          AGGREGATE_OUTCOME: ${{ steps.aggregate.outcome }}
        run: |
          if [ "$DOWNLOAD_OUTCOME" != success ] || [ "$AGGREGATE_OUTCOME" != success ]; then
            echo "::error::Private report download or aggregation failed; available results were preserved."
            exit 1
          fi
